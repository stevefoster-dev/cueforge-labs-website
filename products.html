<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | CueForge Labs - Built for the Road</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="CueForge Labs - Production software built by a touring LD. CuePatch, CueRoll, CueMaker, CueCheck, CueCapture, CuePack, and CueMapper. No subscriptions, works offline.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forge-dark: #060a0d;
      --forge-darker: #020305;
      --accent: #a78bfa;
      --accent-dim: rgba(167,139,250,0.15);
      --accent-mid: rgba(167,139,250,0.4);
      --accent-glow: rgba(167,139,250,0.2);
      --accent-bright: rgba(167,139,250,1);
      --forge-cyan: #c4b5fd;
      --trace-dim: rgba(167,139,250,0.15);
      --trace-color: rgba(167,139,250,0.4);
      --trace-glow: rgba(167,139,250,0.2);
      --trace-bright: rgba(167,139,250,1);
      --trace-bright-glow: rgba(167,139,250,0.6);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--forge-darker);
      color: #e5e7eb;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .nebula-bg {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(167,139,250,0.12) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 75% 20%, rgba(196,181,253,0.08) 0%, transparent 45%),
        radial-gradient(ellipse 70% 60% at 85% 70%, rgba(139,92,246,0.10) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 10% 80%, rgba(196,181,253,0.08) 0%, transparent 40%),
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(167,139,250,0.06) 0%, transparent 60%),
        var(--forge-darker);
    }

    /* Header */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 20px 160px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, var(--forge-darker) 0%, var(--forge-darker) 50%, transparent 100%);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      color: var(--accent); font-weight: 600; font-size: 1rem; text-decoration: none;
    }
    .logo svg { width: 28px; height: 22px; }
    .nav-btn {
      padding: 8px 20px; font-size: 0.75rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); background: transparent;
      border: 1px solid var(--accent-mid); border-radius: 4px;
      cursor: pointer; transition: all 0.3s; text-decoration: none;
    }
    .nav-btn:hover { background: var(--accent-dim); border-color: var(--accent); }

    /* Circuit Road */
    .circuit-road {
      position: fixed; top: 0; bottom: 0; left: 0; right: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .circuit-rail-left, .circuit-rail-right {
      position: absolute; top: 0; bottom: 0; width: 120px;
    }
    .circuit-rail-left { left: 20px; }
    .circuit-rail-right { right: 20px; }
    .circuit-rail-left svg, .circuit-rail-right svg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .road-trace {
      fill: none; stroke: var(--trace-color); stroke-width: 3;
      stroke-linecap: square; filter: drop-shadow(0 0 8px var(--trace-glow));
    }
    .road-pulse {
      position: absolute; width: 4px; height: 40px;
      background: linear-gradient(180deg, transparent, var(--accent), var(--forge-cyan), transparent);
      border-radius: 2px; box-shadow: 0 0 15px var(--accent);
      animation: road-pulse-flow 10s ease-in-out infinite;
    }
    .road-pulse.p1 { left: 30px; animation-delay: 0s; }
    .road-pulse.p2 { left: 60px; animation-delay: 3s; height: 30px; }
    .road-pulse.p3 { left: 90px; animation-delay: 6s; height: 50px; }
    .circuit-rail-right .road-pulse.p1 { left: auto; right: 30px; animation-delay: 1.5s; }
    .circuit-rail-right .road-pulse.p2 { left: auto; right: 60px; animation-delay: 4.5s; }
    .circuit-rail-right .road-pulse.p3 { left: auto; right: 90px; animation-delay: 7.5s; }
    @keyframes road-pulse-flow {
      0% { top: -50px; opacity: 0; }
      5% { opacity: 0.7; }
      95% { opacity: 0.7; }
      100% { top: 100%; opacity: 0; }
    }

    /* Page content */
    .page-container {
      max-width: 1100px; margin: 0 auto;
      padding: 140px 40px 80px;
      position: relative; z-index: 10;
    }

    /* Anvil header */
    .section-title { text-align: center; margin-bottom: 60px; }
    .anvil-header {
      position: relative; width: 100%; height: 280px;
      margin: 0 auto 20px; overflow: visible;
    }
    .anvil-header svg {
      position: absolute; left: 50%; top: 0;
      transform: translateX(-56%); width: 600px; height: 100%; overflow: visible;
    }
    .anvil-header svg path {
      fill: none; stroke: var(--accent); stroke-width: 6;
      filter: drop-shadow(0 0 10px var(--trace-glow)) drop-shadow(0 0 20px var(--trace-glow));
      opacity: 0.6;
    }
    .anvil-header .title-content {
      position: absolute; top: 50px; left: 0; right: 0; z-index: 2; text-align: center;
    }
    .section-title h1 { font-size: 2rem; font-weight: 300; color: #fff; }
    .section-title h1 span { color: var(--accent); font-weight: 600; }
    .section-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; color: rgba(255,255,255,0.5);
      text-transform: uppercase; letter-spacing: 0.12em; margin-top: 10px;
    }

    /* ═══════════════════════════════════════════ */
    /* Circuit Section — centered node layout      */
    /* ═══════════════════════════════════════════ */
    .circuit-section {
      position: relative;
      margin-bottom: 40px;
      --light-intensity: 0;
    }

    /* Top: centered node + label block */
    .node-block {
      display: flex; flex-direction: column; align-items: center;
      position: relative; z-index: 10;
      margin-bottom: 30px;
    }

    /* Big circular node */
    .circuit-node {
      position: relative; flex-shrink: 0;
      width: 200px; height: 200px;
    }
    .node-ring {
      position: absolute; inset: -12px; border-radius: 50%;
      border: 2px solid var(--trace-dim);
      transition: all 0.6s ease;
    }
    .node-body {
      position: relative; width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--forge-dark);
      border: 3px solid var(--trace-dim);
      overflow: hidden;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      transition: all 0.6s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .node-body img {
      width: 70%; height: 70%; object-fit: contain;
      opacity: 0.8; transition: opacity 0.6s;
    }

    /* Labels below node */
    .node-label {
      text-align: center; margin-top: 20px;
    }
    .node-label-title {
      font-size: 1.6rem; font-weight: 700; color: #fff;
      transition: all 0.6s;
    }
    .node-label-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; color: var(--accent); opacity: 0.7;
      text-transform: uppercase; letter-spacing: 0.1em;
      margin-top: 6px; transition: all 0.6s;
    }

    /* Credit tags below label */
    .node-credits {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 8px; margin-top: 14px; max-width: 500px;
    }
    .credit-tag {
      padding: 4px 12px; font-size: 0.7rem; font-weight: 500;
      color: var(--accent); background: var(--accent-dim);
      border: 1px solid rgba(167,139,250,0.2); border-radius: 4px;
      white-space: nowrap; transition: all 0.6s;
    }
    .credit-tag.coming-soon {
      color: #fbbf24; background: rgba(251,191,36,0.15);
      border-color: rgba(251,191,36,0.3);
    }
    .credit-tag.subscription {
      color: #38bdf8; background: rgba(56,189,248,0.15);
      border-color: rgba(56,189,248,0.3);
    }

    /* Lit states */
    .circuit-section.lit .node-ring {
      border-color: var(--trace-color);
      box-shadow: 0 0 calc(40px * var(--light-intensity)) var(--trace-glow),
                  inset 0 0 calc(25px * var(--light-intensity)) var(--trace-glow);
    }
    .circuit-section.lit .node-body {
      border-color: var(--accent);
      box-shadow: 0 0 calc(60px * var(--light-intensity)) rgba(167,139,250,0.3),
                  inset 0 0 30px rgba(0,0,0,0.6);
    }
    .circuit-section.lit .node-body img {
      opacity: calc(0.8 + 0.2 * var(--light-intensity));
    }
    .circuit-section.lit .node-label-title {
      text-shadow: 0 0 calc(20px * var(--light-intensity)) var(--trace-glow);
    }
    .circuit-section.lit .node-label-sub {
      opacity: calc(0.5 + 0.5 * var(--light-intensity));
    }
    .circuit-section.lit .credit-tag {
      background: rgba(167,139,250, calc(0.1 + 0.1 * var(--light-intensity)));
      border-color: rgba(167,139,250, calc(0.2 + 0.3 * var(--light-intensity)));
      box-shadow: 0 0 calc(8px * var(--light-intensity)) rgba(167,139,250,0.15);
    }

    /* ═══════════════════════════════════════════ */
    /* Detail traces — branching out from center   */
    /* ═══════════════════════════════════════════ */
    .detail-traces {
      position: relative;
      width: 100%;
      padding: 0 24px;
    }

    /* Vertical bus rails — guardrails on left & right */
    .bus-rail {
      position: absolute; top: 0; bottom: 0;
      width: 3px;
      background: var(--trace-dim);
      border-radius: 2px;
      transition: all 0.5s;
      z-index: 1;
    }
    .bus-rail-left { left: 0; }
    .bus-rail-right { right: 0; }
    .circuit-section.lit .bus-rail {
      background: var(--trace-color);
      box-shadow: 0 0 8px var(--trace-glow);
    }

    /* Solder caps at top/bottom of bus rails */
    .bus-rail::before, .bus-rail::after {
      content: ''; position: absolute; left: 50%; transform: translateX(-50%);
      width: 11px; height: 11px;
      background: var(--forge-darker);
      border: 2px solid var(--trace-dim);
      border-radius: 50%;
      transition: all 0.5s;
    }
    .bus-rail::before { top: -5px; }
    .bus-rail::after { bottom: -5px; }
    .circuit-section.lit .bus-rail::before,
    .circuit-section.lit .bus-rail::after {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(167,139,250,0.4);
      background: rgba(167,139,250,0.1);
    }

    /* Pulse traveling down bus rails */
    .bus-pulse {
      position: absolute; left: -1px;
      width: 5px; height: 25px;
      background: linear-gradient(180deg, transparent, var(--forge-cyan), var(--accent), transparent);
      border-radius: 2px; opacity: 0;
      box-shadow: 0 0 12px var(--accent);
    }
    .bus-pulse.bp-1 { animation: bus-flow 5s ease-in-out infinite; }
    .bus-pulse.bp-2 { animation: bus-flow 4s ease-in-out infinite; animation-delay: 2s; height: 18px; }
    .circuit-section:not(.lit) .bus-pulse { animation: none !important; opacity: 0 !important; }
    @keyframes bus-flow {
      0% { top: -25px; opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { top: 100%; opacity: 0; }
    }

    /* Junction dots — sit on the bus rail at each detail row */
    .bus-junction-dot {
      position: absolute;
      width: 11px; height: 11px;
      background: var(--forge-darker);
      border: 2px solid var(--trace-dim);
      border-radius: 50%;
      top: 7px;
      z-index: 3;
      transition: all 0.5s;
    }
    .row-left .bus-junction-dot { left: -5px; }
    .row-right .bus-junction-dot { right: -5px; left: auto; }
    .detail-row.row-lit .bus-junction-dot {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(167,139,250,0.5);
      background: rgba(167,139,250,0.15);
    }

    /* Each detail row = trace line + text */
    .detail-row {
      position: relative;
      display: flex;
      align-items: flex-start;
      margin-bottom: 28px;
      --row-intensity: 0;
      opacity: calc(0.25 + 0.75 * var(--row-intensity));
      transition: opacity 0.4s ease;
    }

    /* Alternating left/right — traces reach to bus rails */
    .detail-row.row-left {
      flex-direction: row;
      padding-left: 28px;
    }
    .detail-row.row-right {
      flex-direction: row-reverse;
      padding-right: 28px;
    }

    /* Trace line graphic */
    .trace-line {
      flex-shrink: 0;
      width: 120px; height: 3px;
      margin-top: 10px;
      position: relative;
    }
    .trace-line svg {
      width: 100%; height: 24px;
      position: absolute; top: -10px; left: 0;
    }
    .trace-line-path {
      fill: none; stroke: var(--trace-dim);
      stroke-width: 2.5; stroke-linecap: square;
      transition: all 0.5s;
    }
    .detail-row.row-lit .trace-line-path {
      stroke: var(--trace-bright);
      filter: drop-shadow(0 0 6px var(--trace-bright-glow));
    }

    /* Solder point at start of trace */
    .solder-dot {
      position: absolute; top: -3px;
      width: 9px; height: 9px;
      background: var(--forge-darker);
      border: 2px solid var(--trace-dim);
      border-radius: 50%;
      transition: all 0.5s;
    }
    .row-left .solder-dot { left: -4px; }
    .row-right .solder-dot { right: -4px; left: auto; }
    .detail-row.row-lit .solder-dot {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(167,139,250,0.5);
      background: rgba(167,139,250,0.15);
    }

    /* Energy dot traveling the trace */
    .trace-energy {
      position: absolute; top: -2px;
      width: 20px; height: 7px;
      background: linear-gradient(90deg, transparent, var(--forge-cyan), var(--accent), transparent);
      border-radius: 3px; opacity: 0;
      box-shadow: 0 0 10px var(--accent);
    }
    .row-left .trace-energy { animation: energy-right 3s ease-in-out infinite; }
    .row-right .trace-energy { animation: energy-left 3s ease-in-out infinite; }
    .detail-row:not(.row-lit) .trace-energy { animation: none !important; opacity: 0 !important; }
    @keyframes energy-right {
      0% { left: 0; opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { left: 100%; opacity: 0; }
    }
    @keyframes energy-left {
      0% { right: 0; opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% { right: 100%; opacity: 0; }
    }

    /* Detail text card — circuit border */
    .detail-card {
      flex: 1; max-width: 420px;
      font-size: 0.85rem; color: #9ca3af; line-height: 1.75;
      background: rgba(6,10,13,0.85);
      border: 1px solid var(--trace-dim);
      border-radius: 0;
      padding: 16px 20px;
      position: relative;
      transition: all 0.5s;
    }
    .detail-row.row-lit .detail-card {
      color: rgba(255,255,255, calc(0.5 + 0.3 * var(--row-intensity)));
      border-color: rgba(167,139,250, calc(0.15 + 0.2 * var(--row-intensity)));
      background: rgba(167,139,250, calc(0.02 + 0.03 * var(--row-intensity)));
    }
    .detail-card strong {
      color: var(--accent); font-weight: 600;
    }
    .detail-card h4 {
      color: #fff; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px;
    }
    .detail-card ul {
      list-style: none; margin: 0; padding: 0;
    }
    .detail-card ul li {
      padding: 3px 0; font-size: 0.82rem;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .detail-card ul li::before { content: '✓'; color: var(--accent); font-weight: 600; flex-shrink: 0; }

    /* Corner brackets */
    .detail-card::before, .detail-card::after {
      content: ''; position: absolute;
      width: 16px; height: 16px; pointer-events: none;
      transition: all 0.5s;
    }
    .detail-card::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--trace-dim);
      border-left: 2px solid var(--trace-dim);
    }
    .detail-card::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--trace-dim);
      border-right: 2px solid var(--trace-dim);
    }
    .detail-row.row-lit .detail-card::before,
    .detail-row.row-lit .detail-card::after {
      border-color: var(--accent);
      filter: drop-shadow(0 0 4px var(--trace-glow));
    }

    /* Corner solder nodes on cards */
    .card-node {
      position: absolute;
      width: 7px; height: 7px;
      background: var(--forge-darker);
      border: 2px solid var(--trace-dim);
      border-radius: 50%;
      transition: all 0.5s;
      z-index: 2;
    }
    .card-node.tl { top: -4px; left: -4px; }
    .card-node.br { bottom: -4px; right: -4px; }
    .card-node.tr { top: -4px; right: -4px; }
    .card-node.bl { bottom: -4px; left: -4px; }
    .detail-row.row-lit .card-node {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(167,139,250,0.4);
      background: rgba(167,139,250,0.15);
    }

    /* Pricing CTA in detail card */
    .pricing-cta {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid rgba(167,139,250,0.15);
    }
    .pricing-cta .price {
      font-size: 1.4rem; font-weight: 700; color: #fff;
    }
    .pricing-cta .price-note {
      font-size: 0.75rem; color: #6b7280; margin-bottom: 10px;
    }
    .btn-buy {
      display: inline-block;
      padding: 10px 24px; font-size: 0.8rem; font-weight: 600;
      color: var(--forge-darker); background: var(--accent);
      border: none; border-radius: 4px; text-decoration: none;
      transition: all 0.3s;
    }
    .btn-buy:hover {
      filter: brightness(1.15);
      box-shadow: 0 4px 20px var(--trace-bright-glow);
    }

    /* ═══════════════════════════════════════════ */
    /* Section connector                           */
    /* ═══════════════════════════════════════════ */
    .section-connector {
      display: flex; flex-direction: column; align-items: center;
      height: 80px; margin: 10px 0 40px;
      position: relative;
    }
    .connector-stem {
      width: 3px; flex: 1;
      background: var(--trace-dim);
      border-radius: 2px;
      position: relative; overflow: hidden;
      transition: all 0.5s;
    }
    .circuit-section.lit + .section-connector .connector-stem {
      background: var(--trace-color);
      box-shadow: 0 0 10px var(--trace-glow);
    }
    .connector-dot {
      width: 11px; height: 11px;
      background: var(--forge-darker);
      border: 2px solid var(--trace-dim);
      border-radius: 50%;
      transition: all 0.5s;
    }
    .circuit-section.lit + .section-connector .connector-dot {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--trace-glow);
    }
    .connector-pulse-anim {
      position: absolute; left: -1px;
      width: 5px; height: 20px;
      background: linear-gradient(180deg, transparent, var(--forge-cyan), var(--accent), transparent);
      border-radius: 2px; opacity: 0;
      box-shadow: 0 0 12px var(--accent);
      animation: conn-pulse 3s ease-in-out infinite;
    }
    .connector-pulse-anim:nth-child(2) { animation-delay: 1.5s; }
    @keyframes conn-pulse {
      0% { top: -20px; opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { top: calc(100% + 10px); opacity: 0; }
    }

    /* Contact — circuit border */
    .contact-section {
      margin: 60px auto 0; text-align: center;
      max-width: 700px;
      padding: 50px 40px; border: 1px solid var(--accent-dim);
      border-radius: 0; background: rgba(6,10,13,0.85);
      position: relative;
    }
    /* Corner brackets */
    .contact-section::before, .contact-section::after {
      content: ''; position: absolute;
      width: 24px; height: 24px; pointer-events: none;
    }
    .contact-section::before {
      top: -1px; left: -1px;
      border-top: 3px solid var(--accent);
      border-left: 3px solid var(--accent);
      filter: drop-shadow(0 0 6px var(--trace-glow));
    }
    .contact-section::after {
      bottom: -1px; right: -1px;
      border-bottom: 3px solid var(--accent);
      border-right: 3px solid var(--accent);
      filter: drop-shadow(0 0 6px var(--trace-glow));
    }
    .contact-section h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .contact-section p { color: #9ca3af; margin-bottom: 24px; font-size: 0.95rem; }
    .contact-links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    /* Corner solder nodes on contact box */
    .contact-node {
      position: absolute;
      width: 9px; height: 9px;
      background: rgba(167,139,250,0.15);
      border: 2px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(167,139,250,0.4);
      z-index: 2;
    }
    .contact-node.ctl { top: -5px; left: -5px; }
    .contact-node.ctr { top: -5px; right: -5px; }
    .contact-node.cbl { bottom: -5px; left: -5px; }
    .contact-node.cbr { bottom: -5px; right: -5px; }

    /* Trace lines along top/bottom edges of contact box */
    .contact-trace {
      position: absolute; height: 2px;
      background: var(--trace-color);
      box-shadow: 0 0 6px var(--trace-glow);
    }

      color: var(--forge-darker); background: var(--accent);
      border: none; border-radius: 4px; text-decoration: none; transition: all 0.3s;
    }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 8px 30px var(--trace-bright-glow); }

    .btn-secondary {
      padding: 14px 36px; font-size: 0.9rem; font-weight: 600;
      color: var(--accent); background: transparent;
      border: 1px solid var(--accent-mid); border-radius: 4px;
      text-decoration: none; transition: all 0.3s;
    }
    .btn-secondary:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    footer {
      text-align: center; padding: 30px; color: #4b5563; font-size: 0.75rem;
      border-top: 1px solid rgba(167,139,250,0.06); margin-top: 40px;

    footer a { color: var(--accent); text-decoration: none; }

    /* ═══════════════ Responsive ═══════════════ */
    @media (max-width: 900px) {
      .circuit-rail-left, .circuit-rail-right { width: 80px; opacity: 0.3; }
      .circuit-rail-left { left: -10px; }
      .circuit-rail-right { right: -10px; }
      .circuit-node { width: 160px; height: 160px; }

      .logo span { display: none; }
      .page-container { padding: 100px 15px 60px; }
      .section-title h1 { font-size: 1.6rem; }

      .detail-row.row-left,
      .detail-row.row-right {
        flex-direction: column !important;
        align-items: center;
        padding: 0 10px;
      }
      .trace-line { display: none; }
      .bus-rail { display: none; }
      .bus-junction { display: none; }
      .detail-traces { padding: 0; }
      .detail-card {
        max-width: 100%; text-align: center;
      }

      .circuit-road { opacity: 0.3; }
      .circuit-rail-left, .circuit-rail-right { width: 50px; }
      .contact-section { padding: 30px 20px; margin: 40px 10px 0; }
      .contact-section h2 { font-size: 1.2rem; }
      .btn-primary, .btn-secondary { padding: 12px 24px; font-size: 0.8rem; }
      .contact-links { gap: 10px; }

    @media (max-width: 400px) {

      .detail-card { font-size: 0.8rem; padding: 10px 14px; }

            title: "Who It's For",
            items: ['Production Managers planning logistics', 'Trucking Coordinators optimizing loads', 'Rental Houses tracking gear inventory', 'Festival & Stadium builds with crane planning']
          },
          {
            title: 'System Requirements',
            items: ['Modern web browser', 'Works on desktop and mobile', 'Offline-capable for warehouse use']
          },
          {
            title: 'Pricing',
            pricing: { prices: ['$249/mo / $699/mo / $1,499/mo'], note: 'Pro · Team · Enterprise' },
            cta: { text: 'View CuePack →', href: 'cuepack.html' }
          }
        ]
      },
      {
        title: 'CueMapper',
        subtitle: 'Projection Mapping Toolkit',
        image: 'images/products/cuemapper.png',
        credits: ['macOS', 'Windows', 'Python/OpenCV'],
        details: [
          {
            title: 'Key Features',
            items: ['Gray code structured light scanning', 'Correspondence mapping (camera → projector)', 'Real-time content warping', 'Save/load calibrations across sessions', 'Any USB camera support', 'Hackable Python codebase']
          },
          {
            title: "Who It's For",
            items: ['Scenic Designers projecting on irregular surfaces', 'Installation Artists building mapped experiences', 'Researchers & Educators teaching computer vision', 'Event Producers doing quick projection mapping']
          },
          {
            title: 'System Requirements',
            items: ['macOS 12+ (Apple Silicon native)', 'Windows 10/11 (64-bit)', '8GB RAM recommended', 'USB webcam (1080p+) for scanning']
          },
          {
            title: 'Pricing',
            pricing: { prices: ['$349'], note: 'One-time license · 2 machine activations' },
            cta: { text: 'Buy CueMapper →', href: 'cuemapper.html' }
          }
        ]
      }
    ];

    const container = document.getElementById('product-entries');

    productSections.forEach((section, sIndex) => {
      // Create section wrapper
      const sectionEl = document.createElement('div');
      sectionEl.className = 'circuit-section';
      sectionEl.dataset.index = sIndex;

      // Build credit tags HTML with optional styles
      let creditHTML = '';
      if (section.credits.length > 0) {
        creditHTML = '<div class="node-credits">';
        section.credits.forEach((c, i) => {
          const style = section.creditStyles && section.creditStyles[i] ? section.creditStyles[i] : '';
          creditHTML += `<span class="credit-tag ${style}">${c}</span>`;
        });
        creditHTML += '</div>';
      }

      // Build detail rows — alternating left/right
      let detailHTML = '';
      section.details.forEach((detail, dIndex) => {
        const side = dIndex % 2 === 0 ? 'row-left' : 'row-right';
        const delay = (dIndex * 0.6).toFixed(1);

        // Random trace path variations
        const jog1 = 20 + Math.random() * 25;
        const jog2 = jog1 + 20 + Math.random() * 30;
        const jogY = -4 + Math.random() * 8;

        let cardContent = '';
        if (detail.title) {
          cardContent += `<h4>${detail.title}</h4>`;
        }
        if (detail.items) {
          cardContent += '<ul>' + detail.items.map(item => `<li>${item}</li>`).join('') + '</ul>';
        }
        if (detail.pricing) {
          cardContent += `<div class="pricing-cta">
            <div class="price">${detail.pricing.prices.join(' / ')}</div>
            <div class="price-note">${detail.pricing.note}</div>
            ${detail.cta ? `<a href="${detail.cta.href}" class="btn-buy">${detail.cta.text}</a>` : ''}
          </div>`;
        }

        detailHTML += `
          <div class="detail-row ${side}">
            <div class="bus-junction-dot"></div>
            <div class="trace-line">
              <div class="solder-dot"></div>
              <svg viewBox="0 0 120 24" preserveAspectRatio="none">
                <path class="trace-line-path" d="M 0 12 H ${jog1} V ${12 + jogY} H ${jog2} L ${jog2 + 10} 12 H 120"/>
              </svg>
              <div class="trace-energy" style="animation-delay: ${delay}s"></div>
            </div>
            <div class="detail-card">
              <div class="card-node tl"></div>
              <div class="card-node br"></div>
              ${cardContent}
            </div>
          </div>
        `;
      });

      sectionEl.innerHTML = `
        <div class="node-block">
          <div class="circuit-node">
            <div class="node-ring"></div>
            <div class="node-body">
              <img src="${section.image}" alt="${section.title}">
            </div>
          </div>
          <div class="node-label">
            <div class="node-label-title">${section.title}</div>
            <div class="node-label-sub">${section.subtitle}</div>
          </div>
          ${creditHTML}
        </div>
        <div class="detail-traces">
          <div class="bus-rail bus-rail-left">
            <div class="bus-pulse bp-1"></div>
            <div class="bus-pulse bp-2"></div>
          </div>
          <div class="bus-rail bus-rail-right">
            <div class="bus-pulse bp-1"></div>
            <div class="bus-pulse bp-2"></div>
          </div>
          ${detailHTML}
        </div>
      `;

      container.appendChild(sectionEl);

      // Add connector between sections (not after last)
      if (sIndex < productSections.length - 1) {
        const conn = document.createElement('div');
        conn.className = 'section-connector';
        conn.innerHTML = `
          <div class="connector-dot"></div>
          <div class="connector-stem">
            <div class="connector-pulse-anim"></div>
            <div class="connector-pulse-anim"></div>
          </div>
          <div class="connector-dot"></div>
        `;
        container.appendChild(conn);
      }
    });

    // Scroll-based lighting — per detail row + section photo stays bright
    const sections = document.querySelectorAll('.circuit-section');

    function updateLighting() {
      const vh = window.innerHeight;
      // "Hot zone" for detail rows: middle 60% of viewport
      const hotTop = vh * 0.15;
      const hotBottom = vh * 0.85;

      sections.forEach(section => {
        const sectionRect = section.getBoundingClientRect();

        // Section is "in view" if any part overlaps the viewport
        const sectionInView = sectionRect.top < vh && sectionRect.bottom > 0;

        // Photo node: full bright while ANY part of section is in view
        if (sectionInView) {
          // Intensity based on how centered the section is
          const sectionCenter = sectionRect.top + sectionRect.height / 2;
          const distFromCenter = Math.abs(sectionCenter - vh * 0.4);
          const maxDist = vh * 0.9;
          const sectionIntensity = Math.max(0, 1 - (distFromCenter / maxDist));

          // Keep photo at high brightness when section is anywhere in view
          const photoIntensity = Math.max(0.6, sectionIntensity);
          section.style.setProperty('--light-intensity', photoIntensity);
          section.classList.add('lit');
        } else {
          section.style.setProperty('--light-intensity', 0);
          section.classList.remove('lit');
        }

        // Per detail row lighting
        const rows = section.querySelectorAll('.detail-row');
        rows.forEach(row => {
          const rowRect = row.getBoundingClientRect();
          const rowCenter = rowRect.top + rowRect.height / 2;

          // Row is "hot" when its center is in the hot zone
          if (rowCenter > hotTop && rowCenter < hotBottom) {
            // Intensity peaks in the middle of the hot zone
            const zoneCenter = (hotTop + hotBottom) / 2;
            const zoneHalf = (hotBottom - hotTop) / 2;
            const dist = Math.abs(rowCenter - zoneCenter);
            const intensity = Math.max(0, 1 - (dist / zoneHalf));

            row.style.setProperty('--row-intensity', intensity);
            if (intensity > 0.15) {
              row.classList.add('row-lit');
            } else {
              row.classList.remove('row-lit');
            }
          } else {
            row.style.setProperty('--row-intensity', 0);
            row.classList.remove('row-lit');
          }
        });
      });
    }

    window.addEventListener('scroll', updateLighting, { passive: true });
    window.addEventListener('resize', updateLighting, { passive: true });
    setTimeout(updateLighting, 100);
    setTimeout(updateLighting, 500);
  </script>
