<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueForge Labs | Software Products</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="CueForge Labs - Production software tools. CueRoll, CueMaker, CuePatch, and CueCheck. Built by a touring LD.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forge-dark: #060a0d;
      --forge-darker: #020305;
      --forge-teal: #a78bfa;
      --forge-cyan: #c4b5fd;
      --forge-lavender: #a78bfa;
      --forge-amber: #f59e0b;
      --trace-dim: rgba(167,139,250,0.15);
      --trace-color: rgba(167,139,250,0.4);
      --trace-glow: rgba(167,139,250,0.2);
      --trace-bright: rgba(167,139,250,1);
      --trace-bright-glow: rgba(167,139,250,0.6);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--forge-darker);
      color: #e5e7eb;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Subtle nebula background */
    .nebula-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(167,139,250,0.15) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 75% 20%, rgba(196,181,253,0.12) 0%, transparent 45%),
        radial-gradient(ellipse 70% 60% at 85% 70%, rgba(167,139,250,0.14) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 10% 80%, rgba(196,181,253,0.10) 0%, transparent 40%),
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(167,139,250,0.08) 0%, transparent 60%),
        var(--forge-darker);
    }
    
    /* Header */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px 160px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, var(--forge-darker) 0%, var(--forge-darker) 50%, transparent 100%);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--forge-teal);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
    }
    .logo svg { width: 28px; height: 22px; }
    .nav-btn {
      padding: 8px 20px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--forge-lavender);
      background: transparent;
      border: 1px solid var(--trace-color);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .nav-btn:hover {
      background: rgba(167,139,250,0.12);
      border-color: var(--forge-lavender);
    }

    /* Circuit Road - vertical guardrails */
    .circuit-road {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .circuit-rail-left, .circuit-rail-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 120px;
    }
    .circuit-rail-left { left: 20px; }
    .circuit-rail-right { right: 20px; }
    .circuit-rail-left svg, .circuit-rail-right svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .road-trace {
      fill: none;
      stroke: var(--trace-color);
      stroke-width: 3;
      stroke-linecap: square;
      filter: drop-shadow(0 0 8px var(--trace-glow));
    }
    .road-pulse {
      position: absolute;
      width: 4px;
      height: 40px;
      background: linear-gradient(180deg, transparent, var(--forge-cyan), var(--forge-teal), transparent);
      border-radius: 2px;
      box-shadow: 0 0 15px var(--forge-teal);
      animation: road-pulse-flow 10s ease-in-out infinite;
    }
    .road-pulse.p1 { left: 30px; animation-delay: 0s; }
    .road-pulse.p2 { left: 60px; animation-delay: 3s; height: 30px; }
    .road-pulse.p3 { left: 90px; animation-delay: 6s; height: 50px; }
    .circuit-rail-right .road-pulse.p1 { left: auto; right: 30px; animation-delay: 1.5s; }
    .circuit-rail-right .road-pulse.p2 { left: auto; right: 60px; animation-delay: 4.5s; }
    .circuit-rail-right .road-pulse.p3 { left: auto; right: 90px; animation-delay: 7.5s; }
    @keyframes road-pulse-flow {
      0% { top: -50px; opacity: 0; }
      5% { opacity: 0.7; }
      95% { opacity: 0.7; }
      100% { top: 100%; opacity: 0; }
    }

    /* Portfolio Container */
    .portfolio-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 120px 60px 80px;
      position: relative;
      z-index: 10;
    }
    
    /* Section Title with Anvil */
    .section-title {
      text-align: center;
      margin-bottom: 80px;
      position: relative;
    }
    .anvil-header {
      position: relative;
      width: 100%;
      height: 280px;
      margin: 0 auto 20px;
      overflow: visible;
    }
    .anvil-header svg {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-56%);
      width: 600px;
      height: 100%;
      overflow: visible;
    }
    .anvil-header svg path {
      fill: none;
      stroke: var(--forge-teal);
      stroke-width: 6;
      filter: drop-shadow(0 0 10px var(--trace-glow)) drop-shadow(0 0 20px var(--trace-glow));
      opacity: 0.6;
    }
    .anvil-header .title-content {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
    }
    .section-title h1 {
      font-size: 2rem;
      font-weight: 300;
      color: #fff;
      margin: 0;
      line-height: 1.2;
    }
    .section-title h1 span {
      color: var(--forge-teal);
      font-weight: 600;
    }
    .section-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 10px;
    }
    
    @media (max-width: 500px) {
      .anvil-header {
        width: 320px;
        height: 200px;
      }
      .anvil-header .title-content {
        top: 25px;
      }
      .section-title h1 {
        font-size: 1.5rem;
      }
    }

    /* Circuit Entry */
    .circuit-entry {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: clamp(80px, 10vw, 120px);
      min-height: clamp(200px, 25vw, 280px);
      z-index: 10;
    }
    .circuit-entry.node-left {
      flex-direction: row;
      padding-left: clamp(20px, 4vw, 40px);
    }
    .circuit-entry.node-right {
      flex-direction: row-reverse;
      padding-right: clamp(20px, 4vw, 40px);
    }
    
    /* Circular Node */
    .circuit-node {
      position: relative;
      flex-shrink: 0;
      width: clamp(160px, 22vw, 280px);
      height: clamp(160px, 22vw, 280px);
      z-index: 10;
    }
    .node-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2px solid var(--trace-dim);
      transition: all 0.6s ease;
    }
    .node-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--forge-dark);
      border: 3px solid var(--trace-dim);
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
      transition: all 0.6s ease;
    }
    .node-body img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      transition: opacity 0.6s;
    }
    .node-body.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2.5rem, 5vw, 5rem);
      color: var(--trace-dim);
    }
    
    /* Lit state - intensity-based crossfade */
    .circuit-entry {
      --light-intensity: 0;
    }
    .circuit-entry .node-ring,
    .circuit-entry .node-body,
    .circuit-entry .node-body img,
    .circuit-entry .data-node,
    .circuit-entry .trace-path,
    .circuit-entry .solder-point,
    .circuit-entry .data-value {
      transition: all 0.3s ease;
    }
    .circuit-entry.lit .node-ring {
      border-color: var(--trace-color);
      box-shadow: 0 0 calc(30px * var(--light-intensity)) var(--trace-glow), inset 0 0 calc(20px * var(--light-intensity)) var(--trace-glow);
      opacity: calc(0.4 + 0.6 * var(--light-intensity));
    }
    .circuit-entry.lit .node-body {
      border-color: var(--forge-teal);
      box-shadow: 0 0 calc(50px * var(--light-intensity)) rgba(56,199,204,0.3), inset 0 0 30px rgba(0,0,0,0.6);
    }
    .circuit-entry.lit .node-body img { opacity: calc(0.5 + 0.5 * var(--light-intensity)); }
    .circuit-entry.lit .node-body.no-image {
      color: var(--forge-teal);
      text-shadow: 0 0 calc(40px * var(--light-intensity)) var(--forge-teal);
    }
    .circuit-entry.lit .data-node { opacity: calc(0.3 + 0.7 * var(--light-intensity)); }
    .circuit-entry.lit .trace-path { opacity: calc(0.3 + 0.7 * var(--light-intensity)); }
    
    /* Circuit Traces */
    .circuit-traces {
      position: relative;
      flex: 1;
      height: clamp(200px, 25vw, 280px);
      padding: 20px 0;
    }
    .trace-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .trace-path {
      fill: none;
      stroke: var(--trace-dim);
      stroke-width: 2;
      stroke-linecap: square;
      transition: stroke 0.6s ease, filter 0.6s ease;
    }
    .circuit-entry.lit .trace-path {
      stroke: var(--trace-bright);
      filter: drop-shadow(0 0 8px var(--trace-bright-glow));
    }
    
    /* Data nodes */
    .data-node {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.4;
      transition: opacity 0.6s ease;
    }
    .circuit-entry.lit .data-node { opacity: 1; }
    .node-right .data-node { flex-direction: row-reverse; }
    
    .solder-point {
      width: clamp(6px, 0.8vw, 10px);
      height: clamp(6px, 0.8vw, 10px);
      background: var(--forge-darker);
      border: 2px solid var(--trace-dim);
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.6s;
    }
    .circuit-entry.lit .solder-point {
      border-color: var(--forge-teal);
      box-shadow: 0 0 12px rgba(56,199,204,0.5);
    }
    
    .data-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.55rem, 0.9vw, 0.75rem);
      color: rgba(255,255,255,0.5);
      background: rgba(6,10,13,0.9);
      padding: clamp(4px, 0.5vw, 6px) clamp(8px, 1vw, 12px);
      border: 1px solid var(--trace-dim);
      border-radius: 3px;
      white-space: nowrap;
      transition: all 0.6s;
    }
    .circuit-entry.lit .data-value {
      color: rgba(255,255,255,0.7);
      border-color: rgba(56,199,204,0.3);
    }
    .data-value.artist {
      font-size: clamp(1rem, 1.8vw, 1.4rem);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      padding: clamp(6px, 0.8vw, 10px) clamp(10px, 1.2vw, 16px);
    }
    .circuit-entry.lit .data-value.artist {
      color: #fff;
      border-color: var(--forge-teal);
      background: rgba(56,199,204,0.1);
      box-shadow: 0 0 20px rgba(56,199,204,0.2);
    }
    .data-value.show {
      font-size: clamp(0.65rem, 1vw, 0.85rem);
      font-weight: 500;
    }
    .circuit-entry.lit .data-value.show { color: var(--forge-teal); }
    .data-value.year {
      font-size: clamp(0.6rem, 0.9vw, 0.8rem);
    }
    .circuit-entry.lit .data-value.year {
      color: var(--forge-cyan);
      background: rgba(34,211,238,0.1);
      border-color: rgba(34,211,238,0.4);
    }
    .data-value .label {
      color: rgba(255,255,255,0.25);
      font-size: clamp(0.45rem, 0.6vw, 0.6rem);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 2px;
    }
    .data-value.role-value {
      font-size: clamp(0.7rem, 1.1vw, 0.9rem);
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      background: rgba(167,139,250,0.05);
      border-color: rgba(167,139,250,0.2);
    }
    .circuit-entry.lit .data-value.role-value {
      color: #fff;
      background: rgba(167,139,250,0.12);
      border-color: rgba(167,139,250,0.4);
      box-shadow: 0 0 15px rgba(167,139,250,0.15);
    }
    .data-value.collab-value {
      font-size: clamp(0.5rem, 0.7vw, 0.65rem);
      color: rgba(255,255,255,0.3);
      background: transparent;
      border: none;
      padding: 2px 8px;
    }
    .circuit-entry.lit .data-value.collab-value {
      color: rgba(255,255,255,0.4);
    }
    .data-value.description-value {
      font-size: clamp(0.65rem, 0.95vw, 0.85rem);
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      background: rgba(167,139,250,0.05);
      border-color: rgba(167,139,250,0.15);
      white-space: normal;
      max-width: 280px;
      line-height: 1.4;
    }
    .circuit-entry.lit .data-value.description-value {
      color: rgba(255,255,255,0.8);
      background: rgba(167,139,250,0.08);
      border-color: rgba(167,139,250,0.3);
    }
    .data-value.price-value {
      font-size: clamp(1.2rem, 2vw, 1.6rem);
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      color: var(--forge-lavender);
      background: rgba(167,139,250,0.15);
      border: 2px solid rgba(167,139,250,0.4);
      padding: clamp(8px, 1vw, 12px) clamp(16px, 2vw, 24px);
      border-radius: 6px;
      text-shadow: 0 0 20px rgba(167,139,250,0.5);
    }
    .circuit-entry.lit .data-value.price-value {
      color: #fff;
      background: rgba(167,139,250,0.25);
      border-color: var(--forge-lavender);
      box-shadow: 0 0 30px rgba(167,139,250,0.4);
    }
    
    /* Energy pulses */
    .energy-pulse {
      position: absolute;
      width: 30px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--forge-cyan), var(--forge-teal), transparent);
      border-radius: 2px;
      opacity: 0;
      filter: blur(1px);
      box-shadow: 0 0 15px var(--forge-cyan);
      pointer-events: none;
    }
    .node-left .energy-pulse.pulse-1 { top: 18%; animation: pulse-right-1 4s ease-in-out infinite; }
    .node-left .energy-pulse.pulse-2 { top: 38%; width: 40px; animation: pulse-right-2 5s ease-in-out infinite; animation-delay: 1.2s; }
    .node-left .energy-pulse.pulse-3 { top: 60%; width: 25px; animation: pulse-right-3 3.5s ease-in-out infinite; animation-delay: 2.5s; }
    @keyframes pulse-right-1 { 0% { left: 0; opacity: 0; } 10% { opacity: 0.9; } 85% { opacity: 0.9; } 100% { left: 70%; opacity: 0; } }
    @keyframes pulse-right-2 { 0% { left: 0; opacity: 0; } 12% { opacity: 0.7; } 80% { opacity: 0.7; } 100% { left: 65%; opacity: 0; } }
    @keyframes pulse-right-3 { 0% { left: 0; opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { left: 75%; opacity: 0; } }
    .node-right .energy-pulse { background: linear-gradient(270deg, transparent, var(--forge-cyan), var(--forge-teal), transparent); }
    .node-right .energy-pulse.pulse-1 { top: 18%; animation: pulse-left-1 4s ease-in-out infinite; }
    .node-right .energy-pulse.pulse-2 { top: 38%; width: 40px; animation: pulse-left-2 5s ease-in-out infinite; animation-delay: 1.2s; }
    .node-right .energy-pulse.pulse-3 { top: 60%; width: 25px; animation: pulse-left-3 3.5s ease-in-out infinite; animation-delay: 2.5s; }
    @keyframes pulse-left-1 { 0% { right: 0; opacity: 0; } 10% { opacity: 0.9; } 85% { opacity: 0.9; } 100% { right: 70%; opacity: 0; } }
    @keyframes pulse-left-2 { 0% { right: 0; opacity: 0; } 12% { opacity: 0.7; } 80% { opacity: 0.7; } 100% { right: 65%; opacity: 0; } }
    @keyframes pulse-left-3 { 0% { right: 0; opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { right: 75%; opacity: 0; } }
    .circuit-entry:not(.lit) .energy-pulse { animation: none !important; opacity: 0 !important; }
    
    /* Connectors */
    .entry-connector {
      position: absolute;
      bottom: calc(-1 * clamp(80px, 10vw, 120px));
      width: 200px;
      height: clamp(80px, 10vw, 120px);
      z-index: 5;
    }
    .node-left .entry-connector { left: calc(clamp(160px, 22vw, 280px) / 2 + clamp(20px, 4vw, 40px) - 100px); }
    .node-right .entry-connector { right: calc(clamp(160px, 22vw, 280px) / 2 + clamp(20px, 4vw, 40px) - 100px); }
    .circuit-entry:last-child .entry-connector { display: none; }
    .connector-svg { width: 100%; height: 100%; }
    .connector-path {
      fill: none;
      stroke: var(--trace-dim);
      stroke-width: 2;
      stroke-linecap: square;
      transition: stroke 0.6s ease, filter 0.6s ease;
    }
    .circuit-entry.lit .connector-path {
      stroke: var(--trace-color);
      filter: drop-shadow(0 0 6px var(--trace-glow));
    }
    .connector-pulse {
      position: absolute;
      width: 4px;
      height: 25px;
      background: linear-gradient(180deg, transparent, var(--forge-teal), var(--forge-cyan), transparent);
      border-radius: 2px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      box-shadow: 0 0 15px var(--forge-teal);
    }
    .connector-pulse.down-1 { animation: connector-flow-1 4s ease-in-out infinite; }
    .connector-pulse.down-2 { height: 35px; margin-left: -15px; animation: connector-flow-2 5s ease-in-out infinite; animation-delay: 1.5s; }
    .connector-pulse.down-3 { height: 20px; margin-left: 15px; animation: connector-flow-3 3.5s ease-in-out infinite; animation-delay: 0.7s; }
    .circuit-entry:not(.lit) .connector-pulse { animation: none !important; opacity: 0 !important; }
    @keyframes connector-flow-1 { 0% { top: -10px; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    @keyframes connector-flow-2 { 0% { top: -5px; opacity: 0; } 15% { opacity: 0.8; } 85% { opacity: 0.8; } 100% { top: 95%; opacity: 0; } }
    @keyframes connector-flow-3 { 0% { top: 0; opacity: 0; } 10% { opacity: 0.9; } 90% { opacity: 0.9; } 100% { top: 90%; opacity: 0; } }
    
    /* Hide mobile decorations on desktop */
    .corner-node, .h-trace, .v-trace, .card-pulse { display: none; }

    /* Responsive - Tablet */
    @media (max-width: 1100px) {
      .portfolio-container { padding: 120px 30px 80px; }
      .circuit-rail-left { left: 0; opacity: 0.5; }
      .circuit-rail-right { right: 0; opacity: 0.5; }
    }
    @media (max-width: 900px) {
      .circuit-rail-left, .circuit-rail-right { width: 80px; opacity: 0.3; }
      .circuit-rail-left { left: -20px; }
      .circuit-rail-right { right: -20px; }
    }
    
    /* Mobile */
    @media (max-width: 768px) {
      .header { padding: 15px 20px; }
      .logo span { display: none; }
      .portfolio-container { padding: 100px 15px 60px; }
      .section-title { margin-bottom: 60px; }
      .section-title h1 { font-size: 1.8rem; }
      
      .circuit-entry {
        flex-direction: column !important;
        align-items: center !important;
        padding: 0 !important;
        margin-bottom: 30px;
        min-height: auto;
      }
      .circuit-node { width: 200px; height: 200px; margin-bottom: 10px; }
      .node-ring { inset: -8px; }
      .node-body.no-image { font-size: 5rem; }
      .circuit-node::after { display: none; }
      
      /* Show mobile decorations */
      .corner-node, .h-trace, .v-trace, .card-pulse { display: block; }
      
      .circuit-traces {
        position: relative;
        width: 100%;
        max-width: 300px;
        height: auto;
        min-height: auto;
        padding: 30px 25px 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: rgba(2,3,5,0.92);
        border-radius: 4px;
        border: 2px solid var(--trace-dim);
        transform: none !important;
        z-index: 5;
      }
      .circuit-entry.lit .circuit-traces {
        border-color: var(--trace-color);
        box-shadow: 0 0 30px rgba(56,199,204,0.15), inset 0 0 30px rgba(56,199,204,0.03);
      }
      .circuit-traces::before, .circuit-traces::after {
        content: '';
        position: absolute;
        width: 25px;
        height: 25px;
        pointer-events: none;
        transition: all 0.4s;
      }
      .circuit-traces::before { top: 6px; left: 6px; border-left: 3px solid var(--trace-dim); border-top: 3px solid var(--trace-dim); }
      .circuit-traces::after { bottom: 6px; right: 6px; border-right: 3px solid var(--trace-dim); border-bottom: 3px solid var(--trace-dim); }
      .circuit-entry.lit .circuit-traces::before, .circuit-entry.lit .circuit-traces::after { border-color: var(--forge-teal); filter: drop-shadow(0 0 4px var(--trace-glow)); }
      
      .circuit-traces .corner-node { position: absolute; width: 8px; height: 8px; background: var(--forge-darker); border: 2px solid var(--trace-dim); border-radius: 50%; transition: all 0.4s; }
      .corner-node.tl { top: 4px; left: 4px; }
      .corner-node.tr { top: 4px; right: 4px; }
      .corner-node.bl { bottom: 4px; left: 4px; }
      .corner-node.br { bottom: 4px; right: 4px; }
      .circuit-entry.lit .corner-node { border-color: var(--forge-teal); box-shadow: 0 0 8px var(--trace-glow); }
      
      .circuit-traces .h-trace { position: absolute; height: 2px; background: var(--trace-dim); transition: all 0.4s; }
      .h-trace.top { top: 8px; left: 30px; right: 30px; }
      .h-trace.bottom { bottom: 8px; left: 30px; right: 30px; }
      .circuit-entry.lit .h-trace { background: var(--trace-color); box-shadow: 0 0 6px var(--trace-glow); }
      
      .circuit-traces .v-trace { position: absolute; width: 2px; background: var(--trace-dim); transition: all 0.4s; }
      .v-trace.left { left: 8px; top: 30px; bottom: 30px; }
      .v-trace.right { right: 8px; top: 30px; bottom: 30px; }
      .circuit-entry.lit .v-trace { background: var(--trace-color); box-shadow: 0 0 6px var(--trace-glow); }
      
      .circuit-traces .card-pulse { position: absolute; width: 15px; height: 3px; background: linear-gradient(90deg, transparent, var(--forge-cyan), var(--forge-teal), transparent); border-radius: 2px; top: 8px; opacity: 0; box-shadow: 0 0 8px var(--forge-teal); }
      .circuit-entry.lit .card-pulse { animation: card-pulse-h 3s ease-in-out infinite; }
      @keyframes card-pulse-h { 0% { left: 25px; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { left: calc(100% - 40px); opacity: 0; } }
      
      .circuit-traces .trace-svg, .circuit-traces .energy-pulse { display: none; }
      .data-node { position: relative !important; top: auto !important; left: auto !important; right: auto !important; flex-direction: row !important; justify-content: center; width: 100%; transform: none !important; }
      .data-node .solder-point { display: none; }
      .data-value { text-align: center; white-space: normal; width: 100%; background: transparent !important; border: none !important; padding: 3px 5px; font-size: 0.75rem !important; }
      .data-value.artist { font-size: 1.3rem !important; font-weight: 600; padding: 6px 5px; color: #fff; }
      .circuit-entry.lit .data-value.artist { text-shadow: 0 0 20px var(--trace-glow); }
      .data-value.show { font-size: 0.85rem !important; color: var(--forge-teal); margin-top: -2px; }
      .data-value.year { font-size: 0.65rem !important; order: -1; color: var(--forge-cyan); margin-bottom: 3px; letter-spacing: 0.1em; }
      
      .entry-connector { position: relative; left: auto !important; right: auto !important; bottom: auto; transform: none; width: 4px; height: 40px; margin: 15px auto; background: var(--trace-dim); border-radius: 2px; }
      .circuit-entry.lit .entry-connector { background: var(--trace-color); box-shadow: 0 0 10px var(--trace-glow); }
      .entry-connector .connector-svg, .entry-connector .connector-pulse, .entry-connector .mobile-pulse { display: none; }
      .entry-connector::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 4px; height: 12px; background: linear-gradient(180deg, transparent, var(--forge-cyan), var(--forge-teal), transparent); border-radius: 2px; opacity: 0; box-shadow: 0 0 10px var(--forge-teal); }
      .circuit-entry.lit .entry-connector::after { animation: mobile-pulse-down 2s ease-in-out infinite; }
      @keyframes mobile-pulse-down { 0% { top: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 28px; opacity: 0; } }
      
      .circuit-road { opacity: 0.4; }
      .circuit-rail-left, .circuit-rail-right { width: 60px; }
      .circuit-rail-left { left: -10px; }
      .circuit-rail-right { right: -10px; }
      .road-trace { stroke-width: 2; }
    }
    @media (max-width: 400px) {
      .circuit-node { width: 170px; height: 170px; }
      .node-body.no-image { font-size: 4rem; }
      .data-value.artist { font-size: 1.1rem !important; }
      .circuit-traces { max-width: 280px; padding: 20px 20px; }
    }

          <div class="corner-node br"></div>
          <div class="h-trace top"></div>
          <div class="h-trace bottom"></div>
          <div class="v-trace left"></div>
          <div class="v-trace right"></div>
          <div class="card-pulse"></div>
          
          <div class="energy-pulse pulse-1"></div>
          <div class="energy-pulse pulse-2"></div>
          <div class="energy-pulse pulse-3"></div>
          
          <svg class="trace-svg" viewBox="0 0 800 280" preserveAspectRatio="${isLeft ? 'xMinYMid' : 'xMaxYMid'} meet">
            ${tracePaths}
          </svg>
          
          <div class="data-node" style="top: -7%; ${isLeft ? 'left' : 'right'}: 20%;">
            <div class="solder-point"></div>
            <div class="data-value artist">${item.name}</div>
          </div>
          
          <div class="data-node" style="top: 10%; ${isLeft ? 'left' : 'right'}: 28%;">
            <div class="solder-point"></div>
            <div class="data-value show">${item.tagline}</div>
          </div>
          
          <div class="data-node" style="top: 25%; ${isLeft ? 'left' : 'right'}: 36%;">
            <div class="solder-point"></div>
            <div class="data-value description-value">${item.description}</div>
          </div>
          
          <div class="data-node" style="top: 72%; ${isLeft ? 'left' : 'right'}: 45%;">
            <div class="solder-point"></div>
            <div class="data-value price-value">${item.price}</div>
          </div>
        </div>
        
        <div class="entry-connector">
          <div class="connector-pulse down-1"></div>
          <div class="connector-pulse down-2"></div>
          <div class="connector-pulse down-3"></div>
          <div class="mobile-pulse left"></div>
          <div class="mobile-pulse right"></div>
          <svg class="connector-svg" viewBox="0 0 200 120" preserveAspectRatio="xMidYMid meet">
            ${connectorPaths}
          </svg>
        </div>
      `;
      
      container.appendChild(entry);
    });
    
    function generateTracePaths(isLeft) {
      if (isLeft) {
        const r1 = 30 + Math.random() * 20;
        const r2 = 50 + Math.random() * 20;
        const r3 = 40 + Math.random() * 20;
        return `
          <path class="trace-path" d="M 0 28 H ${r1} V 8 H 160"/>
          <path class="trace-path" d="M 0 62 H ${r2} L ${r2+15} 48 H 220"/>
          <path class="trace-path" d="M 0 110 H ${r3} V 93 H ${r3+60} L ${r3+75} 105 H 300"/>
          <path class="trace-path" d="M -20 235 H ${r1+20} V 215 H ${r1+80} L ${r1+100} 230 H 400"/>
        `;
      } else {
        const r1 = 30 + Math.random() * 20;
        const r2 = 50 + Math.random() * 20;
        const r3 = 40 + Math.random() * 20;
        return `
          <path class="trace-path" d="M 800 28 H ${800-r1} V 8 H 640"/>
          <path class="trace-path" d="M 800 62 H ${800-r2} L ${800-r2-15} 48 H 580"/>
          <path class="trace-path" d="M 800 110 H ${800-r3} V 93 H ${800-r3-60} L ${800-r3-75} 105 H 500"/>
          <path class="trace-path" d="M 820 235 H ${800-r1-20} V 215 H ${800-r1-80} L ${800-r1-100} 230 H 400"/>
        `;
      }
    }
    
    function generateConnectorPaths() {
      const jog1 = 60 + Math.random() * 80;
      const jog2 = 40 + Math.random() * 40;
      const jog3 = 60 + Math.random() * 60;
      return `
        <path class="connector-path" d="M 100 0 V ${jog2} H ${jog1} V ${120-jog2} H 100 V 120"/>
        <path class="connector-path" d="M ${200-jog1} 0 V ${jog3} H ${200-jog1-30} V ${120-jog2-10} H ${200-jog1} V 120"/>
      `;
    }
    
    // Scroll-based lighting with crossfade
    const entries = document.querySelectorAll('.circuit-entry');
    
    function updateLighting() {
      const viewportCenter = window.innerHeight / 2;
      
      entries.forEach(entry => {
        const rect = entry.getBoundingClientRect();
        const entryCenter = rect.top + rect.height / 2;
        const distance = Math.abs(entryCenter - viewportCenter);
        const maxDistance = window.innerHeight * 0.6;
        
        // Calculate intensity (1 at center, fading to 0 at edges)
        const intensity = Math.max(0, 1 - (distance / maxDistance));
        
        // Apply intensity via CSS custom property
        entry.style.setProperty('--light-intensity', intensity);
        
        // Add/remove lit class based on threshold
        if (intensity > 0.1) {
          entry.classList.add('lit');
        } else {
          entry.classList.remove('lit');
        }
      });
      
      updateRoadLighting();
    }
    
    window.addEventListener('scroll', updateLighting, { passive: true });
    updateLighting(); // Initial call

    let roadLit = false;
    function updateRoadLighting() {
      if (!roadLit) {
        roadLit = true;
        document.querySelector('.circuit-road')?.classList.add('lit');
      }
    }

    // Initially light first entry if visible
    setTimeout(() => {
      const firstEntry = document.querySelector('.circuit-entry');
      if (firstEntry) {
        const rect = firstEntry.getBoundingClientRect();
        if (rect.top < window.innerHeight * 0.8) {
          firstEntry.classList.add('lit');
          updateRoadLighting();
        }
      }
    }, 500);
  </script>
</body>
</html>
