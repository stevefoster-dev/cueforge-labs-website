<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueForge Labs | Video Production & Software Development</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="CueForge Labs - Video production, software development, and live event technology. A-list credits including Taylor Swift, Harry Styles, Cher, and Madonna. Based in Connecticut.">
  <meta name="keywords" content="video production, live events, disguise media server, software development, React, AI integration, Connecticut, Taylor Swift, concert production">
  <meta name="author" content="Steve Foster">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CueForge Labs | Video Production & Software Development">
  <meta property="og:description" content="Video production and software development with A-list credits. Taylor Swift, Harry Styles, Cher, Madonna.">
  <meta property="og:url" content="https://cueforgelabs.com">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CueForge Labs">
  <meta name="twitter:description" content="Video production and software development with A-list credits.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forge-dark: #060a0d;
      --forge-darker: #020305;
      --forge-teal: #38c7cc;
      --forge-cyan: #22d3ee;
      --forge-lavender: #a78bfa;
      --forge-amber: #f59e0b;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--forge-darker);
      color: #e5e7eb;
    }

    /* INTRO */
    #intro {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }
    #intro.hidden {
      opacity: 0; transform: scale(1.05);
      pointer-events: none;
    }

    #circuit-canvas {
      position: absolute; inset: 0;
      z-index: 1;
    }

    /* Lens flare */
    #lens-flare {
      position: absolute;
      width: 180%; height: 180%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    #lens-flare.show { opacity: 1; }

    .flare-ray {
      position: absolute;
      top: 50%; left: 50%;
      width: 200%;
      height: 2px;
      transform-origin: center center;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(56,199,204,0.02) 20%,
        rgba(56,199,204,0.06) 40%,
        rgba(56,199,204,0.1) 50%,
        rgba(56,199,204,0.06) 60%,
        rgba(56,199,204,0.02) 80%,
        transparent 100%
      );
    }
    .flare-ray:nth-child(1) { animation: ray-rotate 50s linear infinite; --r: 0deg; }
    .flare-ray:nth-child(2) { animation: ray-rotate 50s linear infinite; --r: 90deg; height: 1.5px; opacity: 0.8; }
    .flare-ray:nth-child(3) { animation: ray-rotate 50s linear infinite; --r: 45deg; animation-delay: -15s; height: 1.5px; opacity: 0.5; }
    .flare-ray:nth-child(4) { animation: ray-rotate 50s linear infinite; --r: 135deg; animation-delay: -15s; height: 1.5px; opacity: 0.5; }

    .flare-glow {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(56,199,204,0.05) 0%,
        rgba(56,199,204,0.02) 30%,
        transparent 55%
      );
      animation: glow-pulse 6s ease-in-out infinite;
    }

    @keyframes ray-rotate {
      from { transform: translate(-50%, -50%) rotate(var(--r, 0deg)); }
      to { transform: translate(-50%, -50%) rotate(calc(var(--r, 0deg) + 360deg)); }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    #logo-wrap {
      position: relative; z-index: 10;
      width: min(700px, 92vw);
    }

    /* SOLID SHAPE - shows first */
    #solid-shape {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1s ease;
      filter: drop-shadow(0 0 30px rgba(56,199,204,0.5)) drop-shadow(0 0 60px rgba(56,199,204,0.3));
    }
    #solid-shape.show { opacity: 1; }
    #solid-shape.fade { opacity: 0; transition: opacity 1.5s ease; }
    #solid-shape path { fill: var(--forge-teal); }

    /* MAIN LOGO - ALL TEAL on intro landing */
    #logo-svg {
      width: 100%; height: auto;
      opacity: 0;
      transition: opacity 1.2s ease;
      overflow: visible;
    }
    #logo-svg.show { opacity: 1; }

    #solid-shape {
      overflow: visible;
    }

    .logo-base {
      fill: #000101;
      stroke: var(--forge-teal);
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(56,199,204,0.4));
    }

    /* ALL circuit groups start TEAL on intro */
    .circuit-group {
      opacity: 0.15;
      transition: opacity 0.8s ease, stroke 0.8s ease, filter 0.8s ease;
      stroke: var(--forge-teal);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .circuit-group circle {
      fill: rgba(56,199,204,0.25);
      stroke: var(--forge-teal);
      stroke-width: 4;
    }
    .circuit-group.active {
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(56,199,204,0.8)) drop-shadow(0 0 25px rgba(56,199,204,0.5));
      animation: pulse-teal 2.5s ease-in-out infinite;
    }

    @keyframes pulse-teal {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(56,199,204,0.8)) drop-shadow(0 0 25px rgba(56,199,204,0.5)); }
      50% { filter: drop-shadow(0 0 20px rgba(56,199,204,1)) drop-shadow(0 0 40px rgba(56,199,204,0.7)); }
    }

    /* Stagger the pulse animations */
    #production-circuits.active { animation-delay: 0s; }
    #software-circuits.active { animation-delay: 0.8s; }
    #about-circuits.active { animation-delay: 1.6s; }

    /* SOFT AURA - Multiple radial gradients for soft edges */
    #forge-aura {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 130%; height: 130%;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 1s ease;
    }
    #forge-aura.on { opacity: 1; }

    /* Soft radial glow layers instead of stroke+blur */
    .aura-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgba(56,199,204,0.15) 0%,
        rgba(56,199,204,0.08) 30%,
        rgba(56,199,204,0.03) 50%,
        transparent 70%
      );
      animation: aura-breathe 3s ease-in-out infinite;
    }
    .aura-glow.center {
      width: 100%; height: 100%;
      top: 0; left: 0;
    }
    .aura-glow.top-left {
      width: 60%; height: 50%;
      top: 5%; left: 5%;
      animation-delay: 0.5s;
    }
    .aura-glow.top-right {
      width: 55%; height: 45%;
      top: 8%; right: 5%;
      left: auto;
      animation-delay: 1s;
    }
    .aura-glow.bottom-left {
      width: 45%; height: 55%;
      bottom: 10%; left: 8%;
      top: auto;
      animation-delay: 1.5s;
    }
    .aura-glow.bottom-right {
      width: 50%; height: 50%;
      bottom: 8%; right: 8%;
      top: auto; left: auto;
      animation-delay: 2s;
    }

    @keyframes aura-breathe {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* CIRCUIT GLOW REGIONS - Animated gradient areas behind logo */
    #circuit-glows {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
      z-index: 4;
      mix-blend-mode: screen;
    }
    #circuit-glows.show { opacity: 1; }

    .circuit-glow-region {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Software glow - follows left arm path */
    #glow-software {
      stroke: url(#glowGradientSoftware);
      stroke-width: 80;
      filter: blur(30px);
      opacity: 0.4;
      animation: glow-drift-1 8s ease-in-out infinite;
    }

    /* Production glow - follows center/top paths */
    #glow-production {
      stroke: url(#glowGradientProduction);
      stroke-width: 100;
      filter: blur(35px);
      opacity: 0.35;
      animation: glow-drift-2 10s ease-in-out infinite;
    }

    /* About glow - follows bottom right path */
    #glow-about {
      stroke: url(#glowGradientAbout);
      stroke-width: 70;
      filter: blur(28px);
      opacity: 0.4;
      animation: glow-drift-3 9s ease-in-out infinite;
    }

    @keyframes glow-drift-1 {
      0%, 100% { opacity: 0.3; stroke-width: 80; }
      50% { opacity: 0.5; stroke-width: 90; }
    }
    @keyframes glow-drift-2 {
      0%, 100% { opacity: 0.25; stroke-width: 100; }
      50% { opacity: 0.45; stroke-width: 115; }
    }
    @keyframes glow-drift-3 {
      0%, 100% { opacity: 0.3; stroke-width: 70; }
      50% { opacity: 0.5; stroke-width: 85; }
    }

    #brand-text {
      margin-top: 30px; text-align: center;
      opacity: 0; transform: translateY(20px);
      transition: all 0.8s ease; z-index: 10;
    }
    #brand-text.show { opacity: 1; transform: translateY(0); }
    #brand-text h1 {
      font-size: clamp(2rem,5vw,3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #brand-text h1 span {
      color: var(--forge-teal);
      text-shadow: 0 0 40px rgba(56,199,204,0.6);
    }
    #brand-text p {
      font-size: clamp(0.85rem,2vw,1.05rem);
      color: #6b7280;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    #enter-btn {
      margin-top: 40px; padding: 16px 50px;
      font-size: 1rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--forge-darker); background: var(--forge-teal);
      border: none; border-radius: 4px; cursor: pointer;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s ease; z-index: 10;
      box-shadow: 0 0 30px rgba(56,199,204,0.5);
    }
    #enter-btn.show { opacity: 1; transform: translateY(0); }
    #enter-btn:hover {
      background: var(--forge-cyan);
      box-shadow: 0 0 50px rgba(56,199,204,0.7);
      transform: translateY(-3px);
    }

    /* FORGE VIEW */
    #forge-view {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      opacity: 0; pointer-events: none;
      transition: opacity 1s ease;
    }
    #forge-view.show { opacity: 1; pointer-events: auto; }

    /* Circuit background - actual image */
    #circuit-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: url('circuitry-bg.webp') center center / cover no-repeat;
      opacity: 0.5;
    }

    #forge-container {
      position: relative;
      width: min(1100px, 92vw);
      aspect-ratio: 2232.6 / 1387.35;
      z-index: 1;
    }

    #forge-logo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }

    .forge-base {
      fill: rgba(6,10,13,0.95);
      stroke: rgba(56,199,204,0.2);
      stroke-width: 2;
    }

    /* NEBULA REGIONS */
    .nebula-region {
      cursor: pointer;
      transition: opacity 0.5s ease;
      opacity: 0.75;
    }
    .nebula-region:hover { opacity: 1; }

    .nebula-software .nebula-cloud {
      fill: url(#nebulaGradientSoftware);
      filter: blur(40px);
      opacity: 0.85;
    }
    .nebula-production .nebula-cloud {
      fill: url(#nebulaGradientProduction);
      filter: blur(40px);
      opacity: 0.85;
    }
    .nebula-about .nebula-cloud {
      fill: url(#nebulaGradientAbout);
      filter: blur(40px);
      opacity: 0.85;
    }

    /* Star nodes - static by default */
    .star-node {
      fill: currentColor;
      opacity: 0.2;
    }
    .star-connector {
      stroke: currentColor;
      stroke-width: 0.8;
      opacity: 0.08;
    }

    .nebula-software .star-node,
    .nebula-software .star-connector { color: #c4b5fd; }
    .nebula-production .star-node,
    .nebula-production .star-connector { color: #5eead4; }
    .nebula-about .star-node,
    .nebula-about .star-connector { color: #fcd34d; }

    /* Only animate on hover */
    .nebula-region:hover .star-node {
      animation: twinkle var(--twinkle-duration, 2s) ease-in-out infinite;
      animation-delay: var(--twinkle-delay, 0s);
    }
    .nebula-region:hover .star-connector {
      animation: twinkle-line var(--twinkle-duration, 2s) ease-in-out infinite;
      animation-delay: var(--twinkle-delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.7; }
    }
    @keyframes twinkle-line {
      0%, 100% { opacity: 0.05; }
      50% { opacity: 0.25; }
    }

    /* Circuit lines over nebulas */
    .forge-circuit {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-width: 8;
      opacity: 0.6;
      pointer-events: none;
    }
    .forge-circuit circle { stroke-width: 3; }

    #forge-software-circuit { stroke: var(--forge-lavender); }
    #forge-software-circuit circle {
      fill: rgba(167,139,250,0.4);
      stroke: var(--forge-lavender);
    }

    #forge-production-circuit { stroke: var(--forge-teal); }
    #forge-production-circuit circle {
      fill: rgba(56,199,204,0.4);
      stroke: var(--forge-teal);
    }

    #forge-about-circuit { stroke: var(--forge-amber); }
    #forge-about-circuit circle {
      fill: rgba(245,158,11,0.4);
      stroke: var(--forge-amber);
    }

    /* Category label */
    #category-label {
      position: fixed;
      bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 45px;
      font-size: 1.3rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #fff;
      background: rgba(6,10,13,0.9);
      border: 2px solid currentColor;
      border-radius: 8px;
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
      z-index: 80;
      backdrop-filter: blur(10px);
    }
    #category-label.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #category-label.production {
      color: var(--forge-teal);
      border-color: var(--forge-teal);
      box-shadow: 0 0 30px rgba(56,199,204,0.4);
    }
    #category-label.software {
      color: var(--forge-lavender);
      border-color: var(--forge-lavender);
      box-shadow: 0 0 30px rgba(167,139,250,0.4);
    }
    #category-label.about {
      color: var(--forge-amber);
      border-color: var(--forge-amber);
      box-shadow: 0 0 30px rgba(245,158,11,0.4);
    }

    /* EXPANDED VIEW */
    #expanded-view {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 55;
    }
    #expanded-view.show { opacity: 1; pointer-events: auto; }

    #expanded-container {
      position: relative;
      width: min(1100px, 92vw);
      aspect-ratio: 2232.6 / 1387.35;
    }

    #expanded-outline {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    #expanded-outline .fill-shape {
      fill: rgba(56,199,204,0.05);
      stroke: var(--forge-teal);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 20px rgba(56,199,204,0.5));
    }
    #expanded-view.software #expanded-outline .fill-shape {
      fill: rgba(167,139,250,0.05);
      stroke: var(--forge-lavender);
      filter: drop-shadow(0 0 20px rgba(167,139,250,0.5));
    }
    #expanded-view.about #expanded-outline .fill-shape {
      fill: rgba(245,158,11,0.05);
      stroke: var(--forge-amber);
      filter: drop-shadow(0 0 20px rgba(245,158,11,0.5));
    }

    #expanded-title {
      position: absolute;
      top: 8%; left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--forge-teal);
      text-shadow: 0 0 40px currentColor;
      z-index: 10;
    }
    #expanded-view.software #expanded-title { color: var(--forge-lavender); }
    #expanded-view.about #expanded-title { color: var(--forge-amber); }

    .expanded-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .expanded-node-core {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(56,199,204,0.25), rgba(6,10,13,0.95));
      border: 2px solid var(--forge-teal);
      box-shadow: 0 0 25px rgba(56,199,204,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .expanded-node:hover .expanded-node-core {
      transform: scale(1.15);
      box-shadow: 0 0 40px rgba(56,199,204,0.7);
    }
    #expanded-view.software .expanded-node-core {
      background: radial-gradient(circle at 30% 30%, rgba(167,139,250,0.25), rgba(6,10,13,0.95));
      border-color: var(--forge-lavender);
      box-shadow: 0 0 25px rgba(167,139,250,0.5);
    }
    #expanded-view.about .expanded-node-core {
      background: radial-gradient(circle at 30% 30%, rgba(245,158,11,0.25), rgba(6,10,13,0.95));
      border-color: var(--forge-amber);
      box-shadow: 0 0 25px rgba(245,158,11,0.5);
    }

    .expanded-node-label {
      position: absolute;
      top: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.7rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .expanded-node-type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      color: var(--forge-teal);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 4px;
    }
    #expanded-view.software .expanded-node-type { color: var(--forge-lavender); }
    #expanded-view.about .expanded-node-type { color: var(--forge-amber); }

    #back-btn {
      position: fixed;
      top: 20px; left: 20px;
      padding: 10px 20px;
      font-size: 0.75rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--forge-teal);
      background: transparent;
      border: 1px solid rgba(56,199,204,0.4);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transition: all 0.3s ease;
      z-index: 90;
    }
    #back-btn.show { opacity: 1; pointer-events: auto; }
    #back-btn:hover {
      background: rgba(56,199,204,0.1);
      border-color: var(--forge-teal);
    }

    #detail-panel {
      position: fixed; top: 50%; right: 25px;
      transform: translateY(-50%) translateX(20px);
      width: 280px; padding: 22px;
      background: rgba(6,10,13,0.98);
      border: 1px solid rgba(56,199,204,0.3);
      border-radius: 10px; backdrop-filter: blur(12px);
      opacity: 0; pointer-events: none;
      transition: all 0.35s ease; z-index: 100;
    }
    #detail-panel.show {
      opacity: 1; pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    #detail-panel h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    #detail-panel.production h3 { color: var(--forge-teal); }
    #detail-panel.software h3 { color: var(--forge-lavender); }
    #detail-panel.about h3 { color: var(--forge-amber); }
    #detail-panel .type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: #6b7280; margin-bottom: 12px;
    }
    #detail-panel p { font-size: 0.8rem; color: #9ca3af; line-height: 1.55; }
    #detail-panel .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    #detail-panel .tag { font-size: 0.55rem; padding: 3px 8px; border-radius: 4px; }
    #detail-panel.production .tag { background: rgba(56,199,204,0.12); color: var(--forge-teal); }
    #detail-panel.software .tag { background: rgba(167,139,250,0.12); color: var(--forge-lavender); }
    #detail-panel.about .tag { background: rgba(245,158,11,0.12); color: var(--forge-amber); }
    #detail-panel .close-btn {
      position: absolute; top: 10px; right: 10px;
      width: 22px; height: 22px;
      background: transparent; border: none;
      color: #6b7280; cursor: pointer;
      font-size: 1.1rem; transition: color 0.2s;
    }
    #detail-panel .close-btn:hover { color: #fff; }

    #hud {
      position: fixed; inset: 0; z-index: 60;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #hud.show { opacity: 1; }

    #logo-badge {
      position: absolute; top: 20px; left: 20px;
      display: flex; align-items: center; gap: 10px;
      opacity: 0.6; pointer-events: auto; cursor: pointer;
      transition: opacity 0.3s;
    }
    #logo-badge:hover { opacity: 1; }
    #logo-badge svg { width: 32px; height: 26px; }
    #logo-badge span { font-weight: 600; font-size: 0.85rem; color: var(--forge-teal); }

    #contact-btn-hud {
      position: absolute; top: 20px; right: 20px;
      padding: 8px 16px; font-size: 0.7rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--forge-teal); background: transparent;
      border: 1px solid rgba(56,199,204,0.35);
      border-radius: 4px; cursor: pointer; pointer-events: auto;
      transition: all 0.3s;
    }
    #contact-btn-hud:hover {
      background: rgba(56,199,204,0.12);
      border-color: var(--forge-teal);
    }

    #hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem; color: rgba(255,255,255,0.25);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    #vignette {
      position: fixed; inset: 0; z-index: 45;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(2,3,5,0.8) 100%);
    }
  </style>

  <script>
    const categories = {
      production: {
        name: 'Production',
        color: '#38c7cc',
        items: [
          { id:'lda', name:'Live Direction', type:'Live Broadcast', desc:'Real-time multi-camera switching and graphics coordination for live events and broadcasts.', tags:['Live','Broadcast','Direction'] },
          { id:'tourld', name:'Tour LD', type:'Concert Touring', desc:'Lighting design and programming for national/international touring productions.', tags:['Touring','Lighting','Programming'] },
          { id:'tvld', name:'TV & Film LD', type:'Television/Film', desc:'Lighting direction for television broadcasts, commercials, and film productions.', tags:['TV','Film','Broadcast'] },
          { id:'fest', name:'Festival Production', type:'Large Scale Events', desc:'Technical direction and production management for major festivals and events.', tags:['Festivals','Events','Management'] }
        ]
      },
      software: {
        name: 'Software',
        color: '#a78bfa',
        items: [
          { id:'nextjs', name:'Next.js Apps', type:'Full Stack', desc:'Production-ready web applications built with Next.js, React, and modern tooling.', tags:['React','Next.js','Full Stack'] },
          { id:'api', name:'API Development', type:'Backend', desc:'RESTful and GraphQL APIs with robust authentication and data validation.', tags:['API','Node.js','PostgreSQL'] },
          { id:'auto', name:'Automation Tools', type:'Productivity', desc:'Custom automation scripts and tools to streamline production workflows.', tags:['Python','Automation','CLI'] }
        ]
      },
      about: {
        name: 'About',
        color: '#f59e0b',
        items: [
          { id:'about', name:'About Steve', type:'15+ Years Experience', desc:'Lighting/Video Director turned full-stack developer. Same rigor and precision, new medium.', tags:['Bio','Experience','Hybrid'] },
          { id:'contact', name:'Get In Touch', type:'Contact', desc:'steve@cueforgelabs.com • (845) 309-4615 • Available for production and development.', tags:['Email','Phone','Available'] }
        ]
      }
    };

    const canvas = document.getElementById('circuit-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, forgeRect = null, pulses = [], pulsesArrived = 0, forgeIgnited = false, startTime = 0;
    const totalPulses = 28;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      const logoWrap = document.getElementById('logo-wrap');
      const rect = logoWrap.getBoundingClientRect();
      forgeRect = { left: rect.left - 15, right: rect.right + 15, top: rect.top - 10, bottom: rect.bottom + 10 };
    }

    function createCircuitPath(edge) {
      const path = [];
      let x, y;
      if (edge === 'top') { x = 60 + Math.random() * (W - 120); y = -10; }
      else if (edge === 'bottom') { x = 60 + Math.random() * (W - 120); y = H + 10; }
      else if (edge === 'left') { x = -10; y = 60 + Math.random() * (H - 120); }
      else { x = W + 10; y = 60 + Math.random() * (H - 120); }
      path.push({ x, y });

      const targetX = forgeRect.left + Math.random() * (forgeRect.right - forgeRect.left);
      const targetY = forgeRect.top + Math.random() * (forgeRect.bottom - forgeRect.top);
      let currentX = x, currentY = y;

      for (let i = 0; i < 2; i++) {
        const progress = (i + 1) / 2;
        const nextX = currentX + (targetX - currentX) * progress + (Math.random() - 0.5) * 40;
        const nextY = currentY + (targetY - currentY) * progress + (Math.random() - 0.5) * 40;
        if (Math.random() > 0.5) { path.push({ x: nextX, y: currentY }); path.push({ x: nextX, y: nextY }); }
        else { path.push({ x: currentX, y: nextY }); path.push({ x: nextX, y: nextY }); }
        currentX = nextX; currentY = nextY;
      }
      path.push({ x: targetX, y: targetY });
      return path;
    }

    class Pulse {
      constructor(path, delay) {
        this.path = path; this.delay = delay; this.progress = 0;
        this.speed = 0.004 + Math.random() * 0.002;
        this.tailLength = 0.08 + Math.random() * 0.05;
        this.active = false; this.arrived = false;
        this.brightness = 0.5 + Math.random() * 0.4;
      }
      update(time) {
        if (time < this.delay) return;
        this.active = true;
        this.progress += this.speed;
        if (this.progress >= 1 && !this.arrived) { this.arrived = true; pulsesArrived++; }
      }
      draw() {
        if (!this.active || this.progress > 1 + this.tailLength) return;
        const pathLength = this.path.length - 1;
        ctx.strokeStyle = 'rgba(56, 199, 204, 0.03)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.path[0].x, this.path[0].y);
        for (let i = 1; i < this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
        ctx.stroke();

        for (let t = Math.max(0, this.progress - this.tailLength); t <= Math.min(1, this.progress); t += 0.005) {
          const segIdx = Math.floor(t * pathLength);
          const segProg = (t * pathLength) % 1;
          if (segIdx >= pathLength) continue;
          const p1 = this.path[segIdx], p2 = this.path[segIdx + 1];
          const x = p1.x + (p2.x - p1.x) * segProg;
          const y = p1.y + (p2.y - p1.y) * segProg;
          const fadeProg = (t - (this.progress - this.tailLength)) / this.tailLength;
          const alpha = fadeProg * this.brightness * (this.progress <= 1 ? 1 : Math.max(0, 1 - (this.progress - 1) / this.tailLength));
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(56, 199, 204, ${alpha})`;
          ctx.fill();
        }
      }
    }

    function initPulses() {
      pulses = []; pulsesArrived = 0; forgeIgnited = false;
      const edges = ['top', 'bottom', 'left', 'right'];
      for (let i = 0; i < totalPulses; i++) {
        const edge = edges[Math.floor(Math.random() * 4)];
        pulses.push(new Pulse(createCircuitPath(edge), i * 40 + Math.random() * 100));
      }
    }

    function animate(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      ctx.clearRect(0, 0, W, H);
      pulses.forEach(p => { p.update(elapsed); p.draw(); });
      if (!forgeIgnited && pulsesArrived >= totalPulses * 0.4) { forgeIgnited = true; igniteForge(); }
      if (!pulses.every(p => p.progress > 1 + p.tailLength)) requestAnimationFrame(animate);
    }

    function igniteForge() {
      const solidShape = document.getElementById('solid-shape');
      const logoSvg = document.getElementById('logo-svg');
      const aura = document.getElementById('forge-aura');
      const circuitGlows = document.getElementById('circuit-glows');
      const lensFlare = document.getElementById('lens-flare');
      const brand = document.getElementById('brand-text');
      const btn = document.getElementById('enter-btn');

      setTimeout(() => lensFlare.classList.add('show'), 100);
      setTimeout(() => solidShape.classList.add('show'), 300);
      setTimeout(() => aura.classList.add('on'), 800);
      setTimeout(() => circuitGlows.classList.add('show'), 1200);

      setTimeout(() => {
        solidShape.classList.add('fade');
        logoSvg.classList.add('show');
      }, 1800);

      setTimeout(() => document.getElementById('production-circuits').classList.add('active'), 2400);
      setTimeout(() => document.getElementById('software-circuits').classList.add('active'), 2700);
      setTimeout(() => document.getElementById('about-circuits').classList.add('active'), 3000);

      setTimeout(() => brand.classList.add('show'), 3400);
      setTimeout(() => btn.classList.add('show'), 3900);
    }

    function showLabel(category) {
      const label = document.getElementById('category-label');
      label.textContent = categories[category].name;
      label.className = 'show ' + category;
    }

    function hideLabel() {
      document.getElementById('category-label').classList.remove('show');
    }

    function expandCategory(key) {
      const cat = categories[key];
      const expandedView = document.getElementById('expanded-view');
      const container = document.getElementById('expanded-container');
      const title = document.getElementById('expanded-title');

      container.querySelectorAll('.expanded-node').forEach(n => n.remove());

      expandedView.className = 'show ' + key;
      title.textContent = cat.name;

      const positions = [
        { x: 22, y: 32 }, { x: 42, y: 28 }, { x: 62, y: 32 }, { x: 78, y: 30 },
        { x: 28, y: 52 }, { x: 50, y: 48 }, { x: 72, y: 52 },
        { x: 35, y: 70 }, { x: 55, y: 72 }, { x: 68, y: 68 }
      ];

      cat.items.forEach((item, i) => {
        const pos = positions[i % positions.length];
        const node = document.createElement('div');
        node.className = 'expanded-node';
        node.style.left = pos.x + '%';
        node.style.top = pos.y + '%';
        node.innerHTML = `
          <div class="expanded-node-core">
            <span class="expanded-node-type">${item.type.split(' ')[0]}</span>
          </div>
          <div class="expanded-node-label">${item.name}</div>
        `;
        node.onclick = (e) => { e.stopPropagation(); showPanel(item, key); };
        container.appendChild(node);
      });

      document.getElementById('forge-view').classList.remove('show');
      document.getElementById('hud').classList.remove('show');
      document.getElementById('back-btn').classList.add('show');
      hideLabel();
    }

    function backToOverview() {
      document.getElementById('expanded-view').classList.remove('show');
      document.getElementById('forge-view').classList.add('show');
      document.getElementById('hud').classList.add('show');
      document.getElementById('back-btn').classList.remove('show');
      closePanel();
    }

    function showPanel(item, region) {
      const panel = document.getElementById('detail-panel');
      panel.className = 'show ' + region;
      document.getElementById('p-title').textContent = item.name;
      document.getElementById('p-type').textContent = item.type;
      document.getElementById('p-desc').textContent = item.desc;
      document.getElementById('p-tags').innerHTML = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
    }

    function closePanel() { document.getElementById('detail-panel').classList.remove('show'); }

    function enterForge() {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('forge-view').classList.add('show');
      document.getElementById('hud').classList.add('show');
    }

    function backToIntro() {
      document.getElementById('forge-view').classList.remove('show');
      document.getElementById('expanded-view').classList.remove('show');
      document.getElementById('hud').classList.remove('show');
      document.getElementById('back-btn').classList.remove('show');
      document.getElementById('intro').classList.remove('hidden');
      closePanel();
    }

    function contact() { window.location.href = 'mailto:steve@cueforgelabs.com?subject=Project%20Inquiry'; }

    window.addEventListener('resize', resize);
    resize();
    setTimeout(() => { initPulses(); requestAnimationFrame(animate); }, 150);
  </script>
