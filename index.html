<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueForge Labs | Video Production & Software Development</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="CueForge Labs - Video production, software development, and live event technology. A-list credits including Taylor Swift, Harry Styles, Cher, and Madonna. Based in Connecticut.">
  <meta name="keywords" content="video production, live events, disguise media server, software development, React, AI integration, Connecticut, Taylor Swift, concert production">
  <meta name="author" content="Steve Foster">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="CueForge Labs | Video Production & Software Development">
  <meta property="og:description" content="Video production and software development with A-list credits. Taylor Swift, Harry Styles, Cher, Madonna.">
  <meta property="og:url" content="https://cueforgelabs.com">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CueForge Labs">
  <meta name="twitter:description" content="Video production and software development with A-list credits.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forge-dark: #060a0d;
      --forge-darker: #020305;
      --forge-teal: #38c7cc;
      --forge-cyan: #22d3ee;
      --forge-lavender: #a78bfa;
      --forge-amber: #f59e0b;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--forge-darker);
      color: #e5e7eb;
    }

    /* INTRO */
    #intro {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }
    #intro.hidden {
      opacity: 0; transform: scale(1.05);
      pointer-events: none;
    }

    #circuit-canvas {
      position: absolute; inset: 0;
      z-index: 1;
    }

    /* Lens flare */
    #lens-flare {
      position: absolute;
      width: 180%; height: 180%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    #lens-flare.show { opacity: 1; }

    .flare-ray {
      position: absolute;
      top: 50%; left: 50%;
      width: 200%;
      height: 2px;
      transform-origin: center center;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(56,199,204,0.02) 20%,
        rgba(56,199,204,0.06) 40%,
        rgba(56,199,204,0.1) 50%,
        rgba(56,199,204,0.06) 60%,
        rgba(56,199,204,0.02) 80%,
        transparent 100%
      );
    }
    .flare-ray:nth-child(1) { animation: ray-rotate 50s linear infinite; --r: 0deg; }
    .flare-ray:nth-child(2) { animation: ray-rotate 50s linear infinite; --r: 90deg; height: 1.5px; opacity: 0.8; }
    .flare-ray:nth-child(3) { animation: ray-rotate 50s linear infinite; --r: 45deg; animation-delay: -15s; height: 1.5px; opacity: 0.5; }
    .flare-ray:nth-child(4) { animation: ray-rotate 50s linear infinite; --r: 135deg; animation-delay: -15s; height: 1.5px; opacity: 0.5; }

    .flare-glow {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(56,199,204,0.05) 0%,
        rgba(56,199,204,0.02) 30%,
        transparent 55%
      );
      animation: glow-pulse 6s ease-in-out infinite;
    }

    @keyframes ray-rotate {
      from { transform: translate(-50%, -50%) rotate(var(--r, 0deg)); }
      to { transform: translate(-50%, -50%) rotate(calc(var(--r, 0deg) + 360deg)); }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    #logo-wrap {
      position: relative; z-index: 10;
      width: min(700px, 92vw);
    }

    /* SOLID SHAPE - shows first */
    #solid-shape {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1s ease;
      filter: drop-shadow(0 0 30px rgba(56,199,204,0.5)) drop-shadow(0 0 60px rgba(56,199,204,0.3));
    }
    #solid-shape.show { opacity: 1; }
    #solid-shape.fade { opacity: 0; transition: opacity 1.5s ease; }
    #solid-shape path { fill: var(--forge-teal); }

    /* MAIN LOGO - ALL TEAL on intro landing */
    #logo-svg {
      width: 100%; height: auto;
      opacity: 0;
      transition: opacity 1.2s ease;
      overflow: visible;
    }
    #logo-svg.show { opacity: 1; }

    #solid-shape {
      overflow: visible;
    }

    .logo-base {
      fill: #000101;
      stroke: var(--forge-teal);
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(56,199,204,0.4));
    }

    /* ALL circuit groups start TEAL on intro */
    .circuit-group {
      opacity: 0.15;
      transition: opacity 0.8s ease, stroke 0.8s ease, filter 0.8s ease;
      stroke: var(--forge-teal);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .circuit-group circle {
      fill: rgba(56,199,204,0.25);
      stroke: var(--forge-teal);
      stroke-width: 4;
    }
    .circuit-group.active {
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(56,199,204,0.8)) drop-shadow(0 0 25px rgba(56,199,204,0.5));
      animation: pulse-teal 2.5s ease-in-out infinite;
    }

    @keyframes pulse-teal {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(56,199,204,0.8)) drop-shadow(0 0 25px rgba(56,199,204,0.5)); }
      50% { filter: drop-shadow(0 0 20px rgba(56,199,204,1)) drop-shadow(0 0 40px rgba(56,199,204,0.7)); }
    }

    /* Stagger the pulse animations */
    #production-circuits.active { animation-delay: 0s; }
    #software-circuits.active { animation-delay: 0.8s; }
    #about-circuits.active { animation-delay: 1.6s; }

    /* SOFT AURA - Multiple radial gradients for soft edges */
    #forge-aura {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 130%; height: 130%;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 1s ease;
    }
    #forge-aura.on { opacity: 1; }

    /* Soft radial glow layers instead of stroke+blur */
    .aura-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgba(56,199,204,0.15) 0%,
        rgba(56,199,204,0.08) 30%,
        rgba(56,199,204,0.03) 50%,
        transparent 70%
      );
      animation: aura-breathe 3s ease-in-out infinite;
    }
    .aura-glow.center {
      width: 100%; height: 100%;
      top: 0; left: 0;
    }
    .aura-glow.top-left {
      width: 60%; height: 50%;
      top: 5%; left: 5%;
      animation-delay: 0.5s;
    }
    .aura-glow.top-right {
      width: 55%; height: 45%;
      top: 8%; right: 5%;
      left: auto;
      animation-delay: 1s;
    }
    .aura-glow.bottom-left {
      width: 45%; height: 55%;
      bottom: 10%; left: 8%;
      top: auto;
      animation-delay: 1.5s;
    }
    .aura-glow.bottom-right {
      width: 50%; height: 50%;
      bottom: 8%; right: 8%;
      top: auto; left: auto;
      animation-delay: 2s;
    }

    @keyframes aura-breathe {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* CIRCUIT GLOW REGIONS - Animated gradient areas behind logo */
    #circuit-glows {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
      z-index: 4;
      mix-blend-mode: screen;
    }
    #circuit-glows.show { opacity: 1; }

    .circuit-glow-region {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Software glow - follows left arm path */
    #glow-software {
      stroke: url(#glowGradientSoftware);
      stroke-width: 80;
      filter: blur(30px);
      opacity: 0.4;
      animation: glow-drift-1 8s ease-in-out infinite;
    }

    /* Production glow - follows center/top paths */
    #glow-production {
      stroke: url(#glowGradientProduction);
      stroke-width: 100;
      filter: blur(35px);
      opacity: 0.35;
      animation: glow-drift-2 10s ease-in-out infinite;
    }

    /* About glow - follows bottom right path */
    #glow-about {
      stroke: url(#glowGradientAbout);
      stroke-width: 70;
      filter: blur(28px);
      opacity: 0.4;
      animation: glow-drift-3 9s ease-in-out infinite;
    }

    @keyframes glow-drift-1 {
      0%, 100% { opacity: 0.3; stroke-width: 80; }
      50% { opacity: 0.5; stroke-width: 90; }
    }
    @keyframes glow-drift-2 {
      0%, 100% { opacity: 0.25; stroke-width: 100; }
      50% { opacity: 0.45; stroke-width: 115; }
    }
    @keyframes glow-drift-3 {
      0%, 100% { opacity: 0.3; stroke-width: 70; }
      50% { opacity: 0.5; stroke-width: 85; }
    }

    #brand-text {
      margin-top: 30px; text-align: center;
      opacity: 0; transform: translateY(20px);
      transition: all 0.8s ease; z-index: 10;
    }
    #brand-text.show { opacity: 1; transform: translateY(0); }
    #brand-text h1 {
      font-size: clamp(2rem,5vw,3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #brand-text h1 span {
      color: var(--forge-teal);
      text-shadow: 0 0 40px rgba(56,199,204,0.6);
    }
    #brand-text p {
      font-size: clamp(0.85rem,2vw,1.05rem);
      color: #6b7280;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    #enter-btn {
      margin-top: 40px; padding: 16px 50px;
      font-size: 1rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--forge-darker); background: var(--forge-teal);
      border: none; border-radius: 4px; cursor: pointer;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s ease; z-index: 10;
      box-shadow: 0 0 30px rgba(56,199,204,0.5);
    }
    #enter-btn.show { opacity: 1; transform: translateY(0); }
    #enter-btn:hover {
      background: var(--forge-cyan);
      box-shadow: 0 0 50px rgba(56,199,204,0.7);
      transform: translateY(-3px);
    }

    /* FORGE VIEW */
    #forge-view {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      opacity: 0; pointer-events: none;
      transition: opacity 1s ease;
    }
    #forge-view.show { opacity: 1; pointer-events: auto; }

    /* Circuit background - actual image */
    #circuit-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background: url('circuitry-bg.webp') center center / cover no-repeat;
      opacity: 0.5;
    }

    #forge-container {
      position: relative;
      width: min(1100px, 92vw);
      aspect-ratio: 2232.6 / 1387.35;
      z-index: 1;
    }

    #forge-logo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }

    .forge-base {
      fill: rgba(6,10,13,0.95);
      stroke: rgba(56,199,204,0.2);
      stroke-width: 2;
    }

    /* NEBULA REGIONS - ESO Constellation Style */
    .nebula-region {
      cursor: pointer;
      transition: opacity 0.5s ease 0.2s, filter 0.5s ease 0.2s;
      opacity: 0.85;
    }
    .nebula-region:hover { 
      opacity: 1; 
      filter: brightness(1.2);
      transition: opacity 0.3s ease, filter 0.3s ease; /* Faster on hover-in */
    }

    /* Layered nebula clouds */
    .nebula-cloud-base {
      opacity: 0.4;
    }
    .nebula-cloud-mid {
      opacity: 0.6;
    }
    .nebula-cloud-bright {
      opacity: 0.8;
    }
    .nebula-cloud-core {
      opacity: 0.9;
    }
    .nebula-wisp {
      opacity: 0.3;
    }

    .nebula-software .nebula-cloud-base { fill: url(#nebulaBaseSoftware); filter: url(#nebulaTurbulence); }
    .nebula-software .nebula-cloud-mid { fill: url(#nebulaMidSoftware); filter: url(#nebulaGlow); }
    .nebula-software .nebula-cloud-bright { fill: url(#nebulaBrightSoftware); filter: url(#nebulaSharp); }
    .nebula-software .nebula-cloud-core { fill: url(#nebulaCenterSoftware); filter: url(#nebulaCore); }
    .nebula-software .nebula-wisp { fill: url(#nebulaWispSoftware); filter: url(#nebulaWispFilter); }

    .nebula-production .nebula-cloud-base { fill: url(#nebulaBaseProduction); filter: url(#nebulaTurbulence); }
    .nebula-production .nebula-cloud-mid { fill: url(#nebulaMidProduction); filter: url(#nebulaGlow); }
    .nebula-production .nebula-cloud-bright { fill: url(#nebulaBrightProduction); filter: url(#nebulaSharp); }
    .nebula-production .nebula-cloud-core { fill: url(#nebulaCenterProduction); filter: url(#nebulaCore); }
    .nebula-production .nebula-wisp { fill: url(#nebulaWispProduction); filter: url(#nebulaWispFilter); }

    .nebula-about .nebula-cloud-base { fill: url(#nebulaBaseAbout); filter: url(#nebulaTurbulence); }
    .nebula-about .nebula-cloud-mid { fill: url(#nebulaMidAbout); filter: url(#nebulaGlow); }
    .nebula-about .nebula-cloud-bright { fill: url(#nebulaBrightAbout); filter: url(#nebulaSharp); }
    .nebula-about .nebula-cloud-core { fill: url(#nebulaCenterAbout); filter: url(#nebulaCore); }
    .nebula-about .nebula-wisp { fill: url(#nebulaWispAbout); filter: url(#nebulaWispFilter); }

    /* Nebula animations - multiple variants for randomness */
    @keyframes nebula-drift-1 {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
      33% { opacity: 0.48; transform: scale(1.04) translate(10px, -7px); }
      66% { opacity: 0.4; transform: scale(0.96) translate(-6px, 9px); }
    }
    @keyframes nebula-drift-2 {
      0%, 100% { opacity: 0.38; transform: scale(1) translate(0, 0); }
      40% { opacity: 0.52; transform: scale(0.97) translate(-8px, 6px); }
      70% { opacity: 0.42; transform: scale(1.03) translate(5px, -10px); }
    }
    @keyframes nebula-drift-3 {
      0%, 100% { opacity: 0.33; transform: scale(1) translate(0, 0); }
      25% { opacity: 0.45; transform: scale(1.02) translate(6px, 8px); }
      55% { opacity: 0.5; transform: scale(0.98) translate(-10px, -5px); }
      80% { opacity: 0.4; transform: scale(1.01) translate(3px, -8px); }
    }
    @keyframes nebula-pulse-1 {
      0%, 100% { opacity: 0.55; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.75; transform: scale(1.05) translate(5px, -3px); }
    }
    @keyframes nebula-pulse-2 {
      0%, 100% { opacity: 0.58; transform: scale(1) translate(0, 0); }
      35% { opacity: 0.7; transform: scale(0.97) translate(-4px, 6px); }
      70% { opacity: 0.72; transform: scale(1.03) translate(3px, -5px); }
    }
    @keyframes nebula-pulse-3 {
      0%, 100% { opacity: 0.52; transform: scale(1) translate(0, 0); }
      60% { opacity: 0.78; transform: scale(1.04) translate(-6px, -4px); }
    }
    @keyframes nebula-glow-1 {
      0%, 100% { opacity: 0.75; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.95; transform: scale(1.07) translate(4px, -5px); }
    }
    @keyframes nebula-glow-2 {
      0%, 100% { opacity: 0.72; transform: scale(1) translate(0, 0); }
      40% { opacity: 0.88; transform: scale(1.04) translate(-5px, 3px); }
      75% { opacity: 0.92; transform: scale(1.06) translate(3px, -4px); }
    }
    @keyframes nebula-glow-3 {
      0%, 100% { opacity: 0.78; transform: scale(1) translate(0, 0); }
      55% { opacity: 0.98; transform: scale(1.05) translate(-3px, -6px); }
    }
    @keyframes nebula-core-1 {
      0%, 100% { opacity: 0.85; transform: scale(1) translate(0, 0); }
      50% { opacity: 1; transform: scale(1.1) translate(3px, -4px); }
    }
    @keyframes nebula-core-2 {
      0%, 100% { opacity: 0.82; transform: scale(1) translate(0, 0); }
      35% { opacity: 0.95; transform: scale(1.06) translate(-4px, 2px); }
      70% { opacity: 1; transform: scale(1.08) translate(2px, -3px); }
    }
    @keyframes nebula-core-3 {
      0%, 100% { opacity: 0.88; transform: scale(1) translate(0, 0); }
      60% { opacity: 1; transform: scale(1.12) translate(-2px, -5px); }
    }
    @keyframes nebula-wisp-1 {
      0%, 100% { opacity: 0.25; transform: scale(1) translate(0, 0); }
      25% { opacity: 0.4; transform: scale(1.06) translate(15px, -12px); }
      50% { opacity: 0.32; transform: scale(0.94) translate(-10px, 18px); }
      75% { opacity: 0.38; transform: scale(1.02) translate(-12px, -10px); }
    }
    @keyframes nebula-wisp-2 {
      0%, 100% { opacity: 0.28; transform: scale(1) translate(0, 0); }
      30% { opacity: 0.35; transform: scale(0.96) translate(-12px, 8px); }
      60% { opacity: 0.42; transform: scale(1.04) translate(8px, -15px); }
      85% { opacity: 0.32; transform: scale(1.01) translate(10px, 5px); }
    }

    /* All nebula elements use CSS custom properties for random timing */
    .nebula-region:hover .nebula-wisp {
      animation: nebula-wisp-1 var(--dur, 28s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-base {
      animation: nebula-drift-1 var(--dur, 22s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-mid {
      animation: nebula-pulse-1 var(--dur, 16s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-bright {
      animation: nebula-glow-1 var(--dur, 11s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-core {
      animation: nebula-core-1 var(--dur, 7s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }

    /* Star nodes - ESO constellation style */
    .star-node {
      fill: currentColor;
      opacity: 0.4;
      filter: drop-shadow(0 0 3px currentColor);
    }
    .star-connector {
      stroke: currentColor;
      stroke-width: 1.2;
      opacity: 0.15;
      filter: drop-shadow(0 0 2px currentColor);
    }

    .nebula-software .star-node,
    .nebula-software .star-connector { color: #e9d5ff; }
    .nebula-production .star-node,
    .nebula-production .star-connector { color: #99f6e4; }
    .nebula-about .star-node,
    .nebula-about .star-connector { color: #fde68a; }

    /* Hover state - constellation lights up */
    .nebula-region:hover .star-node {
      opacity: 0.9;
      filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 15px currentColor);
      animation: twinkle var(--twinkle-duration, 2s) ease-in-out infinite;
      animation-delay: var(--twinkle-delay, 0s);
    }
    .nebula-region:hover .star-connector {
      opacity: 0.5;
      filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 8px currentColor);
      animation: twinkle-line var(--twinkle-duration, 2s) ease-in-out infinite;
      animation-delay: var(--twinkle-delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px currentColor) drop-shadow(0 0 25px currentColor); }
    }
    @keyframes twinkle-line {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }

    /* Circuit lines over nebulas */
    .forge-circuit {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-width: 8;
      opacity: 0.6;
      pointer-events: none;
    }
    .forge-circuit circle { stroke-width: 3; }

    #forge-software-circuit { stroke: var(--forge-lavender); }
    #forge-software-circuit circle {
      fill: rgba(167,139,250,0.4);
      stroke: var(--forge-lavender);
    }

    #forge-production-circuit { stroke: var(--forge-teal); }
    #forge-production-circuit circle {
      fill: rgba(56,199,204,0.4);
      stroke: var(--forge-teal);
    }

    #forge-about-circuit { stroke: var(--forge-amber); }
    #forge-about-circuit circle {
      fill: rgba(245,158,11,0.4);
      stroke: var(--forge-amber);
    }

    /* Category label */
    #category-label {
      position: fixed;
      bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 45px;
      font-size: 1.3rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #fff;
      background: rgba(6,10,13,0.9);
      border: 2px solid currentColor;
      border-radius: 8px;
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
      z-index: 80;
      backdrop-filter: blur(10px);
    }
    #category-label.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #category-label.production {
      color: var(--forge-teal);
      border-color: var(--forge-teal);
      box-shadow: 0 0 30px rgba(56,199,204,0.4);
    }
    #category-label.software {
      color: var(--forge-lavender);
      border-color: var(--forge-lavender);
      box-shadow: 0 0 30px rgba(167,139,250,0.4);
    }
    #category-label.about {
      color: var(--forge-amber);
      border-color: var(--forge-amber);
      box-shadow: 0 0 30px rgba(245,158,11,0.4);
    }

    /* EXPANDED VIEW */
    #expanded-view {
      position: fixed; inset: 0;
      display: flex; align-items: flex-start; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 55;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 20px;
    }
    #expanded-view.show { opacity: 1; pointer-events: auto; }
    
    /* Category-specific nebula backgrounds */
    #expanded-view::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: radial-gradient(ellipse at 30% 40%, var(--cat-nebula-1) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 60%, var(--cat-nebula-2) 0%, transparent 45%),
                  radial-gradient(ellipse at 50% 30%, var(--cat-nebula-3) 0%, transparent 55%);
      opacity: 0.4;
      animation: expanded-nebula-drift 30s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes expanded-nebula-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(3%, -2%) scale(1.02); }
      66% { transform: translate(-2%, 3%) scale(0.98); }
    }
    #expanded-view.production {
      --cat-nebula-1: rgba(56,199,204,0.3);
      --cat-nebula-2: rgba(34,211,238,0.2);
      --cat-nebula-3: rgba(6,182,212,0.25);
    }
    #expanded-view.software {
      --cat-nebula-1: rgba(167,139,250,0.3);
      --cat-nebula-2: rgba(139,92,246,0.2);
      --cat-nebula-3: rgba(192,132,252,0.25);
    }
    #expanded-view.about {
      --cat-nebula-1: rgba(245,158,11,0.3);
      --cat-nebula-2: rgba(251,146,60,0.2);
      --cat-nebula-3: rgba(234,88,12,0.25);
    }

    #expanded-container {
      position: relative;
      width: min(1100px, 92vw);
      min-height: 100vh;
      height: auto;
      padding-bottom: 150px;
      padding-top: 60px;
    }

    #expanded-outline {
      display: none; /* Hidden - using full nebula background instead */
    }

    #expanded-title {
      position: fixed;
      top: 30px; left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--forge-teal);
      text-shadow: 0 0 40px currentColor;
      z-index: 70;
      background: rgba(2,3,5,0.8);
      padding: 10px 30px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    #expanded-view.software #expanded-title { color: var(--forge-lavender); }
    #expanded-view.about #expanded-title { color: var(--forge-amber); }

    .expanded-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .expanded-node-core {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(56,199,204,0.25), rgba(6,10,13,0.95));
      border: 2px solid var(--forge-teal);
      box-shadow: 0 0 25px rgba(56,199,204,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .expanded-node:hover .expanded-node-core {
      transform: scale(1.15);
      box-shadow: 0 0 40px rgba(56,199,204,0.7);
    }
    #expanded-view.software .expanded-node-core {
      background: radial-gradient(circle at 30% 30%, rgba(167,139,250,0.25), rgba(6,10,13,0.95));
      border-color: var(--forge-lavender);
      box-shadow: 0 0 25px rgba(167,139,250,0.5);
    }
    #expanded-view.about .expanded-node-core {
      background: radial-gradient(circle at 30% 30%, rgba(245,158,11,0.25), rgba(6,10,13,0.95));
      border-color: var(--forge-amber);
      box-shadow: 0 0 25px rgba(245,158,11,0.5);
    }

    .expanded-node-label {
      position: absolute;
      top: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.7rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .expanded-node-type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      color: var(--forge-teal);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 4px;
    }
    #expanded-view.software .expanded-node-type { color: var(--forge-lavender); }
    #expanded-view.about .expanded-node-type { color: var(--forge-amber); }

    #back-btn {
      position: fixed;
      top: 20px; left: 20px;
      padding: 10px 20px;
      font-size: 0.75rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--forge-teal);
      background: transparent;
      border: 1px solid rgba(56,199,204,0.4);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transition: all 0.3s ease;
      z-index: 90;
    }
    #back-btn.show { opacity: 1; pointer-events: auto; }
    #back-btn:hover {
      background: rgba(56,199,204,0.1);
      border-color: var(--forge-teal);
    }

    #detail-panel {
      position: fixed; top: 50%; right: 25px;
      transform: translateY(-50%) translateX(20px);
      width: 320px; max-height: 80vh; padding: 22px;
      background: rgba(6,10,13,0.98);
      border: 1px solid rgba(56,199,204,0.3);
      border-radius: 10px; backdrop-filter: blur(12px);
      opacity: 0; pointer-events: none;
      transition: all 0.35s ease; z-index: 100;
      overflow-y: auto;
    }
    #detail-panel.show {
      opacity: 1; pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    #detail-panel h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    #detail-panel.production h3 { color: var(--forge-teal); }
    #detail-panel.software h3 { color: var(--forge-lavender); }
    #detail-panel.about h3 { color: var(--forge-amber); }
    #detail-panel .type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: #6b7280; margin-bottom: 12px;
    }
    #detail-panel p { font-size: 0.8rem; color: #9ca3af; line-height: 1.55; }
    #detail-panel .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    #detail-panel .tag { font-size: 0.55rem; padding: 3px 8px; border-radius: 4px; }
    #detail-panel.production .tag { background: rgba(56,199,204,0.12); color: var(--forge-teal); }
    #detail-panel.software .tag { background: rgba(167,139,250,0.12); color: var(--forge-lavender); }
    #detail-panel.about .tag { background: rgba(245,158,11,0.12); color: var(--forge-amber); }
    #detail-panel .close-btn {
      position: absolute; top: 10px; right: 10px;
      width: 22px; height: 22px;
      background: transparent; border: none;
      color: #6b7280; cursor: pointer;
      font-size: 1.1rem; transition: color 0.2s;
    }
    #detail-panel .close-btn:hover { color: #fff; }

    #hud {
      position: fixed; inset: 0; z-index: 60;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #hud.show { opacity: 1; }

    #logo-badge {
      position: absolute; top: 20px; left: 20px;
      display: flex; align-items: center; gap: 10px;
      opacity: 0.6; pointer-events: auto; cursor: pointer;
      transition: opacity 0.3s;
    }
    #logo-badge:hover { opacity: 1; }
    #logo-badge svg { width: 32px; height: 26px; }
    #logo-badge span { font-weight: 600; font-size: 0.85rem; color: var(--forge-teal); }

    #contact-btn-hud {
      position: absolute; top: 20px; right: 20px;
      padding: 8px 16px; font-size: 0.7rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--forge-teal); background: transparent;
      border: 1px solid rgba(56,199,204,0.35);
      border-radius: 4px; cursor: pointer; pointer-events: auto;
      transition: all 0.3s;
    }
    #contact-btn-hud:hover {
      background: rgba(56,199,204,0.12);
      border-color: var(--forge-teal);
    }

    #hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem; color: rgba(255,255,255,0.25);
      text-transform: uppercase; letter-spacing: 0.08em;
    }

    #vignette {
      position: fixed; inset: 0; z-index: 45;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(2,3,5,0.8) 100%);
    }

    /* ===== PORTFOLIO NODE STYLES ===== */
    .portfolio-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.4s ease, z-index 0s;
      /* Orbital micro-movement - no collisions because each node moves in its own tiny orbit */
      animation: node-orbit var(--orbit-dur, 12s) ease-in-out infinite;
      animation-delay: var(--orbit-del, 0s);
    }
    .portfolio-node:hover {
      z-index: 20;
      transform: translate(-50%, -50%) scale(1.15);
      animation-play-state: paused;
    }

    /* Tiny orbital movements - max 4px in any direction, unique per node via CSS vars */
    @keyframes node-orbit {
      0% { transform: translate(-50%, -50%) translate(0, 0); }
      25% { transform: translate(-50%, -50%) translate(var(--orbit-x1, 2px), var(--orbit-y1, -2px)); }
      50% { transform: translate(-50%, -50%) translate(var(--orbit-x2, 0px), var(--orbit-y2, 3px)); }
      75% { transform: translate(-50%, -50%) translate(var(--orbit-x3, -2px), var(--orbit-y3, 1px)); }
      100% { transform: translate(-50%, -50%) translate(0, 0); }
    }

    .portfolio-node-frame {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      padding: 3px;
      background: transparent;
      transition: all 0.4s ease;
    }
    
    /* Nebula glow effect on hover */
    .portfolio-node-frame::before {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
        var(--node-color-dim) 0%,
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }
    .portfolio-node:hover .portfolio-node-frame::before {
      opacity: 1;
      animation: nebula-pulse-hover 2s ease-in-out infinite;
    }
    
    @keyframes nebula-pulse-hover {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .portfolio-node-image {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(6,10,13,0.95);
      background-size: cover;
      background-position: center;
      border: 2px solid var(--node-color-dim);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
    }
    .portfolio-node:hover .portfolio-node-image {
      border-color: var(--node-color);
      box-shadow: 
        inset 0 0 20px rgba(0,0,0,0.8),
        0 0 25px var(--node-color-dim),
        0 0 50px var(--node-color-dim);
    }
    .portfolio-node-image.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      color: var(--node-color);
      text-shadow: 0 0 20px var(--node-color);
    }

    .portfolio-node-label {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .portfolio-node:hover .portfolio-node-label {
      transform: translateX(-50%) translateY(5px);
    }
    .portfolio-node-label .artist {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .portfolio-node-label .show {
      font-size: 0.65rem;
      color: var(--node-color);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
      opacity: 0.8;
    }

    /* Production (Teal) */
    .portfolio-node.production {
      --node-color: var(--forge-teal);
      --node-color-dim: rgba(56,199,204,0.4);
    }
    /* Software (Lavender) */
    .portfolio-node.software {
      --node-color: var(--forge-lavender);
      --node-color-dim: rgba(167,139,250,0.4);
    }
    /* About (Amber) */
    .portfolio-node.about {
      --node-color: var(--forge-amber);
      --node-color-dim: rgba(245,158,11,0.4);
    }

    /* Constellation lines connecting nodes */
    #constellation-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .constellation-line {
      stroke: var(--line-color, rgba(56,199,204,0.4));
      stroke-width: 1;
      opacity: 0.3;
      fill: none;
      vector-effect: non-scaling-stroke; /* Prevents stroke from stretching */
      /* Animated energy flow along the line */
      stroke-dasharray: 4 8;
      animation: line-flow var(--flow-dur, 3s) linear infinite;
      animation-delay: var(--flow-del, 0s);
    }
    #expanded-view:hover .constellation-line {
      opacity: 0.5;
    }
    
    /* Subtle energy pulse flowing through the lines */
    @keyframes line-flow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -12; }
    }
    
    /* Remove the dots - just lines */

    /* Updated detail panel for portfolio */
    #detail-panel .credits {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #detail-panel .credit-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #detail-panel .credit-role {
      color: #6b7280;
    }
    #detail-panel .credit-name {
      color: #e5e7eb;
      text-align: right;
    }
    #detail-panel .credit-company {
      color: var(--forge-teal);
      font-size: 0.6rem;
    }
    #detail-panel.software .credit-company { color: var(--forge-lavender); }
    #detail-panel.about .credit-company { color: var(--forge-amber); }

    #detail-panel .your-role {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--forge-teal);
      margin: 8px 0;
      padding: 8px 12px;
      background: rgba(56,199,204,0.1);
      border-radius: 6px;
      border-left: 3px solid var(--forge-teal);
    }
    #detail-panel.software .your-role {
      color: var(--forge-lavender);
      background: rgba(167,139,250,0.1);
      border-left-color: var(--forge-lavender);
    }
    #detail-panel.about .your-role {
      color: var(--forge-amber);
      background: rgba(245,158,11,0.1);
      border-left-color: var(--forge-amber);
    }

    #detail-panel .year-badge {
      position: absolute;
      top: 15px;
      right: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #6b7280;
    }
  </style>
</head>

  <!-- Full portfolio data from radiancedesign.org -->
  <script src="portfolio-data.js"></script>
  
  <script>
    // portfolioData is loaded from portfolio-data.js
    
    // Categories object maps portfolioData to display format
    const categories = {
      production: {
        name: 'Production',
        color: '#38c7cc',
        items: portfolioData.production.map(p => ({
          id: p.id,
          name: p.artist,
          type: p.show,
          desc: p.role,
          tags: [p.year.toString(), p.role.split(',')[0].trim()]
        }))
      },
      software: {
        name: 'Software',
        color: '#a78bfa',
        items: portfolioData.software.map(s => ({
          id: s.id,
          name: s.name,
          type: s.type,
          desc: s.desc,
          tags: s.tech.slice(0, 3)
        }))
      },
      about: {
        name: 'About',
        color: '#f59e0b',
        items: portfolioData.about.map(a => ({
          id: a.id,
          name: a.name,
          type: a.type === 'bio' ? 'Creative Technologist' : a.type === 'resume' ? 'Experience' : a.type,
          desc: a.bio || a.content || '',
          tags: a.type === 'bio' ? ['Bio', '15+ Years'] : ['Resume', a.name]
        }))
      }
    };

    const canvas = document.getElementById('circuit-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, forgeRect = null, pulses = [], pulsesArrived = 0, forgeIgnited = false, startTime = 0;
    const totalPulses = 28;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      const logoWrap = document.getElementById('logo-wrap');
      const rect = logoWrap.getBoundingClientRect();
      forgeRect = { left: rect.left - 15, right: rect.right + 15, top: rect.top - 10, bottom: rect.bottom + 10 };
    }

    function createCircuitPath(edge) {
      const path = [];
      let x, y;
      if (edge === 'top') { x = 60 + Math.random() * (W - 120); y = -10; }
      else if (edge === 'bottom') { x = 60 + Math.random() * (W - 120); y = H + 10; }
      else if (edge === 'left') { x = -10; y = 60 + Math.random() * (H - 120); }
      else { x = W + 10; y = 60 + Math.random() * (H - 120); }
      path.push({ x, y });

      const targetX = forgeRect.left + Math.random() * (forgeRect.right - forgeRect.left);
      const targetY = forgeRect.top + Math.random() * (forgeRect.bottom - forgeRect.top);
      let currentX = x, currentY = y;

      for (let i = 0; i < 2; i++) {
        const progress = (i + 1) / 2;
        const nextX = currentX + (targetX - currentX) * progress + (Math.random() - 0.5) * 40;
        const nextY = currentY + (targetY - currentY) * progress + (Math.random() - 0.5) * 40;
        if (Math.random() > 0.5) { path.push({ x: nextX, y: currentY }); path.push({ x: nextX, y: nextY }); }
        else { path.push({ x: currentX, y: nextY }); path.push({ x: nextX, y: nextY }); }
        currentX = nextX; currentY = nextY;
      }
      path.push({ x: targetX, y: targetY });
      return path;
    }

    class Pulse {
      constructor(path, delay) {
        this.path = path; this.delay = delay; this.progress = 0;
        this.speed = 0.004 + Math.random() * 0.002;
        this.tailLength = 0.08 + Math.random() * 0.05;
        this.active = false; this.arrived = false;
        this.brightness = 0.5 + Math.random() * 0.4;
      }
      update(time) {
        if (time < this.delay) return;
        this.active = true;
        this.progress += this.speed;
        if (this.progress >= 1 && !this.arrived) { this.arrived = true; pulsesArrived++; }
      }
      draw() {
        if (!this.active || this.progress > 1 + this.tailLength) return;
        const pathLength = this.path.length - 1;
        ctx.strokeStyle = 'rgba(56, 199, 204, 0.03)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.path[0].x, this.path[0].y);
        for (let i = 1; i < this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
        ctx.stroke();

        for (let t = Math.max(0, this.progress - this.tailLength); t <= Math.min(1, this.progress); t += 0.005) {
          const segIdx = Math.floor(t * pathLength);
          const segProg = (t * pathLength) % 1;
          if (segIdx >= pathLength) continue;
          const p1 = this.path[segIdx], p2 = this.path[segIdx + 1];
          const x = p1.x + (p2.x - p1.x) * segProg;
          const y = p1.y + (p2.y - p1.y) * segProg;
          const fadeProg = (t - (this.progress - this.tailLength)) / this.tailLength;
          const alpha = fadeProg * this.brightness * (this.progress <= 1 ? 1 : Math.max(0, 1 - (this.progress - 1) / this.tailLength));
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(56, 199, 204, ${alpha})`;
          ctx.fill();
        }
      }
    }

    function initPulses() {
      pulses = []; pulsesArrived = 0; forgeIgnited = false;
      const edges = ['top', 'bottom', 'left', 'right'];
      for (let i = 0; i < totalPulses; i++) {
        const edge = edges[Math.floor(Math.random() * 4)];
        pulses.push(new Pulse(createCircuitPath(edge), i * 40 + Math.random() * 100));
      }
    }

    function animate(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      ctx.clearRect(0, 0, W, H);
      pulses.forEach(p => { p.update(elapsed); p.draw(); });
      if (!forgeIgnited && pulsesArrived >= totalPulses * 0.4) { forgeIgnited = true; igniteForge(); }
      if (!pulses.every(p => p.progress > 1 + p.tailLength)) requestAnimationFrame(animate);
    }

    function igniteForge() {
      const solidShape = document.getElementById('solid-shape');
      const logoSvg = document.getElementById('logo-svg');
      const aura = document.getElementById('forge-aura');
      const circuitGlows = document.getElementById('circuit-glows');
      const lensFlare = document.getElementById('lens-flare');
      const brand = document.getElementById('brand-text');
      const btn = document.getElementById('enter-btn');

      setTimeout(() => lensFlare.classList.add('show'), 100);
      setTimeout(() => solidShape.classList.add('show'), 300);
      setTimeout(() => aura.classList.add('on'), 800);
      setTimeout(() => circuitGlows.classList.add('show'), 1200);

      setTimeout(() => {
        solidShape.classList.add('fade');
        logoSvg.classList.add('show');
      }, 1800);

      setTimeout(() => document.getElementById('production-circuits').classList.add('active'), 2400);
      setTimeout(() => document.getElementById('software-circuits').classList.add('active'), 2700);
      setTimeout(() => document.getElementById('about-circuits').classList.add('active'), 3000);

      setTimeout(() => brand.classList.add('show'), 3400);
      setTimeout(() => btn.classList.add('show'), 3900);
    }

    // Debounce hover state to prevent fighting between adjacent regions
    let labelTimeout = null;
    let hideTimeout = null;
    let currentCategory = null;
    
    function showLabel(category) {
      clearTimeout(hideTimeout); // Cancel any pending hide
      if (currentCategory === category) return; // Already showing this one
      clearTimeout(labelTimeout);
      labelTimeout = setTimeout(() => {
        currentCategory = category;
        const label = document.getElementById('category-label');
        label.textContent = categories[category].name;
        label.className = 'show ' + category;
      }, 150); // Delay prevents rapid switching
    }

    function hideLabel() {
      clearTimeout(labelTimeout); // Cancel any pending show
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        currentCategory = null;
        document.getElementById('category-label').classList.remove('show');
      }, 200); // Longer delay on hide - gives time to move to adjacent region
    }

    function expandCategory(key) {
      const expandedView = document.getElementById('expanded-view');
      const container = document.getElementById('expanded-container');
      const title = document.getElementById('expanded-title');
      const data = portfolioData[key];

      // Clear existing nodes and SVG
      container.querySelectorAll('.portfolio-node').forEach(n => n.remove());
      container.querySelectorAll('.expanded-node').forEach(n => n.remove());
      container.querySelectorAll('#constellation-svg').forEach(n => n.remove());

      expandedView.className = 'show ' + key;
      title.textContent = categories[key].name;

      // Get line color based on category
      const lineColors = {
        production: 'rgba(56,199,204,0.4)',
        software: 'rgba(167,139,250,0.4)',
        about: 'rgba(245,158,11,0.4)'
      };

      // Sort data by year (newest first) for production category
      // Add index to maintain stable order within same year
      let sortedData = data.map((item, idx) => ({ ...item, _idx: idx }));
      if (key === 'production') {
        sortedData.sort((a, b) => {
          if (b.year !== a.year) return b.year - a.year; // Newest year first
          return a._idx - b._idx; // Maintain original order within same year
        });
      }

      // Generate flowing positions - newest at top, trailing WAY down
      // Only 5-6 nodes visible at a time, scroll forever through history
      const generateFlowingPositions = (count, containerHeight) => {
        const positions = [];
        
        // 2-3 nodes per row, very spread out
        const nodesPerRow = 3;
        const rowCount = Math.ceil(count / nodesPerRow);
        
        // Each row takes up ~250px of vertical space
        const rowHeightPx = 250;
        const totalHeight = rowCount * rowHeightPx;
        
        // Spacing in percentages of total container height
        const paddingX = 12;
        
        for (let i = 0; i < count; i++) {
          const row = Math.floor(i / nodesPerRow);
          const col = i % nodesPerRow;
          const nodesInThisRow = Math.min(nodesPerRow, count - row * nodesPerRow);
          
          // Calculate x position - spread across width with variance
          const rowWidth = 100 - paddingX * 2;
          const nodeSpacing = rowWidth / nodesInThisRow;
          let x = paddingX + nodeSpacing * (col + 0.5);
          
          // Calculate y position as percentage of container
          const yPx = 80 + row * rowHeightPx; // Start 80px from top
          let y = (yPx / totalHeight) * 100;
          
          // Add organic variance
          x += (Math.random() - 0.5) * nodeSpacing * 0.4;
          y += (Math.random() - 0.5) * 2; // Small y variance
          
          positions.push({ x, y });
        }
        return { positions, totalHeight };
      };

      // Calculate container height first
      const nodesPerRow = 3;
      const rowCount = Math.ceil(sortedData.length / nodesPerRow);
      const containerHeight = rowCount * 250 + 200; // 250px per row + padding
      container.style.height = containerHeight + 'px';
      
      const { positions } = generateFlowingPositions(sortedData.length, containerHeight);

      // Create SVG for constellation lines
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.id = 'constellation-svg';
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      
      // Generate constellation lines (connect nearby nodes)
      const lines = [];
      let lineIndex = 0;
      for (let i = 0; i < positions.length; i++) {
        // Find 2-3 nearest neighbors
        const distances = positions.map((p, j) => ({
          idx: j,
          dist: Math.sqrt((p.x - positions[i].x) ** 2 + (p.y - positions[i].y) ** 2)
        })).filter(d => d.idx !== i).sort((a, b) => a.dist - b.dist);
        
        // Connect to 1-2 nearest (not all, to avoid chaos)
        const connectCount = Math.min(2, Math.floor(Math.random() * 2) + 1);
        for (let c = 0; c < connectCount && c < distances.length; c++) {
          const j = distances[c].idx;
          // Avoid duplicate lines
          const lineKey = [Math.min(i, j), Math.max(i, j)].join('-');
          if (!lines.includes(lineKey)) {
            lines.push(lineKey);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', positions[i].x);
            line.setAttribute('y1', positions[i].y);
            line.setAttribute('x2', positions[j].x);
            line.setAttribute('y2', positions[j].y);
            line.setAttribute('class', 'constellation-line');
            line.style.setProperty('--line-color', lineColors[key]);
            // Slight timing variation per line
            line.style.setProperty('--flow-dur', (2.5 + Math.random() * 2) + 's');
            line.style.setProperty('--flow-del', (Math.random() * -3) + 's');
            svg.appendChild(line);
            
            // Lines only - no dots
            lineIndex++;
          }
        }
      }
      container.appendChild(svg);

      // Create nodes for all items (sorted by year for production)
      sortedData.forEach((item, i) => {
        const pos = positions[i];
        const node = document.createElement('div');
        node.className = `portfolio-node ${key}`;
        node.style.left = pos.x + '%';
        node.style.top = pos.y + '%';
        
        // Micro-orbital animation - unique tiny orbit per node, max 2px movement
        // This prevents collisions because movement is so small and unique per node
        const orbitDur = 12 + Math.random() * 10; // 12-22s (slower for smoother feel)
        const orbitDel = Math.random() * -20; // random start point
        const maxMove = 2; // max 2px in any direction (smaller for dense layouts)
        node.style.setProperty('--orbit-dur', orbitDur + 's');
        node.style.setProperty('--orbit-del', orbitDel + 's');
        node.style.setProperty('--orbit-x1', ((Math.random() - 0.5) * maxMove * 2) + 'px');
        node.style.setProperty('--orbit-y1', ((Math.random() - 0.5) * maxMove * 2) + 'px');
        node.style.setProperty('--orbit-x2', ((Math.random() - 0.5) * maxMove * 2) + 'px');
        node.style.setProperty('--orbit-y2', ((Math.random() - 0.5) * maxMove * 2) + 'px');
        node.style.setProperty('--orbit-x3', ((Math.random() - 0.5) * maxMove * 2) + 'px');
        node.style.setProperty('--orbit-y3', ((Math.random() - 0.5) * maxMove * 2) + 'px');

        // Determine label based on category type
        let primaryLabel, secondaryLabel, imageContent;
        
        if (key === 'production') {
          primaryLabel = item.artist;
          secondaryLabel = item.show;
          imageContent = item.image 
            ? `<div class="portfolio-node-image" style="background-image: url('${item.image}')"></div>`
            : `<div class="portfolio-node-image no-image">${item.artist.charAt(0)}</div>`;
        } else if (key === 'software') {
          primaryLabel = item.name;
          secondaryLabel = item.type;
          imageContent = `<div class="portfolio-node-image no-image">${item.name.charAt(0)}</div>`;
        } else {
          primaryLabel = item.name;
          secondaryLabel = item.type === 'bio' ? 'Bio' : item.type;
          imageContent = `<div class="portfolio-node-image no-image">${item.name.charAt(0)}</div>`;
        }

        node.innerHTML = `
          <div class="portfolio-node-frame">
            ${imageContent}
          </div>
          <div class="portfolio-node-label">
            <div class="artist">${primaryLabel}</div>
            <div class="show">${secondaryLabel}</div>
          </div>
        `;
        
        node.onclick = (e) => { 
          e.stopPropagation(); 
          showPortfolioPanel(item, key); 
        };
        container.appendChild(node);
      });

      document.getElementById('forge-view').classList.remove('show');
      document.getElementById('hud').classList.remove('show');
      document.getElementById('back-btn').classList.add('show');
      hideLabel();
    }

    function showPortfolioPanel(item, category) {
      const panel = document.getElementById('detail-panel');
      panel.className = 'show ' + category;
      
      let titleText, typeText, contentHtml;

      if (category === 'production') {
        titleText = item.artist;
        typeText = item.show;
        contentHtml = `
          <span class="year-badge">${item.year}</span>
          <div class="your-role">${item.role}</div>
          <div class="credits">
            ${item.credits.map(c => `
              <div class="credit-item">
                <span class="credit-role">${c.role}</span>
                <span class="credit-name">${c.name}${c.company ? `<br><span class="credit-company">${c.company}</span>` : ''}</span>
              </div>
            `).join('')}
          </div>
        `;
      } else if (category === 'software') {
        titleText = item.name;
        typeText = item.type;
        contentHtml = `
          <p>${item.desc}</p>
          <div class="tags" style="margin-top: 15px;">
            ${item.tech.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        `;
      } else {
        titleText = item.name;
        typeText = item.title || (item.type === 'resume' ? 'Experience' : 'About');
        contentHtml = `<p>${item.bio || item.content || ''}</p>`;
      }

      document.getElementById('p-title').textContent = titleText;
      document.getElementById('p-type').textContent = typeText;
      document.getElementById('p-desc').innerHTML = contentHtml;
      document.getElementById('p-tags').innerHTML = '';
    }

    function backToOverview() {
      document.getElementById('expanded-view').classList.remove('show');
      document.getElementById('forge-view').classList.add('show');
      document.getElementById('hud').classList.add('show');
      document.getElementById('back-btn').classList.remove('show');
      closePanel();
    }

    function showPanel(item, region) {
      const panel = document.getElementById('detail-panel');
      panel.className = 'show ' + region;
      document.getElementById('p-title').textContent = item.name;
      document.getElementById('p-type').textContent = item.type;
      document.getElementById('p-desc').innerHTML = `<p>${item.desc}</p>`;
      document.getElementById('p-tags').innerHTML = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
    }

    function closePanel() { document.getElementById('detail-panel').classList.remove('show'); }

    function enterForge() {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('forge-view').classList.add('show');
      document.getElementById('hud').classList.add('show');
    }

    function backToIntro() {
      document.getElementById('forge-view').classList.remove('show');
      document.getElementById('expanded-view').classList.remove('show');
      document.getElementById('hud').classList.remove('show');
      document.getElementById('back-btn').classList.remove('show');
      document.getElementById('intro').classList.remove('hidden');
      closePanel();
    }

    function contact() { window.location.href = 'mailto:steve@cueforgelabs.com?subject=Project%20Inquiry'; }

    window.addEventListener('resize', resize);
    resize();
    setTimeout(() => { initPulses(); requestAnimationFrame(animate); }, 150);
  </script>
</body>
</html>
