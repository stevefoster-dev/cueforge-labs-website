<html lang="en">
<head>
  <meta charset="UTF-8">

  <script>
    // Skip intro instantly (before paint) if already entered this session
    if (sessionStorage.getItem('forgeEntered')) {
      document.documentElement.classList.add('skip-intro');
    }
  </script>

  <meta property="og:description" content="Live events programming and software development. Tools designed from building the biggest pop shows on the planet.">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CueForge Labs">
  <meta name="twitter:description" content="Live events programming and software development. Tools designed from building the biggest pop shows on the planet.">
  <meta name="twitter:image" content="https://cueforgelabs.com/images/og-image.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --forge-dark: #060a0d;
      --forge-darker: #020305;
      --forge-teal: #38c7cc;
      --forge-cyan: #22d3ee;
      --forge-lavender: #a78bfa;
      --forge-amber: #f59e0b;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--forge-darker);
      color: #e5e7eb;
    }

    /* INTRO */
    #intro {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }
    #intro.hidden {
      opacity: 0; transform: scale(1.05);
      pointer-events: none;
    }
    /* Instant skip — no flash of intro on return visits */
    .skip-intro #intro {
      display: none !important;
    }
    .skip-intro #forge-view {
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    .skip-intro #hud {
      opacity: 1 !important;
    }

    #circuit-canvas {
      position: absolute; inset: 0;
      z-index: 1;
    }

    /* Lens flare */
    #lens-flare {
      position: absolute;
      width: 180%; height: 180%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease;
    }
    #lens-flare.show { opacity: 1; }

    .flare-ray {
      position: absolute;
      top: 50%; left: 50%;
      width: 200%;
      height: 2px;
      transform-origin: center center;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(56,199,204,0.02) 20%,
        rgba(56,199,204,0.06) 40%,
        rgba(56,199,204,0.1) 50%,
        rgba(56,199,204,0.06) 60%,
        rgba(56,199,204,0.02) 80%,
        transparent 100%
      );
    }
    .flare-ray:nth-child(1) { animation: ray-rotate 50s linear infinite; --r: 0deg; }
    .flare-ray:nth-child(2) { animation: ray-rotate 50s linear infinite; --r: 90deg; height: 1.5px; opacity: 0.8; }
    .flare-ray:nth-child(3) { animation: ray-rotate 50s linear infinite; --r: 45deg; animation-delay: -15s; height: 1.5px; opacity: 0.5; }
    .flare-ray:nth-child(4) { animation: ray-rotate 50s linear infinite; --r: 135deg; animation-delay: -15s; height: 1.5px; opacity: 0.5; }

    .flare-glow {
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center,
        rgba(56,199,204,0.05) 0%,
        rgba(56,199,204,0.02) 30%,
        transparent 55%
      );
      animation: glow-pulse 6s ease-in-out infinite;
    }

    @keyframes ray-rotate {
      from { transform: translate(-50%, -50%) rotate(var(--r, 0deg)); }
      to { transform: translate(-50%, -50%) rotate(calc(var(--r, 0deg) + 360deg)); }
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    #logo-wrap {
      position: relative; z-index: 10;
      width: min(700px, 92vw);
    }

    /* SOLID SHAPE - shows first */
    #solid-shape {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1s ease;
      filter: drop-shadow(0 0 30px rgba(56,199,204,0.5)) drop-shadow(0 0 60px rgba(56,199,204,0.3));
    }
    #solid-shape.show { opacity: 1; }
    #solid-shape.fade { opacity: 0; transition: opacity 1.5s ease; }
    #solid-shape path { fill: var(--forge-teal); }

    /* MAIN LOGO - ALL TEAL on intro landing */
    #logo-svg {
      width: 100%; height: auto;
      opacity: 0;
      transition: opacity 1.2s ease;
      overflow: visible;
    }
    #logo-svg.show { opacity: 1; }

    #solid-shape {
      overflow: visible;
    }

    .logo-base {
      fill: #000101;
      stroke: var(--forge-teal);
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(56,199,204,0.4));
    }

    /* ALL circuit groups start TEAL on intro */
    .circuit-group {
      opacity: 0.15;
      transition: opacity 0.8s ease, stroke 0.8s ease, filter 0.8s ease;
      stroke: var(--forge-teal);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .circuit-group circle {
      fill: rgba(56,199,204,0.25);
      stroke: var(--forge-teal);
      stroke-width: 4;
    }
    .circuit-group.active {
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(56,199,204,0.8)) drop-shadow(0 0 25px rgba(56,199,204,0.5));
      animation: pulse-teal 2.5s ease-in-out infinite;
    }

    @keyframes pulse-teal {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(56,199,204,0.8)) drop-shadow(0 0 25px rgba(56,199,204,0.5)); }
      50% { filter: drop-shadow(0 0 20px rgba(56,199,204,1)) drop-shadow(0 0 40px rgba(56,199,204,0.7)); }
    }

    /* Stagger the pulse animations */
    #production-circuits.active { animation-delay: 0s; }
    #software-circuits.active { animation-delay: 0.8s; }
    #about-circuits.active { animation-delay: 1.6s; }

    /* SOFT AURA - Multiple radial gradients for soft edges */
    #forge-aura {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 130%; height: 130%;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 1s ease;
    }
    #forge-aura.on { opacity: 1; }

    /* Soft radial glow layers instead of stroke+blur */
    .aura-glow {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgba(56,199,204,0.15) 0%,
        rgba(56,199,204,0.08) 30%,
        rgba(56,199,204,0.03) 50%,
        transparent 70%
      );
      animation: aura-breathe 3s ease-in-out infinite;
    }
    .aura-glow.center {
      width: 100%; height: 100%;
      top: 0; left: 0;
    }
    .aura-glow.top-left {
      width: 60%; height: 50%;
      top: 5%; left: 5%;
      animation-delay: 0.5s;
    }
    .aura-glow.top-right {
      width: 55%; height: 45%;
      top: 8%; right: 5%;
      left: auto;
      animation-delay: 1s;
    }
    .aura-glow.bottom-left {
      width: 45%; height: 55%;
      bottom: 10%; left: 8%;
      top: auto;
      animation-delay: 1.5s;
    }
    .aura-glow.bottom-right {
      width: 50%; height: 50%;
      bottom: 8%; right: 8%;
      top: auto; left: auto;
      animation-delay: 2s;
    }

    @keyframes aura-breathe {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* CIRCUIT GLOW REGIONS - Animated gradient areas behind logo */
    #circuit-glows {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1.5s ease;
      pointer-events: none;
      z-index: 4;
      mix-blend-mode: screen;
    }
    #circuit-glows.show { opacity: 1; }

    .circuit-glow-region {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Software glow - follows left arm path */
    #glow-software {
      stroke: url(#glowGradientSoftware);
      stroke-width: 80;
      filter: blur(30px);
      opacity: 0.4;
      animation: glow-drift-1 8s ease-in-out infinite;
    }

    /* Production glow - follows center/top paths */
    #glow-production {
      stroke: url(#glowGradientProduction);
      stroke-width: 100;
      filter: blur(35px);
      opacity: 0.35;
      animation: glow-drift-2 10s ease-in-out infinite;
    }

    /* About glow - follows bottom right path */
    #glow-about {
      stroke: url(#glowGradientAbout);
      stroke-width: 70;
      filter: blur(28px);
      opacity: 0.4;
      animation: glow-drift-3 9s ease-in-out infinite;
    }

    @keyframes glow-drift-1 {
      0%, 100% { opacity: 0.3; stroke-width: 80; }
      50% { opacity: 0.5; stroke-width: 90; }
    }
    @keyframes glow-drift-2 {
      0%, 100% { opacity: 0.25; stroke-width: 100; }
      50% { opacity: 0.45; stroke-width: 115; }
    }
    @keyframes glow-drift-3 {
      0%, 100% { opacity: 0.3; stroke-width: 70; }
      50% { opacity: 0.5; stroke-width: 85; }
    }

    #brand-text {
      margin-top: 30px; text-align: center;
      opacity: 0; transform: translateY(20px);
      transition: all 0.8s ease; z-index: 10;
    }
    #brand-text.show { opacity: 1; transform: translateY(0); }
    #brand-text h1 {
      font-size: clamp(2rem,5vw,3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    #brand-text h1 span {
      color: var(--forge-teal);
      text-shadow: 0 0 40px rgba(56,199,204,0.6);
    }
    #brand-text p {
      font-size: clamp(0.85rem,2vw,1.05rem);
      color: #6b7280;
      margin-top: 8px;
      font-family: 'JetBrains Mono', monospace;
    }

    #enter-btn {
      margin-top: 40px; padding: 16px 50px;
      font-size: 1rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--forge-darker); background: var(--forge-teal);
      border: none; border-radius: 4px; cursor: pointer;
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s ease; z-index: 10;
      box-shadow: 0 0 30px rgba(56,199,204,0.5);
    }
    #enter-btn.show { opacity: 1; transform: translateY(0); }
    #enter-btn:hover {
      background: var(--forge-cyan);
      box-shadow: 0 0 50px rgba(56,199,204,0.7);
      transform: translateY(-3px);
    }

    /* FORGE VIEW */
    #forge-view {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(56,199,204,0.12) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 75% 20%, rgba(167,139,250,0.10) 0%, transparent 45%),
        radial-gradient(ellipse 70% 60% at 85% 70%, rgba(56,199,204,0.10) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 10% 80%, rgba(167,139,250,0.08) 0%, transparent 40%),
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(56,199,204,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      opacity: 0; pointer-events: none;
      transition: opacity 1s ease;
    }
    #forge-view.show { opacity: 1; pointer-events: auto; }

    /* Forge guardrails */
    .forge-guardrails {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .forge-guardrails .rail-left, .forge-guardrails .rail-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 120px;
    }
    .forge-guardrails .rail-left { left: 20px; }
    .forge-guardrails .rail-right { right: 20px; }
    .forge-guardrails svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .forge-guardrails .rail-trace {
      fill: none;
      stroke: rgba(56,199,204,0.4);
      stroke-width: 3;
      stroke-linecap: square;
      filter: drop-shadow(0 0 8px rgba(56,199,204,0.2));
    }
    .forge-guardrails .rail-pulse {
      position: absolute;
      width: 4px;
      height: 40px;
      background: linear-gradient(180deg, transparent, var(--forge-cyan), var(--forge-teal), transparent);
      border-radius: 2px;
      box-shadow: 0 0 15px var(--forge-teal);
      animation: forge-pulse-flow 10s ease-in-out infinite;
    }
    .forge-guardrails .rail-pulse.p1 { left: 30px; animation-delay: 0s; }
    .forge-guardrails .rail-pulse.p2 { left: 60px; animation-delay: 3s; height: 30px; }
    .forge-guardrails .rail-pulse.p3 { left: 90px; animation-delay: 6s; height: 50px; }
    .forge-guardrails .rail-right .rail-pulse.p1 { left: auto; right: 30px; animation-delay: 1.5s; }
    .forge-guardrails .rail-right .rail-pulse.p2 { left: auto; right: 60px; animation-delay: 4.5s; }
    .forge-guardrails .rail-right .rail-pulse.p3 { left: auto; right: 90px; animation-delay: 7.5s; }
    @keyframes forge-pulse-flow {
      0% { top: -50px; opacity: 0; }
      5% { opacity: 0.7; }
      95% { opacity: 0.7; }
      100% { top: 100%; opacity: 0; }
    }
    @media (max-width: 1100px) {
      .forge-guardrails .rail-left { left: 0; opacity: 0.5; }
      .forge-guardrails .rail-right { right: 0; opacity: 0.5; }
    }
    @media (max-width: 900px) {
      .forge-guardrails .rail-left, .forge-guardrails .rail-right { width: 80px; opacity: 0.3; }
    }
    @media (max-width: 768px) {
      .forge-guardrails { display: none; }
    }

    #forge-container {
      position: relative;
      width: min(1100px, 92vw);
      aspect-ratio: 2232.6 / 1387.35;
      z-index: 1;
    }

    #forge-logo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }

    .forge-base {
      fill: rgba(6,10,13,0.95);
      stroke: rgba(56,199,204,0.2);
      stroke-width: 2;
    }

    /* NEBULA REGIONS - ESO Constellation Style */
    .nebula-region {
      cursor: pointer;
      transition: opacity 0.8s ease 0.15s, filter 0.8s ease 0.15s;
      opacity: 0.85;
      pointer-events: none;
    }
    .nebula-region:hover { 
      opacity: 1; 
      filter: brightness(1.2);
      transition: opacity 0.4s ease, filter 0.4s ease;
    }
    .nebula-region .nebula-hit-area {
      fill: transparent;
      stroke: none;
      pointer-events: all;
      cursor: pointer;
    }

    /* Layered nebula clouds */
    .nebula-cloud-base {
      opacity: 0.4;
    }
    .nebula-cloud-mid {
      opacity: 0.6;
    }
    .nebula-cloud-bright {
      opacity: 0.8;
    }
    .nebula-cloud-core {
      opacity: 0.9;
    }
    .nebula-wisp {
      opacity: 0.3;
    }

    .nebula-software .nebula-cloud-base { fill: url(#nebulaBaseSoftware); filter: url(#nebulaTurbulence); }
    .nebula-software .nebula-cloud-mid { fill: url(#nebulaMidSoftware); filter: url(#nebulaGlow); }
    .nebula-software .nebula-cloud-bright { fill: url(#nebulaBrightSoftware); filter: url(#nebulaSharp); }
    .nebula-software .nebula-cloud-core { fill: url(#nebulaCenterSoftware); filter: url(#nebulaCore); }
    .nebula-software .nebula-wisp { fill: url(#nebulaWispSoftware); filter: url(#nebulaWispFilter); }

    .nebula-production .nebula-cloud-base { fill: url(#nebulaBaseProduction); filter: url(#nebulaTurbulence); }
    .nebula-production .nebula-cloud-mid { fill: url(#nebulaMidProduction); filter: url(#nebulaGlow); }
    .nebula-production .nebula-cloud-bright { fill: url(#nebulaBrightProduction); filter: url(#nebulaSharp); }
    .nebula-production .nebula-cloud-core { fill: url(#nebulaCenterProduction); filter: url(#nebulaCore); }
    .nebula-production .nebula-wisp { fill: url(#nebulaWispProduction); filter: url(#nebulaWispFilter); }

    .nebula-about .nebula-cloud-base { fill: url(#nebulaBaseAbout); filter: url(#nebulaTurbulence); }
    .nebula-about .nebula-cloud-mid { fill: url(#nebulaMidAbout); filter: url(#nebulaGlow); }
    .nebula-about .nebula-cloud-bright { fill: url(#nebulaBrightAbout); filter: url(#nebulaSharp); }
    .nebula-about .nebula-cloud-core { fill: url(#nebulaCenterAbout); filter: url(#nebulaCore); }
    .nebula-about .nebula-wisp { fill: url(#nebulaWispAbout); filter: url(#nebulaWispFilter); }

    /* Nebula animations - multiple variants for randomness */
    @keyframes nebula-drift-1 {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
      33% { opacity: 0.48; transform: scale(1.04) translate(10px, -7px); }
      66% { opacity: 0.4; transform: scale(0.96) translate(-6px, 9px); }
    }
    @keyframes nebula-drift-2 {
      0%, 100% { opacity: 0.38; transform: scale(1) translate(0, 0); }
      40% { opacity: 0.52; transform: scale(0.97) translate(-8px, 6px); }
      70% { opacity: 0.42; transform: scale(1.03) translate(5px, -10px); }
    }
    @keyframes nebula-drift-3 {
      0%, 100% { opacity: 0.33; transform: scale(1) translate(0, 0); }
      25% { opacity: 0.45; transform: scale(1.02) translate(6px, 8px); }
      55% { opacity: 0.5; transform: scale(0.98) translate(-10px, -5px); }
      80% { opacity: 0.4; transform: scale(1.01) translate(3px, -8px); }
    }
    @keyframes nebula-pulse-1 {
      0%, 100% { opacity: 0.55; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.75; transform: scale(1.05) translate(5px, -3px); }
    }
    @keyframes nebula-pulse-2 {
      0%, 100% { opacity: 0.58; transform: scale(1) translate(0, 0); }
      35% { opacity: 0.7; transform: scale(0.97) translate(-4px, 6px); }
      70% { opacity: 0.72; transform: scale(1.03) translate(3px, -5px); }
    }
    @keyframes nebula-pulse-3 {
      0%, 100% { opacity: 0.52; transform: scale(1) translate(0, 0); }
      60% { opacity: 0.78; transform: scale(1.04) translate(-6px, -4px); }
    }
    @keyframes nebula-glow-1 {
      0%, 100% { opacity: 0.75; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.95; transform: scale(1.07) translate(4px, -5px); }
    }
    @keyframes nebula-glow-2 {
      0%, 100% { opacity: 0.72; transform: scale(1) translate(0, 0); }
      40% { opacity: 0.88; transform: scale(1.04) translate(-5px, 3px); }
      75% { opacity: 0.92; transform: scale(1.06) translate(3px, -4px); }
    }
    @keyframes nebula-glow-3 {
      0%, 100% { opacity: 0.78; transform: scale(1) translate(0, 0); }
      55% { opacity: 0.98; transform: scale(1.05) translate(-3px, -6px); }
    }
    @keyframes nebula-core-1 {
      0%, 100% { opacity: 0.85; transform: scale(1) translate(0, 0); }
      50% { opacity: 1; transform: scale(1.1) translate(3px, -4px); }
    }
    @keyframes nebula-core-2 {
      0%, 100% { opacity: 0.82; transform: scale(1) translate(0, 0); }
      35% { opacity: 0.95; transform: scale(1.06) translate(-4px, 2px); }
      70% { opacity: 1; transform: scale(1.08) translate(2px, -3px); }
    }
    @keyframes nebula-core-3 {
      0%, 100% { opacity: 0.88; transform: scale(1) translate(0, 0); }
      60% { opacity: 1; transform: scale(1.12) translate(-2px, -5px); }
    }
    @keyframes nebula-wisp-1 {
      0%, 100% { opacity: 0.25; transform: scale(1) translate(0, 0); }
      25% { opacity: 0.4; transform: scale(1.06) translate(15px, -12px); }
      50% { opacity: 0.32; transform: scale(0.94) translate(-10px, 18px); }
      75% { opacity: 0.38; transform: scale(1.02) translate(-12px, -10px); }
    }
    @keyframes nebula-wisp-2 {
      0%, 100% { opacity: 0.28; transform: scale(1) translate(0, 0); }
      30% { opacity: 0.35; transform: scale(0.96) translate(-12px, 8px); }
      60% { opacity: 0.42; transform: scale(1.04) translate(8px, -15px); }
      85% { opacity: 0.32; transform: scale(1.01) translate(10px, 5px); }
    }

    /* All nebula elements use CSS custom properties for random timing */
    .nebula-region:hover .nebula-wisp {
      animation: nebula-wisp-1 var(--dur, 28s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-base {
      animation: nebula-drift-1 var(--dur, 22s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-mid {
      animation: nebula-pulse-1 var(--dur, 16s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-bright {
      animation: nebula-glow-1 var(--dur, 11s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }
    .nebula-region:hover .nebula-cloud-core {
      animation: nebula-core-1 var(--dur, 7s) ease-in-out infinite;
      animation-delay: var(--del, 0s);
    }

    /* Star nodes - ESO constellation style */
    .star-node {
      fill: currentColor;
      opacity: 0.4;
      filter: drop-shadow(0 0 3px currentColor);
      transition: opacity 0.8s ease, filter 0.8s ease;
    }
    .star-connector {
      stroke: currentColor;
      stroke-width: 1.2;
      opacity: 0.15;
      filter: drop-shadow(0 0 2px currentColor);
      transition: opacity 0.8s ease, filter 0.8s ease;
      pointer-events: stroke;
    }
    
    /* Invisible hit area for easier line hovering */
    .star-network {
      pointer-events: all;
    }
    .star-network line {
      cursor: pointer;
    }

    .nebula-software .star-node,
    .nebula-software .star-connector { color: #e9d5ff; }
    .nebula-software .star-network {
      isolation: isolate;
      position: relative;
    }
    .nebula-production .star-node,
    .nebula-production .star-connector { color: #99f6e4; }
    .nebula-about .star-node,
    .nebula-about .star-connector { color: #fde68a; }

    /* Hover state - constellation lights up */
    .nebula-region:hover .star-node {
      opacity: 0.9;
      filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 15px currentColor);
      animation: twinkle var(--twinkle-duration, 2s) ease-in-out infinite;
      animation-delay: var(--twinkle-delay, 0s);
    }
    .nebula-region:hover .star-connector {
      opacity: 0.5;
      filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 8px currentColor);
      animation: twinkle-line var(--twinkle-duration, 2s) ease-in-out infinite;
      animation-delay: var(--twinkle-delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 12px currentColor); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px currentColor) drop-shadow(0 0 25px currentColor); }
    }
    @keyframes twinkle-line {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.7; }
    }

    /* Circuit lines over nebulas */
    .forge-circuit {
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-width: 8;
      opacity: 0.6;
      pointer-events: none;
    }
    .forge-circuit .hit-area {
      fill: transparent;
      stroke: none;
      pointer-events: none;
      cursor: pointer;
    }
    .forge-circuit circle { 
      stroke-width: 3;
    }
    .forge-circuit polyline,
    .forge-circuit line {
      pointer-events: none;
    }

    #forge-software-circuit { stroke: var(--forge-lavender); }
    #forge-software-circuit circle {
      fill: rgba(167,139,250,0.4);
      stroke: var(--forge-lavender);
    }
    #forge-software-circuit:hover ~ .nebula-software,
    #forge-software-circuit:hover { opacity: 1; filter: brightness(1.3); }

    #forge-production-circuit { stroke: var(--forge-teal); }
    #forge-production-circuit circle {
      fill: rgba(56,199,204,0.4);
      stroke: var(--forge-teal);
    }
    #forge-production-circuit:hover { opacity: 1; filter: brightness(1.3); }

    #forge-about-circuit { stroke: var(--forge-amber); }
    #forge-about-circuit circle {
      fill: rgba(245,158,11,0.4);
      stroke: var(--forge-amber);
    }
    #forge-about-circuit:hover { opacity: 1; filter: brightness(1.3); }

    /* Category label */
    #category-label {
      position: fixed;
      bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 14px 45px;
      font-size: 1.3rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #fff;
      background: rgba(6,10,13,0.9);
      border: 2px solid currentColor;
      border-radius: 8px;
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
      z-index: 80;
      backdrop-filter: blur(10px);
    }
    #category-label.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #category-label.production {
      color: var(--forge-teal);
      border-color: var(--forge-teal);
      box-shadow: 0 0 30px rgba(56,199,204,0.4);
    }
    #category-label.software {
      color: var(--forge-lavender);
      border-color: var(--forge-lavender);
      box-shadow: 0 0 30px rgba(167,139,250,0.4);
    }
    #category-label.about {
      color: var(--forge-amber);
      border-color: var(--forge-amber);
      box-shadow: 0 0 30px rgba(245,158,11,0.4);
    }

    /* EXPANDED VIEW */
    #expanded-view {
      position: fixed; inset: 0;
      display: flex; align-items: flex-start; justify-content: center;
      background: radial-gradient(ellipse at center, #080c10 0%, #020305 70%);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 55;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 20px;
    }
    #expanded-view.show { opacity: 1; pointer-events: auto; }
    
    /* Category-specific nebula backgrounds */
    #expanded-view::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: radial-gradient(ellipse at 30% 40%, var(--cat-nebula-1) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 60%, var(--cat-nebula-2) 0%, transparent 45%),
                  radial-gradient(ellipse at 50% 30%, var(--cat-nebula-3) 0%, transparent 55%);
      opacity: 0.4;
      animation: expanded-nebula-drift 30s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes expanded-nebula-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(3%, -2%) scale(1.02); }
      66% { transform: translate(-2%, 3%) scale(0.98); }
    }
    #expanded-view.production {
      --cat-nebula-1: rgba(56,199,204,0.3);
      --cat-nebula-2: rgba(34,211,238,0.2);
      --cat-nebula-3: rgba(6,182,212,0.25);
    }
    #expanded-view.software {
      --cat-nebula-1: rgba(167,139,250,0.3);
      --cat-nebula-2: rgba(139,92,246,0.2);
      --cat-nebula-3: rgba(192,132,252,0.25);
    }
    #expanded-view.about {
      --cat-nebula-1: rgba(245,158,11,0.3);
      --cat-nebula-2: rgba(251,146,60,0.2);
      --cat-nebula-3: rgba(234,88,12,0.25);
    }

    #expanded-container {
      position: relative;
      width: min(1100px, 92vw);
      min-height: 100vh;
      height: auto;
      padding-bottom: 150px;
      padding-top: 60px;
    }

    #expanded-outline {
      display: none; /* Hidden - using full nebula background instead */
    }

    /* Anvil header container - scrolls with content */
    #expanded-header {
      position: absolute;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #anvil-outline {
      position: relative;
      width: 340px;
      height: 210px;
    }
    
    #anvil-outline svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    
    #anvil-outline .anvil-shape {
      fill: rgba(2,3,5,0.92);
      stroke: var(--forge-teal);
      stroke-width: 14;
      filter: drop-shadow(0 0 20px rgba(56,199,204,0.6)) drop-shadow(0 0 40px rgba(56,199,204,0.3));
      transition: stroke 0.3s ease, filter 0.3s ease;
    }
    #expanded-view.software #anvil-outline .anvil-shape {
      stroke: var(--forge-lavender);
      filter: drop-shadow(0 0 20px rgba(167,139,250,0.6)) drop-shadow(0 0 40px rgba(167,139,250,0.3));
    }
    #expanded-view.about #anvil-outline .anvil-shape {
      stroke: var(--forge-amber);
      filter: drop-shadow(0 0 20px rgba(245,158,11,0.6)) drop-shadow(0 0 40px rgba(245,158,11,0.3));
    }

    #expanded-title {
      position: absolute;
      top: 28%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--forge-teal);
      text-shadow: 0 0 25px currentColor;
      white-space: nowrap;
      margin: 0;
      padding: 0;
    }
    #expanded-view.software #expanded-title { color: var(--forge-lavender); }
    #expanded-view.about #expanded-title { color: var(--forge-amber); }

    .expanded-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .expanded-node-core {
      width: 70px; height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(56,199,204,0.25), rgba(6,10,13,0.95));
      border: 2px solid var(--forge-teal);
      box-shadow: 0 0 25px rgba(56,199,204,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .expanded-node:hover .expanded-node-core {
      transform: scale(1.15);
      box-shadow: 0 0 40px rgba(56,199,204,0.7);
    }
    #expanded-view.software .expanded-node-core {
      background: radial-gradient(circle at 30% 30%, rgba(167,139,250,0.25), rgba(6,10,13,0.95));
      border-color: var(--forge-lavender);
      box-shadow: 0 0 25px rgba(167,139,250,0.5);
    }
    #expanded-view.about .expanded-node-core {
      background: radial-gradient(circle at 30% 30%, rgba(245,158,11,0.25), rgba(6,10,13,0.95));
      border-color: var(--forge-amber);
      box-shadow: 0 0 25px rgba(245,158,11,0.5);
    }

    .expanded-node-label {
      position: absolute;
      top: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.7rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .expanded-node-type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.4rem;
      color: var(--forge-teal);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 4px;
    }
    #expanded-view.software .expanded-node-type { color: var(--forge-lavender); }
    #expanded-view.about .expanded-node-type { color: var(--forge-amber); }

    #back-btn {
      position: fixed;
      top: 20px; left: 160px;
      padding: 10px 20px;
      font-size: 0.75rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--forge-teal);
      background: transparent;
      border: 1px solid rgba(56,199,204,0.4);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transition: all 0.3s ease;
      z-index: 90;
    }
    #back-btn.show { opacity: 1; pointer-events: auto; }
    #back-btn:hover {
      background: rgba(56,199,204,0.1);
      border-color: var(--forge-teal);
    }

    #detail-panel {
      position: fixed; top: 50%; right: 25px;
      transform: translateY(-50%) translateX(20px);
      width: 320px; max-height: 80vh; padding: 22px;
      background: rgba(6,10,13,0.98);
      border: 1px solid rgba(56,199,204,0.3);
      border-radius: 10px; backdrop-filter: blur(12px);
      opacity: 0; pointer-events: none;
      transition: all 0.35s ease; z-index: 100;
      overflow-y: auto;
    }
    #detail-panel.show {
      opacity: 1; pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    #detail-panel h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
    #detail-panel.production h3 { color: var(--forge-teal); }
    #detail-panel.software h3 { color: var(--forge-lavender); }
    #detail-panel.about h3 { color: var(--forge-amber); }
    #detail-panel .type {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: #6b7280; margin-bottom: 12px;
    }
    #detail-panel p { font-size: 0.8rem; color: #9ca3af; line-height: 1.55; }
    #detail-panel .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
    #detail-panel .tag { font-size: 0.55rem; padding: 3px 8px; border-radius: 4px; }
    #detail-panel.production .tag { background: rgba(56,199,204,0.12); color: var(--forge-teal); }
    #detail-panel.software .tag { background: rgba(167,139,250,0.12); color: var(--forge-lavender); }
    #detail-panel.about .tag { background: rgba(245,158,11,0.12); color: var(--forge-amber); }
    #detail-panel .close-btn {
      position: absolute; top: 10px; right: 10px;
      width: 22px; height: 22px;
      background: transparent; border: none;
      color: #6b7280; cursor: pointer;
      font-size: 1.1rem; transition: color 0.2s;
    }
    #detail-panel .close-btn:hover { color: #fff; }

    #hud {
      position: fixed; inset: 0; z-index: 60;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #hud.show { opacity: 1; }

    #logo-badge {
      position: absolute; top: 20px; left: 160px;
      display: flex; align-items: center; gap: 10px;
      opacity: 0.6; pointer-events: auto; cursor: pointer;
      transition: opacity 0.3s;
    }
    #logo-badge:hover { opacity: 1; }
    #logo-badge svg { width: 32px; height: 26px; }
    #logo-badge span { font-weight: 600; font-size: 0.85rem; color: var(--forge-teal); }

    #contact-btn-hud {
      position: absolute; top: 20px; right: 160px;
      padding: 8px 16px; font-size: 0.7rem; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--forge-teal); background: transparent;
      border: 1px solid rgba(56,199,204,0.35);
      border-radius: 4px; cursor: pointer; pointer-events: auto;
      transition: all 0.3s;
    }
    #contact-btn-hud:hover {
      background: rgba(56,199,204,0.12);
      border-color: var(--forge-teal);
    }

    #forge-title {
      position: absolute; top: 140px; left: 50%;
      transform: translateX(-50%);
      font-size: 2.8rem; font-weight: 300; color: rgba(255,255,255,0.85);
      letter-spacing: 0.06em;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }

    /* ===== MOBILE: HUD, Title, Performance ===== */
    @media (max-width: 900px) {
      #logo-badge { left: 15px; }
      #contact-btn-hud { right: 15px; }
    }
    @media (max-width: 600px) {
      #logo-badge {
        left: 10px;
        top: 12px;
      }
      #logo-badge span { display: none; }
      #contact-btn-hud {
        right: 10px;
        top: 12px;
        padding: 6px 10px;
        font-size: 0.6rem;
      }
      #forge-title {
        white-space: normal;
        font-size: clamp(1.3rem, 5.5vw, 2.2rem);
        top: 60px;
        width: 85%;
        line-height: 1.3;
      }
      #hint {
        font-size: 0.45rem;
        bottom: 10px;
      }
      /* Kill heavy SVG filters on mobile - they crash Safari */
      .nebula-cloud-base,
      .nebula-cloud-mid,
      .nebula-cloud-bright,
      .nebula-cloud-core,
      .nebula-wisp {
        filter: none !important;
      }
      .circuit-glow-region {
        filter: none !important;
      }
      /* Reduce intro canvas animation load */
      #circuit-glows { display: none; }
      .flare-ray { display: none; }
    }
    #forge-title span {
      color: #38c7cc; font-weight: 600;
    }
    #hint {
      position: absolute; bottom: 28px; left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; color: rgba(255,255,255,0.5);
      text-transform: uppercase; letter-spacing: 0.12em;
      animation: hint-pulse 3s ease-in-out infinite;
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }

    #vignette {
      position: fixed; inset: 0; z-index: 45;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(2,3,5,0.8) 100%);
    }

    /* ===== PORTFOLIO NODE STYLES ===== */
    .portfolio-node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.4s ease, z-index 0s;
      /* Orbital micro-movement - no collisions because each node moves in its own tiny orbit */
      animation: node-orbit var(--orbit-dur, 12s) ease-in-out infinite;
      animation-delay: var(--orbit-del, 0s);
    }
    .portfolio-node:hover {
      z-index: 20;
      transform: translate(-50%, -50%) scale(1.15);
      animation-play-state: paused;
    }

    /* Tiny orbital movements - max 4px in any direction, unique per node via CSS vars */
    @keyframes node-orbit {
      0% { transform: translate(-50%, -50%) translate(0, 0); }
      25% { transform: translate(-50%, -50%) translate(var(--orbit-x1, 2px), var(--orbit-y1, -2px)); }
      50% { transform: translate(-50%, -50%) translate(var(--orbit-x2, 0px), var(--orbit-y2, 3px)); }
      75% { transform: translate(-50%, -50%) translate(var(--orbit-x3, -2px), var(--orbit-y3, 1px)); }
      100% { transform: translate(-50%, -50%) translate(0, 0); }
    }

    .portfolio-node-frame {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      padding: 3px;
      background: transparent;
      transition: all 0.4s ease;
    }
    
    /* Nebula glow effect on hover */
    .portfolio-node-frame::before {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
        var(--node-color-dim) 0%,
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }
    .portfolio-node:hover .portfolio-node-frame::before {
      opacity: 1;
      animation: nebula-pulse-hover 2s ease-in-out infinite;
    }
    
    @keyframes nebula-pulse-hover {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .portfolio-node-image {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: rgba(6,10,13,0.95);
      background-size: cover;
      background-position: center;
      border: 2px solid var(--node-color-dim);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(0,0,0,0.5);
      transition: all 0.4s ease;
    }
    .portfolio-node:hover .portfolio-node-image {
      border-color: var(--node-color);
      box-shadow: 
        inset 0 0 20px rgba(0,0,0,0.8),
        0 0 25px var(--node-color-dim),
        0 0 50px var(--node-color-dim);
    }
    .portfolio-node-image.no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      color: var(--node-color);
      text-shadow: 0 0 20px var(--node-color);
    }

    .portfolio-node-label {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .portfolio-node:hover .portfolio-node-label {
      transform: translateX(-50%) translateY(5px);
    }
    .portfolio-node-label .artist {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .portfolio-node-label .show {
      font-size: 0.65rem;
      color: var(--node-color);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
      opacity: 0.8;
    }

    /* Production (Teal) */
    .portfolio-node.production {
      --node-color: var(--forge-teal);
      --node-color-dim: rgba(56,199,204,0.4);
    }
    /* Software (Lavender) */
    .portfolio-node.software {
      --node-color: var(--forge-lavender);
      --node-color-dim: rgba(167,139,250,0.4);
    }
    /* About (Amber) */
    .portfolio-node.about {
      --node-color: var(--forge-amber);
      --node-color-dim: rgba(245,158,11,0.4);
    }

    /* Expanded node state - when clicked */
    .portfolio-node.node-expanded {
      z-index: 1005 !important;
      animation: none !important;
      position: fixed !important;
      left: 50% !important;
      top: 30% !important;
      transform: translate(-50%, -50%) !important;
      cursor: pointer;
      isolation: isolate;
    }
    .portfolio-node.node-expanded .portfolio-node-frame {
      width: 450px;
      height: 450px;
    }
    .portfolio-node.node-expanded .portfolio-node-frame::before {
      opacity: 0;
    }
    .portfolio-node.node-expanded .portfolio-node-image {
      border-width: 4px;
      box-shadow: 
        inset 0 0 30px rgba(0,0,0,0.4),
        0 0 50px var(--node-color-dim),
        0 0 100px var(--node-color-dim);
    }
    .portfolio-node.node-expanded .portfolio-node-image.no-image {
      font-size: 5rem;
    }
    .portfolio-node.node-expanded .portfolio-node-label {
      display: none;
    }
    
    /* Nebula ring effect around expanded node - render BEHIND the node */
    .nebula-ring {
      position: fixed;
      left: 50%;
      top: 30%;
      transform: translate(-50%, -50%);
      width: 540px;
      height: 540px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 998;
      opacity: 0;
      transition: opacity 0.5s ease;
      mix-blend-mode: screen;
    }
    .nebula-ring.show {
      opacity: 0.8;
    }
    
    /* Outer nebula glow layers */
    .nebula-ring::before {
      content: '';
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        var(--ring-color-1, rgba(56,199,204,0.3)) 30deg,
        transparent 60deg,
        var(--ring-color-2, rgba(34,211,238,0.4)) 120deg,
        transparent 150deg,
        var(--ring-color-1, rgba(56,199,204,0.35)) 210deg,
        transparent 240deg,
        var(--ring-color-2, rgba(34,211,238,0.3)) 300deg,
        transparent 330deg,
        var(--ring-color-1, rgba(56,199,204,0.25)) 360deg
      );
      filter: blur(20px);
      animation: nebula-ring-rotate 12s linear infinite;
    }
    .nebula-ring::after {
      content: '';
      position: absolute;
      inset: -25px;
      border-radius: 50%;
      background: conic-gradient(
        from 180deg,
        transparent 0deg,
        var(--ring-color-2, rgba(34,211,238,0.5)) 45deg,
        transparent 90deg,
        var(--ring-color-1, rgba(56,199,204,0.6)) 180deg,
        transparent 225deg,
        var(--ring-color-2, rgba(34,211,238,0.5)) 315deg,
        transparent 360deg
      );
      filter: blur(12px);
      animation: nebula-ring-rotate 8s linear infinite reverse;
    }
    
    /* Inner bright ring */
    .nebula-ring-inner {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: 
        linear-gradient(var(--forge-darker), var(--forge-darker)) padding-box,
        conic-gradient(
          from 0deg,
          var(--ring-color-bright, rgba(56,199,204,0.8)) 0deg,
          transparent 20deg,
          var(--ring-color-bright, rgba(56,199,204,0.9)) 90deg,
          transparent 110deg,
          var(--ring-color-bright, rgba(56,199,204,0.7)) 180deg,
          transparent 200deg,
          var(--ring-color-bright, rgba(56,199,204,0.85)) 270deg,
          transparent 290deg,
          var(--ring-color-bright, rgba(56,199,204,0.8)) 360deg
        ) border-box;
      animation: nebula-ring-rotate 6s linear infinite;
      filter: drop-shadow(0 0 8px var(--ring-color-bright));
    }
    
    /* Sparkle particles around ring */
    .nebula-ring-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ring-color-bright, rgba(56,199,204,1));
      box-shadow: 0 0 8px var(--ring-color-bright), 0 0 15px var(--ring-color-bright);
      animation: particle-orbit var(--particle-dur, 5s) linear infinite;
    }
    
    @keyframes nebula-ring-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes particle-orbit {
      0% { 
        transform: rotate(var(--particle-start, 0deg)) translateX(275px) rotate(calc(var(--particle-start, 0deg) * -1));
        opacity: 0.3;
      }
      25% { opacity: 1; }
      50% { opacity: 0.5; }
      75% { opacity: 1; }
      100% { 
        transform: rotate(calc(var(--particle-start, 0deg) + 360deg)) translateX(275px) rotate(calc((var(--particle-start, 0deg) + 360deg) * -1));
        opacity: 0.3;
      }
    }
    
    /* Category-specific ring colors */
    .nebula-ring.production {
      --ring-color-1: rgba(56,199,204,0.3);
      --ring-color-2: rgba(34,211,238,0.4);
      --ring-color-bright: rgba(56,199,204,0.9);
    }
    .nebula-ring.software {
      --ring-color-1: rgba(167,139,250,0.3);
      --ring-color-2: rgba(139,92,246,0.4);
      --ring-color-bright: rgba(167,139,250,0.9);
    }
    .nebula-ring.about {
      --ring-color-1: rgba(245,158,11,0.3);
      --ring-color-2: rgba(251,146,60,0.4);
      --ring-color-bright: rgba(245,158,11,0.9);
    }
    
    /* Info card that appears below expanded node */
    .node-info-card {
      position: fixed;
      left: 50%;
      top: calc(30% + 280px);
      transform: translateX(-50%);
      background: rgba(6, 10, 13, 0.97);
      border: 2px solid var(--forge-teal);
      border-radius: 16px;
      padding: 28px 36px;
      min-width: 380px;
      max-width: 500px;
      z-index: 1010;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      box-shadow: 
        0 0 60px rgba(56,199,204,0.4),
        0 0 120px rgba(56,199,204,0.2),
        inset 0 0 60px rgba(56,199,204,0.05),
        0 25px 80px rgba(0,0,0,0.6);
      backdrop-filter: blur(15px);
      overflow: hidden;
    }
    /* Circuit pattern overlay on modal */
    .node-info-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('circuitry-bg.webp') center center / cover no-repeat;
      opacity: 0.15;
      pointer-events: none;
      z-index: -1;
    }
    /* Animated glow border effect */
    .node-info-card::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        var(--card-glow, rgba(56,199,204,0.6)) 60deg,
        transparent 120deg,
        var(--card-glow, rgba(56,199,204,0.5)) 200deg,
        transparent 260deg,
        var(--card-glow, rgba(56,199,204,0.4)) 320deg,
        transparent 360deg
      );
      filter: blur(8px);
      animation: card-glow-rotate 8s linear infinite;
      z-index: -2;
      opacity: 0.7;
    }
    @keyframes card-glow-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .node-info-card.show {
      opacity: 1;
      pointer-events: auto;
    }
    /* Category-specific card glow colors */
    #expanded-view.production .node-info-card {
      --card-glow: rgba(56,199,204,0.6);
    }
    #expanded-view.software .node-info-card {
      border-color: var(--forge-lavender);
      --card-glow: rgba(167,139,250,0.6);
      box-shadow: 
        0 0 60px rgba(167,139,250,0.4),
        0 0 120px rgba(167,139,250,0.2),
        inset 0 0 60px rgba(167,139,250,0.05),
        0 25px 80px rgba(0,0,0,0.6);
    }
    #expanded-view.about .node-info-card {
      border-color: var(--forge-amber);
      --card-glow: rgba(245,158,11,0.6);
      box-shadow: 
        0 0 60px rgba(245,158,11,0.4),
        0 0 120px rgba(245,158,11,0.2),
        inset 0 0 60px rgba(245,158,11,0.05),
        0 25px 80px rgba(0,0,0,0.6);
    }
    .node-info-card .card-artist {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .node-info-card .card-show {
      font-size: 0.95rem;
      color: var(--forge-teal);
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      text-shadow: 0 0 15px currentColor;
    }
    #expanded-view.software .node-info-card .card-show { color: var(--forge-lavender); }
    #expanded-view.about .node-info-card .card-show { color: var(--forge-amber); }
    .node-info-card .card-year {
      display: inline-block;
      background: rgba(56,199,204,0.2);
      color: var(--forge-teal);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
      border: 1px solid rgba(56,199,204,0.3);
    }
    #expanded-view.software .node-info-card .card-year {
      background: rgba(167,139,250,0.2);
      color: var(--forge-lavender);
      border-color: rgba(167,139,250,0.3);
    }
    #expanded-view.about .node-info-card .card-year {
      background: rgba(245,158,11,0.2);
      color: var(--forge-amber);
      border-color: rgba(245,158,11,0.3);
    }
    .node-info-card .card-role {
      font-size: 0.9rem;
      color: #e5e7eb;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .node-info-card .card-credits {
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 14px;
    }
    .node-info-card .card-credit {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .node-info-card .card-credit:last-child {
      border-bottom: none;
    }
    .node-info-card .credit-role {
      color: #6b7280;
    }
    .node-info-card .credit-name {
      color: #d1d5db;
      text-align: right;
    }
    .node-info-card .credit-company {
      color: var(--forge-teal);
      font-size: 0.68rem;
      opacity: 0.9;
    }
    #expanded-view.software .node-info-card .credit-company { color: var(--forge-lavender); }
    #expanded-view.about .node-info-card .credit-company { color: var(--forge-amber); }
    .node-info-card .card-hint {
      text-align: center;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.4);
      margin-top: 18px;
      font-style: italic;
    }
    
    /* Dim other nodes when one is expanded */
    #expanded-container.has-expanded .portfolio-node:not(.node-expanded) {
      opacity: 0.15;
      pointer-events: none;
    }
    #expanded-container.has-expanded .constellation-line {
      opacity: 0.05;
    }
    
    /* Overlay for clicking to close */
    .expanded-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 996;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .expanded-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Year nebula sections */
    .year-nebula {
      will-change: opacity;
      transition: opacity 0.5s ease;
    }
    .year-label {
      user-select: none;
    }
    
    /* Constellation lines connecting nodes */
    #constellation-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .constellation-line {
      stroke: var(--line-color, rgba(56,199,204,0.3));
      stroke-width: 1;
      opacity: 0.3;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    
    /* Energy lines hidden - keeping simple */
    .constellation-line-energy {
      display: none;
    }
    
    /* Dragging state for nodes */
    .portfolio-node.dragging {
      z-index: 100 !important;
      cursor: grabbing !important;
      animation: none !important;
      transition: none !important;
    }
    .portfolio-node.dragging .portfolio-node-frame::before {
      opacity: 1;
    }
    .portfolio-node {
      cursor: grab;
    }

    /* ===== CIRCUIT ROAD TIMELINE ===== */
    .circuit-road {
      position: relative;
      width: 100%;
      padding: 20px 0;
    }
    
    /* Central circuit spine */
    .circuit-spine {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, 
        var(--circuit-color, rgba(56,199,204,0.6)) 0%,
        var(--circuit-color, rgba(56,199,204,0.3)) 100%
      );
      transform: translateX(-50%);
      z-index: 1;
    }
    .circuit-spine::before,
    .circuit-spine::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--circuit-color, rgba(56,199,204,0.8));
      box-shadow: 0 0 20px var(--circuit-color, rgba(56,199,204,0.6));
    }
    .circuit-spine::before { top: -8px; }
    .circuit-spine::after { bottom: -8px; }
    
    /* Year marker */
    .circuit-year {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 0;
      z-index: 10;
    }
    .circuit-year-badge {
      background: var(--forge-darker);
      border: 3px solid var(--circuit-color, var(--forge-teal));
      border-radius: 30px;
      padding: 12px 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--circuit-color, var(--forge-teal));
      text-shadow: 0 0 20px currentColor;
      box-shadow: 0 0 30px var(--circuit-glow, rgba(56,199,204,0.4));
    }
    
    /* Single circuit node row */
    .circuit-node-row {
      position: relative;
      display: flex;
      align-items: center;
      padding: 40px 0;
      min-height: 220px;
    }
    .circuit-node-row.left {
      flex-direction: row;
    }
    .circuit-node-row.right {
      flex-direction: row-reverse;
    }
    
    /* The node (image circle) */
    .circuit-node {
      flex-shrink: 0;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid var(--circuit-color, var(--forge-teal));
      background: var(--forge-darker);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px var(--circuit-glow, rgba(56,199,204,0.3));
      z-index: 10;
    }
    .circuit-node:hover {
      transform: scale(1.08);
      box-shadow: 0 0 50px var(--circuit-glow, rgba(56,199,204,0.5));
    }
    .circuit-node img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .circuit-node .node-initial {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--circuit-color, var(--forge-teal));
      text-shadow: 0 0 30px currentColor;
      background: radial-gradient(circle at 30% 30%, rgba(56,199,204,0.15), transparent);
    }
    
    /* Circuit trace connecting node to center spine */
    .circuit-trace {
      flex-grow: 1;
      height: 4px;
      background: var(--circuit-color, rgba(56,199,204,0.5));
      position: relative;
      margin: 0 -2px;
    }
    .circuit-trace::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--circuit-color, var(--forge-teal));
      box-shadow: 0 0 15px var(--circuit-color, rgba(56,199,204,0.8));
    }
    .circuit-node-row.left .circuit-trace::before { right: -7px; }
    .circuit-node-row.right .circuit-trace::before { left: -7px; }
    
    /* Metadata card */
    .circuit-meta {
      flex-grow: 1;
      max-width: 400px;
      padding: 25px 30px;
      background: rgba(6,10,13,0.9);
      border: 2px solid var(--circuit-color-dim, rgba(56,199,204,0.3));
      border-radius: 12px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    .circuit-node-row.left .circuit-meta { margin-left: 0; margin-right: 30px; }
    .circuit-node-row.right .circuit-meta { margin-right: 0; margin-left: 30px; }
    
    .circuit-meta .meta-artist {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .circuit-meta .meta-show {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: var(--circuit-color, var(--forge-teal));
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .circuit-meta .meta-role {
      font-size: 0.95rem;
      color: #d1d5db;
      margin-bottom: 15px;
      padding: 10px 15px;
      background: rgba(56,199,204,0.08);
      border-left: 3px solid var(--circuit-color, var(--forge-teal));
      border-radius: 0 8px 8px 0;
    }
    .circuit-meta .meta-credits {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
    }
    .circuit-meta .meta-credit {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      padding: 5px 0;
      color: #9ca3af;
    }
    .circuit-meta .meta-credit .credit-name {
      color: #e5e7eb;
      text-align: right;
    }
    .circuit-meta .meta-credit .credit-company {
      color: var(--circuit-color, var(--forge-teal));
      font-size: 0.65rem;
    }
    
    /* Category color overrides */
    #expanded-view.production .circuit-road {
      --circuit-color: var(--forge-teal);
      --circuit-color-dim: rgba(56,199,204,0.3);
      --circuit-glow: rgba(56,199,204,0.4);
    }
    #expanded-view.software .circuit-road {
      --circuit-color: var(--forge-lavender);
      --circuit-color-dim: rgba(167,139,250,0.3);
      --circuit-glow: rgba(167,139,250,0.4);
    }
    #expanded-view.about .circuit-road {
      --circuit-color: var(--forge-amber);
      --circuit-color-dim: rgba(245,158,11,0.3);
      --circuit-glow: rgba(245,158,11,0.4);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .circuit-node-row {
        flex-direction: column !important;
        padding: 30px 20px;
      }
      .circuit-node-row.left .circuit-meta,
      .circuit-node-row.right .circuit-meta {
        margin: 20px 0 0 0;
        max-width: 100%;
      }
      .circuit-trace {
        width: 4px;
        height: 30px;
        margin: 0;
      }
      .circuit-trace::before {
        bottom: -7px;
        top: auto;
        left: 50%;
        transform: translateX(-50%);
      }
      .circuit-spine {
        display: none;
      }
    }

    /* Updated detail panel for portfolio */
    #detail-panel .credits {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #detail-panel .credit-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #detail-panel .credit-role {
      color: #6b7280;
    }
    #detail-panel .credit-name {
      color: #e5e7eb;
      text-align: right;
    }
    #detail-panel .credit-company {
      color: var(--forge-teal);
      font-size: 0.6rem;
    }
    #detail-panel.software .credit-company { color: var(--forge-lavender); }
    #detail-panel.about .credit-company { color: var(--forge-amber); }

    #detail-panel .your-role {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--forge-teal);
      margin: 8px 0;
      padding: 8px 12px;
      background: rgba(56,199,204,0.1);
      border-radius: 6px;
      border-left: 3px solid var(--forge-teal);
    }
    #detail-panel.software .your-role {
      color: var(--forge-lavender);
      background: rgba(167,139,250,0.1);
      border-left-color: var(--forge-lavender);
    }
    #detail-panel.about .your-role {
      color: var(--forge-amber);
      background: rgba(245,158,11,0.1);
      border-left-color: var(--forge-amber);
    }

    #detail-panel .year-badge {
      position: absolute;
      top: 15px;
      right: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #6b7280;
    }
    
    /* Subtle nebula background */
    .nebula-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -2;
      pointer-events: none;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 30%, rgba(56,199,204,0.12) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 75% 20%, rgba(167,139,250,0.10) 0%, transparent 45%),
        radial-gradient(ellipse 70% 60% at 85% 70%, rgba(56,199,204,0.10) 0%, transparent 50%),
        radial-gradient(ellipse 50% 50% at 10% 80%, rgba(167,139,250,0.08) 0%, transparent 40%),
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(56,199,204,0.06) 0%, transparent 60%),
        var(--forge-darker);
    }
    
    /* Circuit guardrails */
    .circuit-guardrails {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .guardrail-left, .guardrail-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 120px;
    }
    .guardrail-left { left: 20px; }
    .guardrail-right { right: 20px; }
    .guardrail-left svg, .guardrail-right svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .guardrail-trace {
      fill: none;
      stroke: rgba(56,199,204,0.4);
      stroke-width: 3;
      stroke-linecap: square;
      filter: drop-shadow(0 0 8px rgba(56,199,204,0.2));
    }
    .guardrail-pulse {
      position: absolute;
      width: 4px;
      height: 40px;
      background: linear-gradient(180deg, transparent, var(--forge-cyan), var(--forge-teal), transparent);
      border-radius: 2px;
      box-shadow: 0 0 15px var(--forge-teal);
      animation: guardrail-pulse-flow 10s ease-in-out infinite;
    }
    .guardrail-pulse.p1 { left: 30px; animation-delay: 0s; }
    .guardrail-pulse.p2 { left: 60px; animation-delay: 3s; height: 30px; }
    .guardrail-pulse.p3 { left: 90px; animation-delay: 6s; height: 50px; }
    .guardrail-right .guardrail-pulse.p1 { left: auto; right: 30px; animation-delay: 1.5s; }
    .guardrail-right .guardrail-pulse.p2 { left: auto; right: 60px; animation-delay: 4.5s; }
    .guardrail-right .guardrail-pulse.p3 { left: auto; right: 90px; animation-delay: 7.5s; }
    @keyframes guardrail-pulse-flow {
      0% { top: -50px; opacity: 0; }
      5% { opacity: 0.7; }
      95% { opacity: 0.7; }
      100% { top: 100%; opacity: 0; }
    }
    @media (max-width: 1100px) {
      .guardrail-left { left: 0; opacity: 0.5; }
      .guardrail-right { right: 0; opacity: 0.5; }
    }
    @media (max-width: 900px) {
      .guardrail-left, .guardrail-right { width: 80px; opacity: 0.3; }
    }
