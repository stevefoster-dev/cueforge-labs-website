  <script>
    // portfolioData is loaded from portfolio-data.js
    
    // Categories object maps portfolioData to display format
    const categories = {
      production: {
        name: 'Production',
        color: '#38c7cc',
        items: portfolioData.production.map(p => ({
          id: p.id,
          name: p.artist,
          type: p.show,
          desc: p.role,
          tags: [p.year.toString(), p.role.split(',')[0].trim()]
        }))
      },
      software: {
        name: 'Software',
        color: '#a78bfa',
        items: portfolioData.software.map(s => ({
          id: s.id,
          name: s.name,
          type: s.type,
          desc: s.desc,
          tags: s.tech.slice(0, 3)
        }))
      },
      about: {
        name: 'About',
        color: '#f59e0b',
        items: portfolioData.about.map(a => ({
          id: a.id,
          name: a.name,
          type: a.type === 'bio' ? 'Creative Technologist' : a.type === 'resume' ? 'Experience' : a.type,
          desc: a.bio || a.content || '',
          tags: a.type === 'bio' ? ['Bio', '15+ Years'] : ['Resume', a.name]
        }))
      }
    };

    const canvas = document.getElementById('circuit-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, forgeRect = null, pulses = [], pulsesArrived = 0, forgeIgnited = false, startTime = 0;
    const isMobile = window.innerWidth < 768;
    const totalPulses = isMobile ? 10 : 20;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      const logoWrap = document.getElementById('logo-wrap');
      const rect = logoWrap.getBoundingClientRect();
      forgeRect = { left: rect.left - 15, right: rect.right + 15, top: rect.top - 10, bottom: rect.bottom + 10 };
    }

    function createCircuitPath(edge) {
      const path = [];
      let x, y;
      if (edge === 'top') { x = 60 + Math.random() * (W - 120); y = -10; }
      else if (edge === 'bottom') { x = 60 + Math.random() * (W - 120); y = H + 10; }
      else if (edge === 'left') { x = -10; y = 60 + Math.random() * (H - 120); }
      else { x = W + 10; y = 60 + Math.random() * (H - 120); }
      path.push({ x, y });

      const targetX = forgeRect.left + Math.random() * (forgeRect.right - forgeRect.left);
      const targetY = forgeRect.top + Math.random() * (forgeRect.bottom - forgeRect.top);
      let currentX = x, currentY = y;

      for (let i = 0; i < 2; i++) {
        const progress = (i + 1) / 2;
        const nextX = currentX + (targetX - currentX) * progress + (Math.random() - 0.5) * 40;
        const nextY = currentY + (targetY - currentY) * progress + (Math.random() - 0.5) * 40;
        if (Math.random() > 0.5) { path.push({ x: nextX, y: currentY }); path.push({ x: nextX, y: nextY }); }
        else { path.push({ x: currentX, y: nextY }); path.push({ x: nextX, y: nextY }); }
        currentX = nextX; currentY = nextY;
      }
      path.push({ x: targetX, y: targetY });
      return path;
    }

    class Pulse {
      constructor(path, delay) {
        this.path = path; this.delay = delay; this.progress = 0;
        this.speed = 0.004 + Math.random() * 0.002;
        this.tailLength = 0.08 + Math.random() * 0.05;
        this.active = false; this.arrived = false;
        this.brightness = 0.5 + Math.random() * 0.4;
      }
      update(time) {
        if (time < this.delay) return;
        this.active = true;
        this.progress += this.speed;
        if (this.progress >= 1 && !this.arrived) { this.arrived = true; pulsesArrived++; }
      }
      draw() {
        if (!this.active || this.progress > 1 + this.tailLength) return;
        const pathLength = this.path.length - 1;
        ctx.strokeStyle = 'rgba(56, 199, 204, 0.03)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.path[0].x, this.path[0].y);
        for (let i = 1; i < this.path.length; i++) ctx.lineTo(this.path[i].x, this.path[i].y);
        ctx.stroke();

        for (let t = Math.max(0, this.progress - this.tailLength); t <= Math.min(1, this.progress); t += 0.005) {
          const segIdx = Math.floor(t * pathLength);
          const segProg = (t * pathLength) % 1;
          if (segIdx >= pathLength) continue;
          const p1 = this.path[segIdx], p2 = this.path[segIdx + 1];
          const x = p1.x + (p2.x - p1.x) * segProg;
          const y = p1.y + (p2.y - p1.y) * segProg;
          const fadeProg = (t - (this.progress - this.tailLength)) / this.tailLength;
          const alpha = fadeProg * this.brightness * (this.progress <= 1 ? 1 : Math.max(0, 1 - (this.progress - 1) / this.tailLength));
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(56, 199, 204, ${alpha})`;
          ctx.fill();
        }
      }
    }

    function initPulses() {
      pulses = []; pulsesArrived = 0; forgeIgnited = false;
      const edges = ['top', 'bottom', 'left', 'right'];
      for (let i = 0; i < totalPulses; i++) {
        const edge = edges[Math.floor(Math.random() * 4)];
        pulses.push(new Pulse(createCircuitPath(edge), i * 40 + Math.random() * 100));
      }
    }

    function animate(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime;
      ctx.clearRect(0, 0, W, H);
      pulses.forEach(p => { p.update(elapsed); p.draw(); });
      if (!forgeIgnited && pulsesArrived >= totalPulses * 0.3) { forgeIgnited = true; igniteForge(); }
      if (!pulses.every(p => p.progress > 1 + p.tailLength)) requestAnimationFrame(animate);
    }

    function igniteForge() {
      const solidShape = document.getElementById('solid-shape');
      const logoSvg = document.getElementById('logo-svg');
      const aura = document.getElementById('forge-aura');
      const circuitGlows = document.getElementById('circuit-glows');
      const lensFlare = document.getElementById('lens-flare');
      const brand = document.getElementById('brand-text');
      const btn = document.getElementById('enter-btn');

      setTimeout(() => lensFlare.classList.add('show'), 100);
      setTimeout(() => solidShape.classList.add('show'), 300);
      setTimeout(() => aura.classList.add('on'), 800);
      setTimeout(() => circuitGlows.classList.add('show'), 1200);

      setTimeout(() => {
        solidShape.classList.add('fade');
        logoSvg.classList.add('show');
      }, 1800);

      setTimeout(() => document.getElementById('production-circuits').classList.add('active'), 2400);
      setTimeout(() => document.getElementById('software-circuits').classList.add('active'), 2700);
      setTimeout(() => document.getElementById('about-circuits').classList.add('active'), 3000);

      setTimeout(() => brand.classList.add('show'), 3400);
      setTimeout(() => btn.classList.add('show'), 3900);
    }

    // Debounce hover state to prevent fighting between adjacent regions
    let labelTimeout = null;
    let hideTimeout = null;
    let currentCategory = null;
    
    function showLabel(category) {
      clearTimeout(hideTimeout); // Cancel any pending hide
      if (currentCategory === category) return; // Already showing this one
      clearTimeout(labelTimeout);
      labelTimeout = setTimeout(() => {
        currentCategory = category;
        const label = document.getElementById('category-label');
        label.textContent = categories[category].name;
        label.className = 'show ' + category;
      }, 150); // Delay prevents rapid switching
    }

    function hideLabel() {
      clearTimeout(labelTimeout); // Cancel any pending show
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        currentCategory = null;
        document.getElementById('category-label').classList.remove('show');
      }, 400); // Longer delay on hide - smooth transition between sections
    }
    
    function highlightNebula(category) {
      const nebula = document.querySelector('.nebula-' + category);
      if (nebula) {
        nebula.style.opacity = '1';
        nebula.style.filter = 'brightness(1.2)';
      }
    }
    
    function unhighlightNebula(category) {
      const nebula = document.querySelector('.nebula-' + category);
      if (nebula) {
        nebula.style.opacity = '';
        nebula.style.filter = '';
      }
    }
    
    function highlightCircuit(category) {
      const circuit = document.getElementById('forge-' + category + '-circuit');
      if (circuit) {
        circuit.style.transition = 'opacity 0.4s ease, filter 0.4s ease';
        circuit.style.opacity = '1';
        circuit.style.filter = 'brightness(1.3)';
      }
    }
    
    function unhighlightCircuit(category) {
      const circuit = document.getElementById('forge-' + category + '-circuit');
      if (circuit) {
        circuit.style.transition = 'opacity 0.8s ease, filter 0.8s ease';
        circuit.style.opacity = '';
        circuit.style.filter = '';
      }
    }

    // Global state for constellation system
    let constellationState = {
      nodes: [],
      connections: [],
      svg: null,
      category: null
    };
    
    // Physics state for air hockey effect
    let nodeVelocities = new Map(); // nodeIdx -> {vx, vy}
    let physicsInterval = null;

    function expandCategory(key) {
      // Production section links to dedicated portfolio page
      if (key === 'production') {
        window.location.href = 'portfolio-circuit.html';
        return;
      }
      
      // Software section links to dedicated products page
      if (key === 'software') {
        window.location.href = 'software-circuit.html';
        return;
      }
      
      // About section links to dedicated about page
      if (key === 'about') {
        window.location.href = 'about-circuit.html';
        return;
      }
      
      const expandedView = document.getElementById('expanded-view');
      const container = document.getElementById('expanded-container');
      const title = document.getElementById('expanded-title');
      const data = portfolioData[key];

      // Clear existing content
      container.querySelectorAll('.portfolio-node, .expanded-node, #constellation-svg, .nebula-cloud, .year-nebula, .circuit-road').forEach(n => n.remove());

      expandedView.className = 'show ' + key;
      title.textContent = categories[key].name;

      // Reset state
      constellationState = { nodes: [], connections: [], svg: null, category: key };
      nodeVelocities = new Map();
      if (physicsInterval) clearInterval(physicsInterval);

      // ========== CIRCUIT ROAD LAYOUT ==========
      // Group items by year
      const yearGroups = {};
      data.forEach((item, idx) => {
        const year = item.year || 'Other';
        if (!yearGroups[year]) yearGroups[year] = [];
        yearGroups[year].push({ ...item, _idx: idx });
      });
      const years = Object.keys(yearGroups).sort((a, b) => b - a); // Newest first

      // Create the circuit road container
      const road = document.createElement('div');
      road.className = 'circuit-road';
      
      // Add the central spine
      const spine = document.createElement('div');
      spine.className = 'circuit-spine';
      road.appendChild(spine);

      let nodeIndex = 0;
      let isLeft = true; // Alternate sides

      years.forEach((year, yearIdx) => {
        // Year marker
        const yearMarker = document.createElement('div');
        yearMarker.className = 'circuit-year';
        yearMarker.innerHTML = `<div class="circuit-year-badge">${year}</div>`;
        road.appendChild(yearMarker);

        // Items for this year
        const items = yearGroups[year];
        items.forEach((item, itemIdx) => {
          const row = document.createElement('div');
          row.className = `circuit-node-row ${isLeft ? 'left' : 'right'}`;

          // Create node (image circle)
          const node = document.createElement('div');
          node.className = 'circuit-node';
          node._itemData = item;
          node._category = key;
          
          if (key === 'production' && item.image) {
            node.innerHTML = `<img src="${item.image}" alt="${item.artist}" onerror="this.parentElement.innerHTML='<div class=\\'node-initial\\'>${item.artist.charAt(0)}</div>'">`;
          } else {
            const initial = key === 'production' ? item.artist?.charAt(0) : 
                           key === 'software' ? item.name?.charAt(0) : 
                           item.name?.charAt(0) || '?';
            node.innerHTML = `<div class="node-initial">${initial}</div>`;
          }

          // Click to expand
          node.onclick = () => expandCircuitNode(node, item, key);

          // Create circuit trace
          const trace = document.createElement('div');
          trace.className = 'circuit-trace';

          // Create metadata card
          const meta = document.createElement('div');
          meta.className = 'circuit-meta';
          
          if (key === 'production') {
            let creditsHtml = '';
            if (item.credits && item.credits.length > 0) {
              creditsHtml = `<div class="meta-credits">
                ${item.credits.slice(0, 4).map(c => `
                  <div class="meta-credit">
                    <span class="credit-role">${c.role}</span>
                    <span class="credit-name">${c.name}${c.company ? `<br><span class="credit-company">${c.company}</span>` : ''}</span>
                  </div>
                `).join('')}
              </div>`;
            }
            meta.innerHTML = `
              <div class="meta-artist">${item.artist}</div>
              <div class="meta-show">${item.show}</div>
              <div class="meta-role">${item.role}</div>
              ${creditsHtml}
            `;
          } else if (key === 'software') {
            meta.innerHTML = `
              <div class="meta-artist">${item.name}</div>
              <div class="meta-show">${item.type}</div>
              <div class="meta-role">${item.desc || ''}</div>
              ${item.tech ? `<div class="meta-credits" style="display:flex;flex-wrap:wrap;gap:6px;padding-top:10px;">
                ${item.tech.map(t => `<span style="background:rgba(167,139,250,0.15);color:var(--forge-lavender);padding:4px 10px;border-radius:4px;font-size:0.7rem;">${t}</span>`).join('')}
              </div>` : ''}
            `;
          } else {
            meta.innerHTML = `
              <div class="meta-artist">${item.name}</div>
              <div class="meta-show">${item.title || item.type || ''}</div>
              <div class="meta-role">${item.bio || item.content || ''}</div>
            `;
          }

          // Assemble row (order depends on side)
          if (isLeft) {
            row.appendChild(node);
            row.appendChild(trace);
            row.appendChild(meta);
          } else {
            row.appendChild(meta);
            row.appendChild(trace);
            row.appendChild(node);
          }

          road.appendChild(row);
          isLeft = !isLeft; // Alternate
          nodeIndex++;
        });
      });

      // Set container height and add road
      container.style.height = 'auto';
      container.appendChild(road);

      // Show expanded view
      document.getElementById('forge-view').classList.remove('show');
      document.getElementById('hud').classList.remove('show');
      document.getElementById('back-btn').classList.add('show');
      hideLabel();
    }

    // Handle click on circuit node (optional expansion)
    function expandCircuitNode(node, item, category) {
      // For now, just highlight - could add modal later
      const allNodes = document.querySelectorAll('.circuit-node');
      allNodes.forEach(n => n.style.transform = '');
      node.style.transform = 'scale(1.15)';
      
      // Could show the existing detail panel here if desired
      // showPortfolioPanel(item, category);
    }

    // ========== OLD NEBULA CODE REMOVED ==========
    // The old physics-based nebula layout has been replaced with Circuit Road
    
    // Kept for compatibility - these functions are referenced elsewhere
    const lineColors = {
      production: 'rgba(56,199,204,0.35)',
      software: 'rgba(167,139,250,0.35)',
      about: 'rgba(245,158,11,0.35)'
    };
    const lineBrightColors = {
      production: 'rgba(56,199,204,0.9)',
      software: 'rgba(167,139,250,0.9)',
      about: 'rgba(245,158,11,0.9)'
    };
    
    // OLD NEBULA CODE COMPLETELY REMOVED
    // The following 370+ lines of nebula/physics code have been deleted.
    // The new Circuit Road layout is above in expandCategory().
    // Old code is preserved in git history.
    
    function _skipOldCode() { return; /* if (key === 'production') {
        // Group by year
        const yearGroups = {};
        sortedData.forEach(item => {
          if (!yearGroups[item.year]) yearGroups[item.year] = [];
          yearGroups[item.year].push(item);
        });
        // Shuffle within each year group
        Object.values(yearGroups).forEach(group => {
          for (let i = group.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [group[i], group[j]] = [group[j], group[i]];
          }

          if (dist < 0.5) {
            // Nodes are stacked - pick random escape direction
            const angle = Math.random() * Math.PI * 2;
            nx = Math.cos(angle);
            ny = Math.sin(angle);
          } else {
            nx = dx / dist;
            ny = dy / dist;
          }
          
          // Position exactly minDist away from dragged node
          let newX = dragX + nx * minDist;
          let newY = dragY + ny * minDist;
          
          // Constrain to year bounds (with padding)
          const bounds = otherNode._yearBounds;
          if (bounds) {
            const padX = 6;
            const padY = 8;
            newX = Math.max(bounds.leftPct + padX, Math.min(bounds.rightPct - padX, newX));
            newY = Math.max(bounds.topPct + padY, Math.min(bounds.topPct + bounds.heightPct - padY, newY));
          } else {
            newX = Math.max(10, Math.min(90, newX));
            newY = Math.max(8, Math.min(92, newY));
          }
          
          // Smooth transition
          otherNode.style.transition = 'left 0.12s ease-out, top 0.12s ease-out';
          otherNode.style.left = newX + '%';
          otherNode.style.top = newY + '%';
          otherNode._posX = newX;
          otherNode._posY = newY;
          
          if (otherIdx !== undefined) {
            updateConstellationLines(otherIdx, newX, newY);
          }
          
          // Clear transition after animation
          setTimeout(() => {
            if (otherNode) otherNode.style.transition = '';
          }, 130);
        }
      });
      
      // Second pass: resolve any secondary overlaps between non-dragged nodes
      // This prevents pushed nodes from stacking on each other
      setTimeout(() => {
        resolveSecondaryOverlaps(dragIdx);
      }, 50);
    }
    
    // Resolve overlaps between non-dragged nodes (called after primary push)
    function resolveSecondaryOverlaps(excludeIdx) {
      const minDist = 15;
      const nodes = constellationState.nodes.filter(n => 
        n._nodeIdx !== excludeIdx && 
        !n.classList.contains('node-expanded') &&
        !n.classList.contains('dragging')
      );
      
      for (let i = 0; i < nodes.length; i++) {
        const nodeA = nodes[i];
        const ax = parseFloat(nodeA.style.left);
        const ay = parseFloat(nodeA.style.top);
        
        for (let j = i + 1; j < nodes.length; j++) {
          const nodeB = nodes[j];
          const bx = parseFloat(nodeB.style.left);
          const by = parseFloat(nodeB.style.top);
          
          const dx = bx - ax;
          const dy = by - ay;
          const dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < minDist && dist > 0) {
            // Push nodeB away from nodeA (only move one to avoid oscillation)
            let nx, ny;
            if (dist < 0.5) {
              const angle = Math.random() * Math.PI * 2;
              nx = Math.cos(angle);
              ny = Math.sin(angle);
            } else {
              nx = dx / dist;
              ny = dy / dist;
            }
            
            let newX = ax + nx * minDist;
            let newY = ay + ny * minDist;
            
            const bounds = nodeB._yearBounds;
            if (bounds) {
              newX = Math.max(bounds.leftPct + 6, Math.min(bounds.rightPct - 6, newX));
              newY = Math.max(bounds.topPct + 8, Math.min(bounds.topPct + bounds.heightPct - 8, newY));
            }
            
            nodeB.style.transition = 'left 0.1s ease-out, top 0.1s ease-out';
            nodeB.style.left = newX + '%';
            nodeB.style.top = newY + '%';
            nodeB._posX = newX;
            nodeB._posY = newY;
            
            if (nodeB._nodeIdx !== undefined) {
              updateConstellationLines(nodeB._nodeIdx, newX, newY);
            }
            
            setTimeout(() => {
              if (nodeB) nodeB.style.transition = '';
            }, 110);
          }
        }
      }
    }

    // --- Node Expansion System ---
    let currentExpandedNode = null;
    let originalNodePosition = null;

    function toggleNodeExpanded(node, item, category) {
      if (node.classList.contains('node-expanded')) {
        collapseExpandedNode();
      } else {
        expandNode(node, item, category);
      }
    }

    function expandNode(node, item, category) {
      // Collapse any currently expanded node first
      if (currentExpandedNode) {
        collapseExpandedNode();
      }

      // Store reference and original position
      currentExpandedNode = node;
      originalNodePosition = {
        left: node.style.left,
        top: node.style.top,
        position: node.style.position
      };

      // Add expanded class to node and container
      node.classList.add('node-expanded');
      document.getElementById('expanded-container').classList.add('has-expanded');

      // Show overlay
      document.getElementById('expanded-overlay').classList.add('show');
      
      // Show nebula ring with category styling
      const nebulaRing = document.getElementById('nebula-ring');
      nebulaRing.className = 'nebula-ring show ' + category;

      // Populate and show info card
      const infoCard = document.getElementById('node-info-card');
      
      if (category === 'production') {
        document.getElementById('card-artist').textContent = item.artist;
        document.getElementById('card-show').textContent = item.show;
        document.getElementById('card-year').textContent = item.year;
        document.getElementById('card-role').textContent = item.role;
        
        const creditsHtml = item.credits.map(c => `
          <div class="card-credit">
            <span class="credit-role">${c.role}</span>
            <span class="credit-name">${c.name}${c.company ? `<br><span class="credit-company">${c.company}</span>` : ''}</span>
          </div>
        `).join('');
        document.getElementById('card-credits').innerHTML = creditsHtml;
      } else if (category === 'software') {
        document.getElementById('card-artist').textContent = item.name;
        document.getElementById('card-show').textContent = item.type;
        document.getElementById('card-year').textContent = '';
        document.getElementById('card-role').textContent = item.desc;
        document.getElementById('card-credits').innerHTML = item.tech.map(t => `<span class="tag" style="background: rgba(167,139,250,0.15); color: var(--forge-lavender); padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; margin: 2px;">${t}</span>`).join(' ');
      } else {
        document.getElementById('card-artist').textContent = item.name;
        document.getElementById('card-show').textContent = item.title || item.type;
        document.getElementById('card-year').textContent = '';
        document.getElementById('card-role').textContent = item.bio || item.content || '';
        document.getElementById('card-credits').innerHTML = '';
      }

      // Adjust info card color based on category
      infoCard.style.borderColor = category === 'production' ? 'var(--forge-teal)' : 
                                   category === 'software' ? 'var(--forge-lavender)' : 
                                   'var(--forge-amber)';
      
      // Show info card with slight delay for animation
      setTimeout(() => {
        infoCard.classList.add('show');
      }, 100);
    }

    function collapseExpandedNode() {
      if (!currentExpandedNode) return;

      // Remove expanded class
      currentExpandedNode.classList.remove('node-expanded');
      document.getElementById('expanded-container').classList.remove('has-expanded');

      // Restore original position
      if (originalNodePosition) {
        currentExpandedNode.style.left = originalNodePosition.left;
        currentExpandedNode.style.top = originalNodePosition.top;
        currentExpandedNode.style.position = originalNodePosition.position || '';
      }

      // Hide overlay, nebula ring, and info card
      document.getElementById('expanded-overlay').classList.remove('show');
      document.getElementById('nebula-ring').classList.remove('show');
      document.getElementById('node-info-card').classList.remove('show');

      currentExpandedNode = null;
      originalNodePosition = null;
    }

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && currentExpandedNode) {
        collapseExpandedNode();
      }
    });

    window.addEventListener('resize', resize);
    resize();
    setTimeout(() => { initPulses(); requestAnimationFrame(animate); }, 150);
  </script>
</body>
